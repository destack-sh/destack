[package]
name = "destack_cli"
description = "Destack CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
default-run = "destack"

[features]
default = ["dev"]
dev = ["tiktoken-rs"]
schema = ["schemars"]

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "destack"
path = "src/main.rs"

[[bin]]
name = "ds"
path = "src/bin/ds.rs"

[[bin]]
name = "dsc"
path = "src/bin/dsc.rs"

[[bin]]
name = "dsx"
path = "src/bin/dsx.rs"

[[bin]]
name = "generate-cli-schema"
path = "src/schema.rs"
required-features = ["schema"]

[dependencies]
# language
destack_ast = { workspace = true }
destack_codegen_js = { workspace = true }
destack_compiler = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_formatter = { workspace = true }
destack_json = { workspace = true }
destack_linter = { workspace = true }
destack_parser = { workspace = true }
destack_source = { workspace = true }
destack_resolver = { workspace = true }
destack_workspace = { workspace = true }
destack_runtime = { workspace = true }
destack_vm = { workspace = true }

# platform
destack_daemon = { workspace = true }
destack_lsp = { workspace = true }

# general
clap = { version = "4.5.4", features = ["derive"] }
clap_complete = "4.5.4"
console = "0.15"
indicatif = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.47.1" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
schemars = { workspace = true, optional = true }

# dev-only
tiktoken-rs = { version = "0.9", optional = true }

[dev-dependencies]

[lints]
workspace = true
