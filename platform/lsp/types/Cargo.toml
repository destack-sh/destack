[package]
name = "destack_lsp_types"
description = "LSP types for the Destack language server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["proposed"]
proposed = []

[dependencies]
bitflags = "1.0.1"
fluent-uri = "0.1.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_repr = "0.1"

[lints]
workspace = true
