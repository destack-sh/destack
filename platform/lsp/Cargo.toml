[package]
name = "destack_lsp"
description = "Destack Language Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "destack_lsp"
path = "src/main.rs"

[dependencies]
# language
destack_ast = { workspace = true }
destack_compiler = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_parser = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { workspace = true }

# general
dashmap = { workspace = true }
libc = "0.2.175"
parking_lot = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
	"macros",
	"rt-multi-thread",
	"io-std",
	"sync",
] }
tower-lsp-server = "0.22.1"
tracing = { workspace = true }
