# yaml-language-server: $schema=https://raw.githubusercontent.com/gauge-sh/tach/v0.9.3/public/tach-yml-schema.json
modules:
  - path: bench
    depends_on:
      - path: bench.utils
  - path: bench.cli
    depends_on:
      - path: bench.language
      - path: bench.proto
      - path: bench.runtime
      - path: bench.sql
      - path: bench.system
      - path: bench.utils
  - path: bench.language
    depends_on:
      - path: bench.proto
      - path: bench.utils
  - path: bench.proto
    depends_on:
      - path: bench.language
      - path: bench.utils
  - path: bench.runtime
    depends_on:
      - path: bench.language
      - path: bench.proto
      - path: bench.utils
  - path: bench.sql
    depends_on:
      - path: bench.language
      - path: bench.proto
      - path: bench.utils
  - path: bench.system
    depends_on:
      - path: bench.language
      - path: bench.proto
      - path: bench.sql
      - path: bench.utils
  - path: bench.test
    depends_on:
      - path: bench.language
      - path: bench.proto
      - path: bench.runtime
      - path: bench.sql
      - path: bench.system
      - path: bench.utils
  - path: bench.utils
    depends_on: []
exclude:
  - .*__pycache__
  - .*egg-info
  - docs
  - tests
  - venv
source_roots:
  - .
