[package]
name = "destack"
description = "Rust language client for Destack"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/destack-sh/destack"
homepage = "https://github.com/destack-sh/destack"
documentation = "https://docs.rs/destack"
keywords = ["destack", "typescript", "compiler", "runtime"]
categories = ["compilers", "development-tools"]

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
destack_artifact.workspace = true
destack_core.workspace = true
destack_dir.workspace = true
destack_heap.workspace = true
destack_js.workspace = true
destack_mir.workspace = true
destack_program.workspace = true
destack_qir.workspace = true
destack_query.workspace = true
destack_repository.workspace = true
destack_source.workspace = true
destack_workspace = { workspace = true, default-features = false }

[features]
default = ["native"]
native = ["destack_workspace/native"]

[dev-dependencies]
parking_lot.workspace = true

[lints]
workspace = true
