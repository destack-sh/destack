[project]
name = "destack-server"
version = "2025.08.06.1"
description = "Destack Python Server"
authors = [{ name = "Symbol Industries", email = "hello@symbol.industries" }]
requires-python = ">=3.13"

[tool.pytest_env]
ENVIRONMENT = "test"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
python_files = "test/**/*.py test/*.py"
python_classes = "!TestProfile"
pythonpath = ["."]
log_cli = true
addopts = [
	'-rP',
	"-vv",
	"--import-mode=importlib",
	"--color=yes",
	'--strict-markers',
]
markers = []
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
