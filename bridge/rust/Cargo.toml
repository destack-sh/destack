[package]
name = "destack"
description = "Rust language bridge for Destack"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"
repository = "https://github.com/destack-sh/destack"
homepage = "https://github.com/destack-sh/destack"
documentation = "https://docs.rs/destack"
keywords = ["destack", "typescript", "compiler", "runtime"]
categories = ["compilers", "development-tools"]

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
destack_bridge_language.workspace = true
destack_repository.workspace = true
destack_source.workspace = true
destack_workspace = { workspace = true, default-features = false }

[features]
default = ["native"]
native = ["destack_workspace/native"]

[dev-dependencies]
parking_lot.workspace = true

[lints]
workspace = true
