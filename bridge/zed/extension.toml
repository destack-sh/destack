id = "destack"
name = "Destack"
description = "Destack language, library, and platform support with LSP for DS, JS, TS, and TSX."
version = "0.55.4"
schema_version = 1
authors = ["Florian Cäsar <florian@symbol.industries>"]
repository = "https://github.com/destack-sh/destack"
themes = []
icon_themes = []
languages = ["languages/destack", "languages/mir"]

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

[lib]
kind = "Rust"
version = "0.7.0"

[language_servers.destack-lsp]
name = "Destack Language Server"
languages = ["Destack", "JavaScript", "TypeScript", "TSX"]
language_ids = { Destack = "destack", JavaScript = "javascript", TypeScript = "typescript", TSX = "typescriptreact" }

[grammars.destack]
repository = "https://github.com/destack-sh/destack"
rev = "main"
path = "language/grammar/destack/destack"

[grammars.mir]
repository = "https://github.com/destack-sh/destack"
rev = "main"
path = "language/grammar/mir"

[context_servers]

[agent_servers]

[slash_commands]
