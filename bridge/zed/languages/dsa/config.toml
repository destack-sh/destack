name = "Destack Bytecode Assembly"
grammar = "destack_bytecode"
path_suffixes = ["dsa"]
line_comments = ["// "]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "<", end = ">", close = true, newline = false },
]
word_characters = ["."]
tab_size = 4
