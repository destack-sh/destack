[build-system]
requires = ["maturin>=1.13.3,<2"]
build-backend = "maturin"

[project]
name = "destack"
version = "0.55.4"
description = "Python language bridge for Destack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Symbol Industries" }]
keywords = ["destack", "typescript", "compiler", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/destack-sh/destack"
Repository = "https://github.com/destack-sh/destack"
Issues = "https://github.com/destack-sh/destack/issues"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "destack._native"
python-source = "src"
