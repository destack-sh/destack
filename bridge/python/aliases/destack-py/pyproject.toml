[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "destack-py"
version = "0.55.4"
description = "Python legacy alias package for Destack"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["destack==0.55.4"]
authors = [{ name = "Symbol Industries" }]
keywords = ["destack", "python", "sdk", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/destack-sh/destack"
Repository = "https://github.com/destack-sh/destack"
Issues = "https://github.com/destack-sh/destack/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/destack_py"]
