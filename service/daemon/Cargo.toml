[package]
name = "destack_daemon"
description = "Destack Daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
schema = ["schemars"]

[dependencies]
# language
destack_artifact = { workspace = true }
destack_ast = { workspace = true }
destack_compiler = { workspace = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_formatter = { workspace = true }
destack_heap = { workspace = true }
destack_json = { workspace = true }
destack_linter = { workspace = true }
destack_mir = { workspace = true }
destack_parser = { workspace = true }
destack_query = { workspace = true }
destack_workspace = { workspace = true }
destack_resolver = { workspace = true }
destack_runtime = { workspace = true }
destack_session = { workspace = true }
destack_service = { workspace = true }
destack_source = { workspace = true }
destack_vm = { workspace = true }

# general
crossbeam-deque = { workspace = true }
crossbeam-channel = { workspace = true }
dashmap = { workspace = true }
fs2 = { workspace = true }
interprocess = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
postcard = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
