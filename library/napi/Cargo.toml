[package]
name = "destack_napi"
description = "Destack Node-API bindings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# language
destack_compiler = { workspace = true }
destack_dir = { workspace = true }
destack_javascript_ast = { workspace = true }
destack_javascript_machine = { workspace = true }
destack_javascript_transpiler = { workspace = true }
destack_resolver = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { workspace = true }

# platform
destack_daemon = { workspace = true }

# general
indexmap = { workspace = true }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true

[package.metadata.napi]
name = "destack-napi"
features = ["napi8"]
