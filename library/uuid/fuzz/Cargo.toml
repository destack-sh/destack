[workspace]
# fuzzer is in its own workspace

[package]
name = "destack_library_uuid_fuzz"
description = "Destack Library UUID Fuzz"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
destack_uuid = { path = ".." }

arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "destack_library_uuid_fuzz"
path = "fuzz_targets/uuid.rs"
test = false
doc = false
