[package]
name = "destack_library_lsp"
description = "Destack Library Language Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "rust/lib.rs"

[[bin]]
name = "destack_library_lsp"
path = "rust/main.rs"

[dependencies]
destack_language_lexer = { workspace = true }
destack_language_parser = { workspace = true }

# vendored LSP runtime replaces external deps
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
