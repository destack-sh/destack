[package]
name = "destack_library_lsp"
description = "Destack Standard Library Language Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "rust/lib.rs"

[[bin]]
name = "destack_library_lsp"
path = "rust/main.rs"

[dependencies]
destack_language_lexer = { workspace = true }
destack_language_parser = { workspace = true }

# TODO(destack_library_lsp): vendor tokio
tokio = { version = "1.47.1", features = [
	"rt-multi-thread",
	"macros",
	"io-util",
	"sync",
	"io-std",
] }
# vendored LSP runtime replaces this
# tower-lsp-server = { version = "0.22.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
