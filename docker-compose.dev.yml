version: '3'

services:
  db:
    image: postgres:14.5-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      POSTGRES_PASSWORD: bench
    ports:
      - '5432:5432'

  search:
    image: opensearchproject/opensearch:2.9.0 # should be same as in infra
    restart: on-failure
    environment:
      discovery.type: single-node
    ports:
      - '5601:5601'
      - '9200:9200'
      - '9300:9300'

  objects:
    image: minio/minio:RELEASE.2023-04-28T18-11-17Z
    restart: on-failure
    ports:
      - '19000:19000'
      - '19001:19001'
    environment:
      MINIO_ROOT_USER: 'AKIAIOSFODNN7EXAMPLE'
      MINIO_ROOT_PASSWORD: 'UKht5CaJPQ5ZCaAsfFY52URhg7RWv8V2489e9qSpoAhJRw97gttSBkEWU65wtGz'
    entrypoint: sh
    command: -c 'mkdir -p /data/bench && minio server --address ":19000" --console-address ":19001" /data'

  redis:
    image: redis:7.0-bullseye
    restart: on-failure
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    restart: on-failure
    volumes:
      - ./infra/envoy.yaml:/etc/envoy/envoy.yaml
    network_mode: host
    ports:
      - '8080:8080'
    extra_hosts:
        - "server:host-gateway"

volumes:
  redis-data:
