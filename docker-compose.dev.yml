version: '3'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: on-failure
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      POSTGRES_PASSWORD: bench
    volumes:
      - ./infra/local_postgres.conf:/etc/postgresql/local_postgresql.conf
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    command: ["postgres", "-c", "config_file=./etc/postgresql/local_postgresql.conf"]

  minio:
    image: minio/minio:latest
    restart: on-failure
    ports:
      - '19000:19000'
      - '19001:19001'
    environment:
      MINIO_ROOT_USER: 'AKIAIOSFODNN7EXAMPLE'
      MINIO_ROOT_PASSWORD: 'UKht5CaJPQ5ZCaAsfFY52URhg7RWv8V2489e9qSpoAhJRw97gttSBkEWU65wtGz'
    volumes:
      - minio_data:/data
    entrypoint: sh
    command: -c 'mkdir -p /data/bench && minio server --address ":19000" --console-address ":19001" /data'

  redis:
    image: redis:7-alpine
    restart: on-failure
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    restart: on-failure
    volumes:
      - ./infra/envoy.yaml:/etc/envoy/envoy.yaml
      # certificates are generated with openssl for local development:
      #  openssl req -x509 -newkey rsa:4096 -keyout infra/local_cert.key -out infra/local_cert.pem -days 10000 -nodes -subj "/CN=localhost" -addext "subjectAltName = DNS:localhost,IP:127.0.0.1"
      # and to make MacOS happy:
      #  security import infra/local_cert.pem -k ~/Library/Keychains/login.keychain-db
      #  (and then manually configure this 'localhost' cert as 'Always Trust' in Keychain Access)
      - ./infra/local_cert.key:/etc/envoy/ssl/cert.key
      - ./infra/local_cert.pem:/etc/envoy/ssl/cert.pem
    # can't use network_mode: host because it's only supported on Linux
    ports:
      - '8080:8080'
      - '9901:9901'

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - 16686:16686 # Jaeger UI
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 9411:9411 # Zipkin receiver
volumes:
  postgres_data:
  minio_data:
  redis_data:
