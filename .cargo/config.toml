[env]
RUST_BACKTRACE = { value = "full", force = true }
CRATE_CC_NO_DEFAULTS = { value = "1", force = false }
CC_x86_64_unknown_linux_gnu = { value = "zig cc -target x86_64-linux-gnu", force = false }
CC_aarch64_unknown_linux_gnu = { value = "zig cc -target aarch64-linux-gnu", force = false }
CC_x86_64_pc_windows_gnu = { value = "zig cc -target x86_64-windows-gnu", force = false }

[build]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "link-arg=-ld_new"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "link-arg=-ld_new"]

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "target-feature=+crt-static"]

[target.wasm32-wasi]
runner = "wasmtime run --dir=. --"
