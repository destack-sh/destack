[env]
RUST_BACKTRACE = { value = "full", force = true }
CRATE_CC_NO_DEFAULTS = { value = "1", force = false }
CC_x86_64_unknown_linux_gnu = { value = "scripts/toolchain/cc-x86_64-linux-gnu", relative = true, force = false }
CC_aarch64_unknown_linux_gnu = { value = "scripts/toolchain/cc-aarch64-linux-gnu", relative = true, force = false }
CC_x86_64_pc_windows_gnu = { value = "scripts/toolchain/x86_64-w64-mingw32-gcc", relative = true, force = false }
CARGO_TARGET_DIR = { value = "../../.cargo-targets/destack", relative = true, force = false }

[build]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "link-arg=-ld_new"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "link-arg=-ld_new"]

[target.x86_64-unknown-linux-gnu]
linker = "scripts/toolchain/cc-x86_64-linux-gnu"

[target.aarch64-unknown-linux-gnu]
linker = "scripts/toolchain/cc-aarch64-linux-gnu"

[target.x86_64-pc-windows-gnu]
linker = "scripts/toolchain/x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-musl-gcc"
rustflags = ["-C", "force-frame-pointers=yes", "-Z", "threads=8", "-C", "target-feature=+crt-static"]

[target.wasm32-wasip1]
runner = "wasmtime run --dir=. --"
