services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: on-failure
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      POSTGRES_PASSWORD: bench
    volumes:
      - ../dev/postgres.conf:/etc/postgresql/postgresql.conf
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    command: ["postgres", "-c", "config_file=./etc/postgresql/postgresql.conf"]

  minio:
    image: minio/minio:latest
    restart: on-failure
    ports:
      - '19000:19000'
      - '19001:19001'
    environment:
      MINIO_ROOT_USER: 'AKIAIOSFODNN7EXAMPLE'
      MINIO_ROOT_PASSWORD: 'UKht5CaJPQ5ZCaAsfFY52URhg7RWv8V2489e9qSpoAhJRw97gttSBkEWU65wtGz'
    volumes:
      - minio_data:/data
    entrypoint: sh
    # we manually create the required buckets here (outside of dev they're defined in terraform)
    command: -c 'mkdir -p /data/bench-test-private-eu-zurich-files && mkdir -p /data/bench-dev-private-eu-zurich-files && mkdir -p /data/bench-test-private-eu-frankfurt-files && mkdir -p /data/bench-dev-private-eu-frankfurt-files && minio server --address ":19000" --console-address ":19001" /data'

  redis:
    image: redis:7-alpine
    restart: on-failure
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  envoy:
    image: envoyproxy/envoy:v1.28-latest
    restart: on-failure
    volumes:
      - ../dev/envoy.yaml:/etc/envoy/envoy.yaml
      # certificates are generated with openssl for development:
      #  openssl req -x509 -newkey rsa:4096 -keyout cert.key -out cert.pem -days 10000 -nodes -subj "/CN=localhost" -addext "subjectAltName = DNS:localhost,IP:127.0.0.1"
      # and to make MacOS happy:
      #  security import cert.pem -k ~/Library/Keychains/login.keychain-db
      #  (and then manually configure this 'localhost' cert as 'Always Trust' in Keychain Access)
      - ../dev/cert.key:/etc/envoy/ssl/cert.key
      - ../dev/cert.pem:/etc/envoy/ssl/cert.pem
    network_mode: host
    # ports: 8080 & 9901 are not needed in host network mode

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - 16686:16686 # Jaeger UI
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 9411:9411 # Zipkin receiver

volumes:
  postgres_data:
  minio_data:
  redis_data:
