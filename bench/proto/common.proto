syntax = "proto3";

package symbolx.bench;

import "bench/proto/lang.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // Field should never be printed in logs.
  optional bool sensitive = 50000;
}

message ClientOrigin {
  ClientKind kind = 1;
  string id = 2;
  string nonce = 3;
}

// Core metadata for all RPC requests.
// (This is passed as specially encoded headers, but it's nice to have a common definition.)
message RpcMetadata {
  // Client
  optional ClientKind client_kind = 1;
  optional string client_id = 2;
  optional string client_nonce = 3;
  optional string client_access_token = 4;

  // Badge
  optional string badge_id = 5;
  optional string badge_link_token = 6;
  optional string badge_link_password = 7;
  optional string badge_key_value = 8;
}

// Scope for an operation against the Bench state graph.
message GraphScope {
  optional string bench_id = 1;
  optional string package_id = 4;
  optional string transaction_id = 5;
}

// Edit describes an edit to a Node.
// (Manually defined here since inline Node properties inside structs aren't supported.)
message EditData {
  EditType type = 1;
  NodeType node_type = 2;
  SomeNodeData node = 3;
  repeated sint32 properties = 4;
  ClientOrigin origin = 5;
  GraphScope scope = 6;
}

// Transaction of edits to a Node.
message TransactionData {
  string id = 1;
  repeated EditData edits = 2;
}