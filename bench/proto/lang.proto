  int64 count = 31;
}

// A human-readable Bench path to reference source nodes and fields/properties. Absolute or relative.
//     Paths are case-insensitive, support alphanum + spaces and use '/' as a primary separator.
//     Sub-nodes inside a block are prefixed by a ':'; any node's fields are accessed with '.'.
// 
//     flotothemoon/Mirror/Notion/Databases/Landscape
//     ^ bench      ^ blocks
//     flotothemoon/Applications/Birdy/MainScreen:Dashboard/Big Graphs/Graph1.name
//     ^ bench      ^ blocks                      ^ sub-nodes                ^ field
//     flotothemoon/Sandbox/Sales/Pipeline/Scraping/WebsiteSamples/Replit.document.title
//     ^ bench      ^ blocks                                              ^ field
// 
//     flotothemoon
//     ^ bench
//     flotothemoon.name
//     ^ bench      ^ field
//     flotothemoon-tests/Tests/Databases/TestPopulate.code
//     ^ bench            ^ blocks                     ^ field
// 
//     .
//     ^ current (ambiguous, default to block level)
//     ..
//     ^ parent (ambiguous)
//     ../../Header Screen:Header/Title.theme.primary.color
//     ^ blocks           ^ sub-nodes  ^ field
//     ../../../../Graphs
//     ^ parents (ambiguous)
// 
// 
//     symbolx@2024-01-01/Library/Common/Utils/DateUtils
//     ^ bench ^ package  ^ blocks
//     symbolx@MyNewFeature:2024-01-01/Applications/Chat/MainScreen:ChatInput/Input.text
//     ^ bench ^ branch     ^ package  ^ blocks                     ^ sub-nodes     ^ field
// 
//     ''
//     ERROR (invalid, empty path)
//     '../'
//     ERROR (invalid, trailing slash)
//     ../../Something/../SomethingElse
//     ERROR (invalid, cannot go up and down in the same path)
// 
//     The general syntax is:
//     [bench-name][@branch-name][:package-name][/[block-name][:sub-node-name]][.field-name]
//     For absolute paths, the bench name is required.
message BenchPathData {
  BenchType metatype = 1;
  optional string bench_slug = 30;
  repeated string block_path = 31;
  repeated string sub_node_path = 32;
  repeated string field_path = 33;
  optional string branch_slug = 34;
  optional string package_slug = 35;
}

// The context of a request for evaluating a policy.
message ContextData {
  BenchType metatype = 1;
  bool subject_is_system = 30;
  bool subject_is_authenticated = 31;
  bool subject_is_owner = 32;
  optional NodeReferenceData subject_user_ptr = 33;
  repeated ActionKind verbs = 41;
  repeated BenchType object_types = 50;
  repeated NodeReferenceData object_nodes_ptr = 51;
  repeated PropertyReferenceData object_properties = 52;
}

// Dependency(name: str = <factory>, version: str = <factory>, _status: bench.language.const.NodeStatus = None)
message DependencyData {
  BenchType metatype = 1;
  string name = 30;
  string version = 31;
}

// An expression (conditional, aggregation, sort, etc).
message ExpressionData {
  BenchType metatype = 1;
  ExpressionOp op = 30;
  optional NodeReferenceData field_ptr = 31;
  optional PropertyReferenceData property_ptr = 32;
  repeated ExpressionData clauses = 35;
  google.protobuf.Struct value = 36;
  optional SortMode mode = 37;
}

// A path of built-in Node/Struct properties and user-defined Fields.
message FieldPathData {
  BenchType metatype = 1;
  repeated FieldPathSegmentData segments = 30;
}

// A single segment of a FieldPath.
message FieldPathSegmentData {
  BenchType metatype = 1;
  PropertyReferenceData property = 30;
  optional NodeReferenceData field_ptr = 31;
}

// A reference to a file stored somewhere.
message FileData {
  BenchType metatype = 1;
  optional string sha512 = 30;
  optional int64 content_length = 31;
  optional string content_type = 32;
  string name = 33;
  optional NodeReferenceData object_ptr = 34;
  FileStatus status = 35;
}

// Icon(builtin_name: str = <factory>, custom_file: Optional[bench.language.file.File] = <factory>, _status: bench.language.const.NodeStatus = None)
message IconData {
  BenchType metatype = 1;
  string builtin_name = 30;
  optional FileData custom_file = 31;
}

// An entry. In a log.
message LogEntryData {
  BenchType metatype = 1;
  string id = 2;
  google.protobuf.Timestamp created_at = 32;
  string stream = 33;
  repeated NodeReferenceData session_ptr = 34;
  optional string level = 35;
  optional string logger = 36;
  optional NodeReferenceData block_ptr = 37;
  optional NodeReferenceData run_ptr = 38;
  optional string message = 39;
  optional google.protobuf.Struct value = 40;
}

// NodeReference(type: bench.language.const.NodeType = <factory>, id: Optional[uuid.UUID] = None, ck: Optional[uuid.UUID] = None, base_ck: Optional[uuid.UUID] = None, _status: bench.language.const.NodeStatus = None)
message NodeReferenceData {
  BenchType metatype = 1;
  NodeType type = 30;
  optional string id = 31;
  optional string ck = 32;
  optional string base_ck = 33;
}

// A policy regulating access to nodes within its scope.
message PolicyData {
  BenchType metatype = 1;
  optional string name = 30;
  repeated PolicyRuleData rules = 31;
  bool hidden = 32;
}

// A rule in a policy: <subject> + can/cannot <verb> + <object> [if condition].
message PolicyRuleData {
  BenchType metatype = 1;
  bool subject_is_authenticated = 31;
  bool subject_is_owner = 32;
  repeated NodeReferenceData subject_users_ptr = 33;
  PolicyEffect effect = 40;
  repeated ActionKind verb = 41;
  repeated BenchType object_types = 50;
  repeated NodeReferenceData object_nodes_ptr = 51;
  repeated PropertyReferenceData object_properties = 52;
  optional ExpressionData condition = 60;
}

// A path of Node/Struct properties.
message PropertyPathData {
  BenchType metatype = 1;
  repeated PropertyReferenceData properties = 30;
}

// PropertyReference(type: bench.language.const.BenchType = <factory>, id: Optional[int] = <factory>, references_type: Optional[bench.language.const.NodeType] = <factory>, _status: bench.language.const.NodeStatus = None)
message PropertyReferenceData {
  BenchType metatype = 1;
  BenchType type = 30;
  optional int64 id = 31;
  optional NodeType references_type = 32;
}

// RichText(spans: list['RichTextSpan'] = <factory>, plain_text: str | None = None, _status: bench.language.const.NodeStatus = None)
message RichTextData {
  BenchType metatype = 1;
  repeated RichTextSpanData spans = 30;
