// Icon(kind: bench.language.file.IconKind = False, emoji: Optional[str] = <factory>, file: Optional[ForwardRef('File')] = None, fa_name: Optional[str] = <factory>, color: Optional[ForwardRef('Color')] = None, parent: Union[ForwardRef('Struct'), ForwardRef('Node'), ForwardRef('Object'), NoneType] = None, _status: bench.language.const.InterpStatus = None, _updated_properties: bitarray.bitarray | None = None, parent_id: int = None, parent_key: str = None)
message IconData {
  ObjectType metatype = 1;
  IconKind kind = 30;
  optional string emoji = 31;
  optional FileData file = 32;
  optional string fa_name = 33;
  optional ColorData color = 40;
}

// A reference to a Node.
// If the reference is to a node in a Bench, we include the Bench ID and 'ck' (where available).
// If the second half of a ck is zero, it matches the closest node with the 'ck' prefix.
// Base tracks which node the node is 'based' on (like Record.parent->Block, Signal.type->Block).
message NodeReferenceData {
  ObjectType metatype = 1;
  NodeType type = 30;
  optional string id = 31;
  optional string ck = 32;
  optional string bench_id = 33;
  optional string base_ck = 34;
  optional string base_bench_id = 35;
}

// A position value. Absolute units are in pixels, ideally in Spacing scale.
message OffsetData {
  ObjectType metatype = 1;
  optional int32 top = 40;
  optional int32 right = 41;
  optional int32 bottom = 42;
  optional int32 left = 43;
  optional float top_relative = 44;
  optional float right_relative = 45;
  optional float bottom_relative = 46;
  optional float left_relative = 47;
}

// A human-readable Bench path to reference source nodes and their fields/properties. Absolute or relative.
// Paths are case-insensitive, support alphanum + spaces and use '/' as the primary node separator.
// Nodes 'below' block-level are prefixed with one ':'. Fields are accessed with '.' separators.
// 
// flotothemoon/Mirror/Notion/Databases/Landscape
// ^ bench      ^ blocks
// flotothemoon/Applications/Birdy/MainScreen:Dashboard/Big Graphs/Graph1.name
// ^ bench      ^ blocks                      ^ sub-block                ^ field
// flotothemoon/Sandbox/Sales/Pipeline/Scraping/WebsiteSamples/Replit.document.title
// ^ bench      ^ blocks                                              ^ field  ^ field
// 
// flotothemoon
// ^ bench
// flotothemoon.name
// ^ bench      ^ field
// flotothemoon-tests/Tests/Databases/TestPopulate.code
// ^ bench            ^ blocks                     ^ field
// 
// .
// ^ current
// ..
// ^ parent
// ../../Header Screen:Header/Title.theme.primary.color
// ^ blocks           ^ sub-nodes  ^ field
// ../../../../Graphs
// ^ parents
// 
// symbolx@2024-01-01/Library/Common/Utils/DateUtils
// ^ bench ^ package  ^ blocks
// symbolx@MyNewFeature:2024-01-01/Applications/Chat/MainScreen:ChatInput/Input.text
// ^ bench ^ branch     ^ package  ^ blocks                     ^ sub-nodes     ^ field
// 
// also relative:
// / -> package (=Package)
// $ -> module (=Block|Package)
// ^ -> page (=Block)
// $User -> module-unique node (=Block|View)
// ~ -> source module root (like $ but for templated)
// [<expr like ck=...>] -> dynamic Expression filter
// 
// ''
// ERROR (invalid, empty path)
// '../'
// ERROR (invalid, trailing slash)
// ../../Something/../SomethingElse
// ERROR (invalid, cannot go up and down in the same path)
// 
// The general syntax is:
// [bench-name][@branch-name][:package-name][/[block-name][:sub-node-name]][.field-name]
// For absolute paths, the bench name is required.
message PathData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  repeated PathSegmentData segments = 31;
}

// PathSegment(type: bench.language.path.PathSegmentType = <factory>, name: Optional[str] = None, reference: Optional[ForwardRef('Node')] = None, parent: Union[ForwardRef('Struct'), ForwardRef('Node'), ForwardRef('Object'), NoneType] = None, _status: bench.language.const.InterpStatus = None, _updated_properties: bitarray.bitarray | None = None, reference_ptr: 'NodeReference' = None, parent_id: int = None, parent_key: str = None)
