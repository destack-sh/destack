// The materialized access matrix generated for a specific subject to quickly evaluate access for objects.
message AccessMatrixData {
  BenchType metatype = 1;
  RequestSubjectData subject = 30;
  repeated RequestSubjectData identities = 32;
  repeated AccessZoneData zones = 33;
  repeated PolicyRuleData base_zones = 34;
}

// The pre-filtered access rules for a given identity.
//     Clients use this to indicate access rights, but - obviously - only our copy is binding.
message AccessZoneData {
  BenchType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 4;
  string scope_id = 30;
  int32 identity_id = 31;
  repeated PolicyRuleData rules = 32;
}

// The result of evaluating an action (multiple requests).
//     TODO @Feature @Security: store, query and watch action log
message ActionData {
  BenchType metatype = 1;
  RequestSubjectData subject = 30;
  PolicyEffect decision = 31;
  repeated RequestData requests = 32;
}

// The result of an aggregation expression.
message AggregationData {
  BenchType metatype = 1;
  AggregationOp op = 30;
  optional bool exists = 31;
  optional float scalar = 32;
  repeated AggregationBucketData buckets = 33;
}

// One bucket of an aggregation histogram.
message AggregationBucketData {
  BenchType metatype = 1;
  google.protobuf.Struct key = 30;
  int32 count = 31;
}

// A human-readable Bench path to reference source nodes and fields/properties. Absolute or relative.
//     Paths are case-insensitive, support alphanum + spaces and use '/' as a primary separator.
//     Sub-nodes inside a block are prefixed by a ':'; any node's fields are accessed with '.'.
// 
//     flotothemoon/Mirror/Notion/Databases/Landscape
//     ^ bench      ^ blocks
//     flotothemoon/Applications/Birdy/MainScreen:Dashboard/Big Graphs/Graph1.name
//     ^ bench      ^ blocks                      ^ sub-nodes                ^ field
//     flotothemoon/Sandbox/Sales/Pipeline/Scraping/WebsiteSamples/Replit.document.title
//     ^ bench      ^ blocks                                              ^ field
// 
//     flotothemoon
//     ^ bench
//     flotothemoon.name
//     ^ bench      ^ field
//     flotothemoon-tests/Tests/Databases/TestPopulate.code
//     ^ bench            ^ blocks                     ^ field
// 
//     .
//     ^ current (ambiguous, default to block level)
//     ..
//     ^ parent (ambiguous)
//     ../../Header Screen:Header/Title.theme.primary.color
//     ^ blocks           ^ sub-nodes  ^ field
//     ../../../../Graphs
//     ^ parents (ambiguous)
// 
// 
//     symbolx@2024-01-01/Library/Common/Utils/DateUtils
//     ^ bench ^ package  ^ blocks
//     symbolx@MyNewFeature:2024-01-01/Applications/Chat/MainScreen:ChatInput/Input.text
//     ^ bench ^ branch     ^ package  ^ blocks                     ^ sub-nodes     ^ field
// 
//     ''
//     ERROR (invalid, empty path)
//     '../'
//     ERROR (invalid, trailing slash)
//     ../../Something/../SomethingElse
//     ERROR (invalid, cannot go up and down in the same path)
// 
//     The general syntax is:
//     [bench-name][@branch-name][:package-name][/[block-name][:sub-node-name]][.field-name]
//     For absolute paths, the bench name is required.
message BenchPathData {
  BenchType metatype = 1;
  optional string bench_slug = 30;
  repeated string block_path = 31;
  repeated string sub_node_path = 32;
  repeated string field_path = 33;
  optional string branch_slug = 34;
  optional string package_slug = 35;
}

// An expression (conditional, aggregation, sort, etc).
message ExpressionData {
  BenchType metatype = 1;
  ExpressionOp op = 30;
  optional NodeReferenceData field_ptr = 31;
  optional PropertyReferenceData property_ptr = 32;
  repeated ExpressionData clauses = 35;
  google.protobuf.Struct value = 36;
  optional SortMode mode = 37;
}

// A path of built-in Node/Struct properties and user-defined Fields.
message FieldPathData {
  BenchType metatype = 1;
  repeated FieldPathSegmentData segments = 30;
}

// A single segment of a FieldPath.
message FieldPathSegmentData {
  BenchType metatype = 1;
  optional PropertyReferenceData property_ptr = 30;
  optional NodeReferenceData field_ptr = 31;
}

// A reference to a file stored somewhere.
message FileData {
  BenchType metatype = 1;
  optional string sha512 = 30;
  optional int32 content_length = 31;
  optional string content_type = 32;
  string name = 33;
  optional NodeReferenceData content_ptr = 34;
  FileStatus status = 35;
}

// Icon(kind: bench.language.icon.IconKind = False, emoji: Optional[str] = <factory>, type: Optional[bench.language.icon.IconType] = <factory>, image: Optional[ForwardRef('File')] = <factory>, _status: bench.language.const.NodeStatus = None)
message IconData {
  BenchType metatype = 1;
  IconKind kind = 30;
  optional string emoji = 31;
  optional IconType type = 32;
  optional FileData image = 33;
}

