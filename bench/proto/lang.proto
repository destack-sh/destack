// An evaluated access on some objects as part of a larger Request (by the same subject).
// As in PolicyRule, if the decision is Deny, the object_properties are the denied ones.
// (And if object_properties is unset, it applies to all properties.)
message AccessData {
  ObjectType metatype = 1;
  AccessMode mode = 30;
  PolicyEffect decision = 31;
  AccessType verb = 32;
  ObjectType object_type = 33;
  repeated PropertyReferenceData object_properties_ptr = 34;
}

// The materialized access matrix generated for a specific subject to quickly evaluate access for objects.
message AccessMatrixData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  SubjectData subject = 30;
  repeated SubjectData identities = 32;
  repeated AccessZoneData scoped_zones = 33;
  repeated AccessZoneData base_zones = 34;
}

// The trace of evaluating Access.
message AccessTraceData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  repeated PolicyRuleData matched_rules = 30;
}

// The pre-filtered access rules for a given identity.
// Clients use this to indicate access rights, but - obviously - only our copy is binding.
message AccessZoneData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  string scope_id = 30;
  int32 identity_id = 31;
  repeated PolicyRuleData rules = 32;
}

// The result of an aggregation expression.
message AggregationData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  AggregationOp op = 30;
  optional bool exists = 31;
  optional int32 count = 32;
  optional float scalar = 33;
  repeated AggregationBucketData buckets = 34;
}

// One bucket of an aggregation histogram.
message AggregationBucketData {
  ObjectType metatype = 1;
  google.protobuf.Struct key = 30;
  int32 count = 31;
}

// A box value. Absolute units are in pixels, ideally in Spacing scale.
message BoxData {
  ObjectType metatype = 1;
  optional int32 width = 50;
  optional int32 height = 51;
  optional float width_relative = 52;
  optional float height_relative = 53;
}

// Code(lines: list[bench.language.code_.CodeLine] = None, id: int = <factory>, parent: Union[ForwardRef('Struct'), ForwardRef('Node'), ForwardRef('Object'), NoneType] = None, order_key: str | None = None, set_properties: list[int] = <factory>, _status: bench.language.const.InterpStatus = None, _updated_properties: bitarray.bitarray | None = None, parent_id: int = None, parent_key: str = None)
message CodeData {
