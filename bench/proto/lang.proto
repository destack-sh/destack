}

// PathToken(type: bench.language.path.PathTokenType = <factory>, parent: Union[ForwardRef('Struct'), ForwardRef('Node'), ForwardRef('Object'), NoneType] = None, _status: bench.language.const.InterpStatus = None, _updated_properties: bitarray.bitarray | None = None, parent_id: int = None, parent_key: str = None)
message PathTokenData {
  ObjectType metatype = 1;
  PathTokenType type = 31;
}

// A policy regulating access to nodes within its scope.
// The scope is determined by where its attached, but may be further restricted using 'scopes'.
// 
// The basics of access control:
// 1. Access is DENIED implicitly unless explicitly and fully ALLOWED.
// 2. Policies are either attached
// a. directly to nodes (scoped to the node)
// b. or to a delegate (full scope or less as specified)
// 3. Policies are evaluated in order up the node graph, first match decides*.
// (This means you can read a sub block but not its parent.)
// 4. Every identity/role/... applicable to a subject is evaluated separately and *any* allow wins.
// 
// * Conceptually, we do 'ray trace' up the graph for every node/property/...,
// but actually doing that for every request is prohibitively expensive.
// Instead, we 'rasterize' an 'access matrix' and use 'zones' as a shortcut.
message PolicyData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  string name = 30;
  optional TextData text = 31;
  repeated PolicyRuleData rules = 32;
  repeated NodeReferenceData scopes_ptr = 33;
}

// A rule in a policy: [subject] + can/cannot [verb] + [object] [if condition].
// Subject, verb and object are ORed, in-group conditions are ANDed.
// (where None/empty -> wildcard, any value -> filter)
message PolicyRuleData {
  ObjectType metatype = 1;
  int32 id = 2;
  optional int32 parent_id = 3;
  optional string parent_key = 4;
  optional string order_key = 5;
  repeated int32 set_properties = 22;
  string name = 30;
  optional TextData text = 31;
  optional bool subject_is_delegated = 40;
  optional bool subject_is_authenticated = 41;
  optional bool subject_is_staff = 42;
  optional bool subject_is_member = 43;
  optional bool subject_is_owner = 44;
  PolicyEffect effect = 60;
  repeated AccessType verbs = 61;
  repeated AccessKind verb_kinds = 62;
  repeated NodeType object_node_types = 80;
  repeated PropertyReferenceData object_properties_ptr = 81;
  optional bool object_properties_is_system = 82;
  optional bool object_properties_is_sensitive = 83;
  optional bool object_properties_is_kernel = 84;
}

