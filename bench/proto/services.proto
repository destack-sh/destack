/*
All the services and any additional stuff not auto-generated in bench.proto.
 */

syntax = "proto3";

package symbolx.bench;

import "bench/proto/common.proto";
import "bench/proto/lang.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message ReadNodesOptions {
  // Load all ancestors of these nodes.
  repeated NodeType ancestor_types = 1;
  // Load all descendants of these types.
  repeated NodeType descendant_types = 2;
  // Additional deferred or related properties to load.
  repeated PropertyReferenceData include_properties = 3;
  // Additional regular properties to defer.
  repeated PropertyReferenceData exclude_properties = 4;
  // Select only these properties (override include/exclude).
  repeated PropertyReferenceData select_properties = 5;
  // Additional filter for every node (incl. root node, e.g. to load non-deleted, only archived, etc.).
  optional ExpressionData global_filter = 6;
}

//
// Global supervisor
//

message SignupUserRequest {
  UserData user = 1;
  string password = 2;
  ClientData client = 3;
}
message SignupUserResponse {
  UserData user = 1;
  string access_token = 2;
}

message LoginUserRequest {
  oneof user {
    string id = 1;
    string slug = 2;
    string email = 3;
  }
  string password = 4;
  ClientData client = 5;
}
message LoginUserResponse {
  UserData user = 1;
  ClientData client = 2;
  string access_token = 3;
}

message LogoutUserRequest {
}
message LogoutUserResponse {
}

message CreateOrganizationRequest {
  OrganizationData organization = 1;
}
message CreateOrganizationResponse {
  OrganizationData organization = 1;
}

message CreateBenchRequest {
  BenchData bench = 1;
}
message CreateBenchResponse {
  BenchData bench = 1;
}

message ReadNodesRequest {
  repeated NodeReferenceData roots = 1;
  optional ReadNodesOptions options = 2;
}
message ReadNodesResponse {
  repeated SomeNodeData nodes = 1;
}

message SearchNodesRequest {
  NodeType node_type = 1;
  NodeReferenceData parent = 2;
  ExpressionData filter = 3;
  repeated ExpressionData sort = 4;
  optional int32 limit = 5;
  optional string after = 6;
  optional ReadNodesOptions options = 7;
  optional bool count = 8;
}
message SearchNodesResponse {
  repeated SomeNodeData nodes = 1;
  repeated string cursors = 2;
  string start_cursor = 3;
  int32 total = 4;
}

message AggregateNodesRequest {
  NodeType node_type = 1;
  optional NodeReferenceData parent = 2;
  optional ExpressionData filter = 3;
  repeated ExpressionData sort = 4;
  optional int32 limit = 5;
  optional string after = 6;
  ExpressionData aggregation = 7;
}
message AggregateNodesResponse {
  AggregationData aggregation = 1;
}

message CommitEditsRequest {
  repeated EditData edits = 1;
}
message CommitEditsResponse {
  repeated SomeNodeData changed_nodes = 1;
}

message PushEditsRequest {
  repeated EditData bypassed_edits = 1;
}
message PushEditsResponse {
}

message WatchEditsRequest {
  repeated NodeType node_types = 1;
}
message WatchEditsResponse {
  repeated EditData edits = 1;
}

message RestartWorkerSetRequest {
  string bench_id = 1;
}
message RestartWorkerSetResponse {
  repeated WorkerSetData worker_sets = 1;
}

message PingWorkerSetRequest {
  string bench_id = 1;
}
message PingWorkerSetResponse {
  repeated WorkerSetData worker_sets = 1;
}

// Global supervisor: the 'control plane' for global stuff like Benches, Users, Workers, etc..
// Will probably shard this later.
// Frontend connects to this directly.
service GlobalSupervisor {
  //
  // User
  //

  // Create user account.
  rpc SignupUser(SignupUserRequest) returns (SignupUserResponse);
  // Login user account.
  rpc LoginUser(LoginUserRequest) returns (LoginUserResponse);
  // Logout user account.
  rpc LogoutUser(LogoutUserRequest) returns (LogoutUserResponse);
  // Create a Bench.
  rpc CreateBench(CreateBenchRequest) returns (CreateBenchResponse);

  //
  // General Bench IO for global nodes (should match PackageHost)  :BenchIO
  //

  // Get global nodes.
  rpc ReadNodes(ReadNodesRequest) returns (ReadNodesResponse);
  // Search global nodes.
  rpc SearchNodes(SearchNodesRequest) returns (SearchNodesResponse);
  // Aggregate global nodes.
  rpc AggregateNodes(AggregateNodesRequest) returns (AggregateNodesResponse);
  // Commits edits to global nodes.
  rpc CommitEdits(CommitEditsRequest) returns (CommitEditsResponse);
  // Subscribes to relevant global edits.
  rpc WatchEdits(WatchEditsRequest) returns (stream WatchEditsResponse);

  //
  // Worker stuff
  //

  // Force restart the worker set for a Bench.
  rpc RestartWorkerSet(RestartWorkerSetRequest) returns (PingWorkerSetResponse);
  // Ensure the worker set for a Bench is running.
  rpc PingWorkerSet(PingWorkerSetRequest) returns (PingWorkerSetResponse);
}

//
// Package host
//

message GetLogsRequest {}
message GetLogsResponse {
  repeated LogEntryData logs = 1;
}


message PasteNodesRequest {
  string source_package_id = 1;
  repeated NodeReferenceData source_nodes = 2;
  map<string, string> target_ids = 3;
  map<string, string> target_cks = 4;
  map<string, string> target_parent_ids = 5;
  map<string, string> target_order_keys = 6;
}
message PasteNodesResponse {
  repeated SomeNodeData pasted_nodes = 1;
}

message SnapshotPackageRequest {
  string name = 1;
  string tag = 2;
  string description = 3;
}
message SnapshotPackageResponse {
  string snapshot_project_version_id = 1;
}


message UploadFilesRequest {
  repeated FileData files = 1;
}
message UploadFilesResponse {
  repeated string post_urls = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DownloadFilesRequest {
  repeated FileData files = 1;
}
message DownloadFilesResponse {
  repeated string get_urls = 1;
  google.protobuf.Timestamp expires_at = 2;
}


message SearchLogsRequest {
  ExpressionData filter = 1;
  repeated ExpressionData sort = 2;
  int32 limit = 3;
  string after = 4;
}
message SearchLogsResponse {
  repeated LogEntryData logs = 1;
  repeated string cursors = 2;
  string start_cursor = 3;
}

message WatchLogsRequest {
}
message WatchLogsResponse {
  repeated LogEntryData logs = 1;
}

message PushWorkerLogsRequest {
  repeated LogEntryData logs = 1;
}
message PushWorkerLogsResponse {
}

message RunProxyBlockRequest {
  oneof block {
    BenchPathData path = 1;
    NodeReferenceData reference = 2;
  }
  google.protobuf.Struct inputs = 3;
  int32 timeout_ms = 4;
  string run_id = 5;
  string run_ck = 6;
}

message RunProxyBlockResponse {
  google.protobuf.Struct outputs = 1;
  google.protobuf.Struct error = 2;
}


// The Bench host for a specific package.
// Service is scoped to bench_id/package_id.
// Frontend connects to this directly.
// Not sure yet how branching will work here (maybe 'virtual' packages on top of main/env packages).
service PackageHost {
  //
  // General Bench IO for this package and global nodes (should match GlobalSupervisor) :BenchIO
  //

  // Reads local or global nodes.
  rpc ReadNodes(ReadNodesRequest) returns (ReadNodesResponse);
  // Searches nodes using filters.
  rpc SearchNodes(SearchNodesRequest) returns (SearchNodesResponse);
  // Aggregate nodes into statistics.
  rpc AggregateNodes(AggregateNodesRequest) returns (AggregateNodesResponse);
  // Commits a set of edits to the package. Optionally forward locally bypassed edits.
  rpc CommitEdits(CommitEditsRequest) returns (CommitEditsResponse);
  // Receive any relevant edits to this package.
  rpc WatchEdits(WatchEditsRequest) returns (stream WatchEditsResponse);

  //
  // Special Package IO
  //

  // Pushes locally bypassed edits to the package subscribers.
  rpc PushEdits(PushEditsRequest) returns (PushEditsResponse);
  // Paste specific inline nodes (and only those nodes) from this or another package.
  rpc PasteNodes(PasteNodesRequest) returns (PasteNodesResponse);
  // Create a full snapshot of this Bench package (copy to a new Bench package as specified).
  rpc Snapshot(SnapshotPackageRequest) returns (SnapshotPackageResponse);

  //
  // Files
  //

  // Get a signed URL to upload a file.
  rpc UploadFiles(UploadFilesRequest) returns (UploadFilesResponse);
  // Get a signed URL to download a file.
  rpc DownloadFiles(DownloadFilesRequest) returns (DownloadFilesResponse);

  //
  // Logs
  //

  // Searches all existing logs.
  rpc SearchLogs(SearchLogsRequest) returns (SearchLogsResponse);
  // Subscribes to future logs.
  rpc WatchLogs(WatchLogsRequest) returns (stream WatchLogsResponse);
  // Pushes logs from a worker *that are already stored* to notify frontend users connected to this host.
  rpc PushWorkerLogs(PushWorkerLogsRequest) returns (google.protobuf.Empty);

  //
  // Runs
  //

  // Starts a run in an appropriate worker (same request/response as for WorkerNode).
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // Kills a run in the appropriate worker (same request/response as for WorkerNode).
  rpc KillRun(KillRunRequest) returns (KillRunResponse);
  // Runs a well-known internal block in the host with our credentials.
  rpc RunProxyBlock(RunProxyBlockRequest) returns (RunProxyBlockResponse);

}

//
// Worker node
//

message RestartWorkerRequest {}
message RestartWorkerResponse {
  WorkerData worker = 1;
}

message StartRunRequest {
  RunData run = 1;
  bool block = 2;
  bool keyed_inputs = 3;
  bool keyed_outputs = 4;
  repeated string tags = 5;
  google.protobuf.Struct root_value = 6;
  google.protobuf.Struct init_value = 7;
}
message StartRunResponse {
  ErrorType error_type = 1;
  RunData run = 2;
  repeated LogEntryData logs = 3;

  enum ErrorType {
    START_RUN_ERROR_TYPE_UNSPECIFIED = 0;
    START_RUN_ERROR_TYPE_UNAVAILABLE = 1;
    START_RUN_ERROR_TYPE_INVALID = 2;
    START_RUN_ERROR_TYPE_INTERNAL = 3;
    START_RUN_ERROR_TYPE_TIMEOUT = 4;
    START_RUN_ERROR_TYPE_RUNTIME = 5;
    START_RUN_ERROR_TYPE_DUPLICATE = 6;
  }
}

message KillRunRequest {
  string run_id = 1;
}
message KillRunResponse {
  RunData run = 1;
}

// A hosted Worker providing a Bench runtime with a set of worker processes.
// Service is scoped to bench_id/worker_set_id.
// Not accessible from the outside.
service Worker {
  // Restart this worker immediately.
  rpc RestartWorker(RestartWorkerRequest) returns (WorkerSetData);
  // Starts a run in a process in this worker.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // Kills a run in a process in this worker.
  rpc KillRun(KillRunRequest) returns (KillRunResponse);
}

// The actual worker process executing a Bench 'thread'.
// Service is scoped to bench_id/worker_set_id/worker_process_id.
// Not accessible from the outside.
service WorkerProcess {
  // Starts a run in this worker process.
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  // Kills a run in this worker process.
  rpc KillRun(KillRunRequest) returns (KillRunResponse);
}