[package]
name = "destack_time-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
destack_time = { path = ".." }
arbitrary = { workspace = true }
libfuzzer-sys = { workspace = true }

[[bin]]
name = "destack_time_time"
path = "fuzz_targets/time.rs"
test = false
doc = false

[[bin]]
name = "destack_time_date"
path = "fuzz_targets/date.rs"
test = false
doc = false

[[bin]]
name = "destack_time_datetime"
path = "fuzz_targets/datetime.rs"
test = false
doc = false

[[bin]]
name = "destack_time_duration"
path = "fuzz_targets/duration.rs"
test = false
doc = false

[[bin]]
name = "destack_time_timestamp"
path = "fuzz_targets/timestamp.rs"
test = false
doc = false

[profile.release]
panic = "abort"


