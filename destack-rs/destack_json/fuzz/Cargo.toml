[package]
name = "destack_json-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
destack_json = { path = ".." }
arbitrary = { workspace = true }
libfuzzer-sys = { workspace = true }

[[bin]]
name = "destack_json_json"
path = "fuzz_targets/json.rs"
test = false
doc = false

[profile.release]
panic = "abort"


