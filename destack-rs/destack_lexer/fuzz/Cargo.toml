[package]
name = "destack_lexer_fuzz"
description = "Destack Lexer Fuzz"
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
destack_lexer = { path = ".." }

arbitrary = { workspace = true }
libfuzzer-sys = { workspace = true }

[[bin]]
name = "destack_lexer_parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false

[profile.release]
panic = "abort"
