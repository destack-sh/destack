  symbols: [Symbol!]!
}

type Query {
  user(
    """The ID of the object."""
    id: GlobalID!
  ): User
  users(
    """Returns the items in the list that come before the specified cursor."""
    before: String = null

    """Returns the items in the list that come after the specified cursor."""
    after: String = null

    """Returns the first n items from the list."""
    first: Int = null

    """Returns the items in the list that come after the specified cursor."""
    last: Int = null
  ): UserConnection!
  organization(
    """The ID of the object."""
    id: GlobalID!
  ): Organization
  organizationBySlug(organization: String!): Organization
  project(
    """The ID of the object."""
    id: GlobalID!
  ): Project
  projectBySlug(organization: String!, project: String!): Project
  projects(
    """Returns the items in the list that come before the specified cursor."""
    before: String = null

    """Returns the items in the list that come after the specified cursor."""
    after: String = null

    """Returns the first n items from the list."""
    first: Int = null

    """Returns the items in the list that come after the specified cursor."""
    last: Int = null
  ): ProjectConnection!
  projectVersion(
    """The ID of the object."""
    id: GlobalID!
  ): ProjectVersion
  file(
    """The ID of the object."""
    id: GlobalID!
  ): File
  symbol(
    """The ID of the object."""
    id: GlobalID!
  ): Symbol
}

