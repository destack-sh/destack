repos:
  # python
  - repo: local
    hooks:
      # lint
      - id: ruff
        name: ruff check (py)
        entry: ruff 
        language: python
        language_version: python3.13
        additional_dependencies:
          - ruff==0.11.12
        types: [ python ]
        args: [ check, --fix ]
      # format
      - id: ruff-format
        name: ruff format (py)
        entry: ruff
        language: python
        language_version: python3.13
        additional_dependencies:
          - ruff==0.11.12
        types: [ python ]
        args: [ format ]

  # rust
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (rs)
        entry: cargo
        language: system
        pass_filenames: false
        always_run: true
        args: [ "fmt", "--", "--check" ]

      - id: cargo-clippy
        name: cargo clippy (rs)
        entry: cargo
        language: system
        pass_filenames: false
        always_run: true
        args: [ "clippy", "--all-features", "--", "-D", "warnings" ]
  
  # general
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [ javascript, jsx, ts, tsx, vue, python, bash, rust ]
