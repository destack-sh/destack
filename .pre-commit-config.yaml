repos:
  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        name: flake8 (py)
        args: ["--max-line-length=100", "--select=C,E,F,W,B,B950", "--extend-ignore=E203,E501,W503,F722"]
        exclude: ^bench/migrations|^bench/demo
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        name: black (py)
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (py)
#  TODO @Cleanup: fix typechecking in pre-commit
#  - repo: https://github.com/RobertCraigie/pyright-python
#    rev: v1.1.322
#    hooks:
#      - id: pyright
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.13.0
    hooks:
      - id: eslint
        name: eslint (js)
        files: \.[jt]sx?$ # *.js, *.jsx, *.ts and *.tsx
        types: [file]
        types_or: [javascript, jsx, ts, tsx, vue]
        additional_dependencies:
          - eslint@8.5.0
          - eslint-plugin-cypress@2.12.1
          - eslint-plugin-vue@8.2.0
        # use .eslintrc.cjs
        args: ["--config", ".eslintrc.cjs"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.6.2
    hooks:
      - id: prettier
        name: prettier (js)
        types_or: [javascript, jsx, ts, tsx, vue]
        additional_dependencies:
          - prettier@2.6.2
          - prettier-plugin-tailwindcss@0.1.8
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v1.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [javascript, jsx, ts, tsx, vue, python, bash]
