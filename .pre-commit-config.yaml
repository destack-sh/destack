repos:
  # Python
  - repo: local
    hooks:
      # lint
      - id: ruff
        name: ruff check (py)
        entry: ruff 
        language: system
        exclude: ^bench/(migrations|proto)
        types: [ python ]
        args: [ check, --fix ]
      # format
      - id: ruff-format
        name: ruff format (py)
        entry: ruff
        language: system
        types: [ python ]
        args: [ format ]
      # typing
      - id: pyright
        name: pyright (py)
        entry: pyright
        language: system
        always_run: true
        types: [ python ]

  # JS/TS
  - repo: local
    hooks:
      - id: bun-check
        name: bun-check (ts)
        entry: bun
        args: [ run, --cwd, bench-ts, check ]
        language: system
        verbose: true
        always_run: true
        types: [ javascript, jsx, ts, tsx, vue ]

  # General
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v1.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [ javascript, jsx, ts, tsx, vue, python, bash, rust ]
