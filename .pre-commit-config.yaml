repos:
  # python
  - repo: local
    hooks:
      # lint
      - id: ruff
        name: ruff check (py)
        entry: ruff 
        language: python
        language_version: python3.13
        additional_dependencies:
          - ruff==0.11.12
        exclude: ^destack-py/destack/proto
        types: [ python ]
        args: [ check, --fix ]
      # format
      - id: ruff-format
        name: ruff format (py)
        entry: ruff
        language: python
        language_version: python3.13
        additional_dependencies:
          - ruff==0.11.12
        types: [ python ]
        args: [ format ]

  # general
  # conventional commit
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: 
          - --force-scope
          - --verbose
          - --scopes
          - all,language,test,simulation,py,py-system,py-runtime,py-web,ts,ts-test,ts-simulation,ts-system,ts-runtime,ts-web,infra,proto,scripts
          - feat
          - fix
          - chore
          - test
          - docs
          - refactor
          - perf
          - build
          - ci
          - style
          - revert
          - chore
          - infra
          - dev
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [ javascript, jsx, ts, tsx, vue, python, bash, rust ]
