repos:
  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.284
    hooks:
      - id: ruff
        name: ruff (py)
        exclude: ^bench/migrations
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        name: black (py)
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (py)
  #  TODO @Cleanup: fix Python typechecking (and re-enable as pre-commit hook)
  #  Too many errors currently (many spurious) to enable this.
  #  - repo: https://github.com/RobertCraigie/pyright-python
  #    rev: v1.1.322
  #    hooks:
  #      - id: pyright

  # JS/TS
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.13.0
    hooks:
      - id: eslint
        name: eslint (js)
        files: \.[jt]sx?$ # *.js, *.jsx, *.ts and *.tsx
        types: [ file ]
        types_or: [ javascript, jsx, ts, tsx, vue ]
        additional_dependencies:
          - eslint@8.5.0
          - eslint-plugin-cypress@2.12.1
          - eslint-plugin-vue@8.2.0
        args: [ "--config", "bench-web/.eslintrc.cjs" ]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.6.2
    hooks:
      - id: prettier
        name: prettier (js)
        types_or: [ javascript, jsx, ts, tsx, vue ]
        additional_dependencies:
          - prettier@2.6.2
          - prettier-plugin-tailwindcss@0.1.8

    #  TODO @Cleanup: fix TS typechecking (and re-enable as pre-commit hook)
    #  Errors are fixed but vue-tsc doesn't run properly
  #  - repo: local
  #    hooks:
  #      - id: vue-tsc
  #        name: vue-tsc
  #        entry: npx vue-tsc --noEmit
  #        language: system
  #        types_or: [ javascript, jsx, ts, tsx, vue ]

  # General
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v1.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [ javascript, jsx, ts, tsx, vue, python, bash ]
