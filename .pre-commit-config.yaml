repos:
  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.284
    hooks:
      - id: ruff
        name: ruff (py)
        exclude: ^bench/migrations
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        name: black (py)
  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: isort (py)
  #  TODO :Cleanup :Robustness: fix Python typechecking
  #   (and re-enable pyright pre-commit hook)
  #  - repo: https://github.com/RobertCraigie/pyright-python
  #    rev: v1.1.322
  #    hooks:
  #      - id: pyright

  # JS/TS
  - repo: local
    hooks:
      - id: bun-lint
        name: bun-lint (ts)
        entry: cd bench-web && bun run lint
        language: system
        types_or: [ javascript, jsx, ts, tsx, vue ]
  - repo: local
    hooks:
      - id: bun-type-check
        name: bun-type-check (ts)
        entry: cd bench-web && bun run type-check
        language: system
        types_or: [ javascript, jsx, ts, tsx, vue ]

  # General
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v1.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
  - repo: https://github.com/flotothemoon/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: check-no-nocheckin
        types_or: [ javascript, jsx, ts, tsx, vue, python, bash ]
