[workspace]
# fuzzer is in its own workspace

[package]
name = "tspp_parser_fuzz"
description = "TS++ Parser Fuzzing"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
tspp_core = { path = "../../core" }
tspp_parser = { path = ".." }
tspp_source = { path = "../../source" }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false
