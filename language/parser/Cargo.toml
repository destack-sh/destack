[package]
name = "tspp_parser"
description = "TS++ Parser"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
tspp_dir = { workspace = true }
tspp_core = { workspace = true }
tspp_source = { workspace = true }
tspp_unicode = { workspace = true }

# general
memchr = { workspace = true }
