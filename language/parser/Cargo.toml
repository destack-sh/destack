smallvec = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
num_cpus = { workspace = true }
pprof = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "tspp_parse"
harness = false

[[bench]]
name = "tspp_lex"
harness = false

[lints]
workspace = true
