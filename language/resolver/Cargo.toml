[package]
name = "destack_resolver"
description = "Destack Resolver"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_ast = { workspace = true }
destack_dir = { workspace = true }
destack_parser = { workspace = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_workspace = { path = "../workspace", default-features = false }

# general
cfg-if = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
papaya = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pnp = { workspace = true }
url = { workspace = true }

[dev-dependencies]
fancy-regex = "0.17.0"

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
