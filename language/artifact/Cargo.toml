[package]
name = "destack_artifact"
description = "Destack Artifact"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
schema = ["schemars"]

[dependencies]
# language
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_js = { workspace = true }
destack_mir = { workspace = true }
destack_qir = { workspace = true }
destack_source = { workspace = true }

# general
blake3 = { workspace = true }
dashmap = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["preserve_order"] }
schemars = { workspace = true, optional = true }
tracing = { workspace = true }

[target.'cfg(all(not(target_os = "wasi"), not(target_arch = "wasm32")))'.dependencies]
fs2 = { workspace = true }

[lints]
workspace = true
