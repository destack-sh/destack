[package]
name = "destack_workspace"
description = "Destack Workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_artifact = { workspace = true }
destack_compiler = { path = "../compiler", default-features = false }
destack_linter = { workspace = true }
destack_query = { workspace = true }
destack_session = { workspace = true }
destack_source = { workspace = true }
destack_repository = { path = "../repository", default-features = false }

# general
dashmap = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = ["native"]
native = ["destack_compiler/native"]
deadlock-detection = ["destack_compiler/deadlock-detection"]

[lints]
workspace = true
