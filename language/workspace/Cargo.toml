[package]
name = "tspp_workspace"
description = "Destack Workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
tspp_artifact = { workspace = true }
tspp_compiler = { workspace = true, default-features = false }
tspp_core = { workspace = true }
tspp_dir = { workspace = true }
tspp_doc = { workspace = true }
tspp_fir = { workspace = true }
tspp_formatter = { workspace = true }
tspp_json = { workspace = true }
tspp_mir = { workspace = true }
tspp_parser = { workspace = true }
tspp_pattern = { workspace = true }
tspp_query = { workspace = true }
tspp_session = { workspace = true, default-features = false }
tspp_serde = { workspace = true }
tspp_source = { workspace = true }
tspp_repository = { path = "../repository", default-features = false }
tspp_rpc = { workspace = true }

# general
crossbeam-channel = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true, features = ["async-await", "executor"] }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = { workspace = true }

[dev-dependencies]
# language
tspp_program = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[features]
default = ["native"]
native = ["tspp_compiler/native", "tspp_session/native"]
deadlock-detection = ["tspp_compiler/deadlock-detection"]

[lints]
workspace = true
