[package]
name = "destack_workspace"
description = "Destack Workspace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "generate-schema"
path = "src/schema.rs"
required-features = ["schema"]

[features]
default = ["full"]
builtin-full = ["destack_builtin/full"]
builtin-core = ["destack_builtin/core"]
full = ["builtin-full"]
core = ["builtin-core"]
schema = ["schemars"]

[dependencies]
# language
destack_ast = { workspace = true }
destack_base = { workspace = true }
destack_builtin = { path = "../builtin", default-features = false }
destack_dir = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }

# general
dashmap = { workspace = true }
filetime = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { workspace = true }
tracing = { workspace = true }
postcard = { workspace = true }

[target.'cfg(all(not(target_os = "wasi"), not(target_arch = "wasm32")))'.dependencies]
fs2 = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
