[package]
name = "destack_heap"
description = "Destack Heap"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_core = { workspace = true }
destack_mir = { workspace = true }
crossbeam-deque = { workspace = true }
libc = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "memory"
path = "benches/memory/bench.rs"
harness = false

[lints]
workspace = true
