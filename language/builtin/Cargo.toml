[package]
name = "destack_builtin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["full"]

# profile presets
full = [
    "lib-bun",
    "lib-deno",
    "lib-destack",
    "lib-dom",
    "lib-es",
    "lib-globals",
    "lib-js",
    "lib-native",
    "lib-node",
    "lib-platform",
    "lib-scripthost",
    "lib-undici-types",
    "lib-worker",
    "versions-all",
]
core = [
    "lib-destack",
    "lib-es",
    "lib-globals",
    "lib-js",
    "versions-latest",
]

# lib family gates
lib-bun = []
lib-deno = []
lib-destack = []
lib-dom = []
lib-es = []
lib-globals = []
lib-js = []
lib-native = []
lib-node = []
lib-platform = []
lib-scripthost = []
lib-undici-types = []
lib-worker = []

# version mode gates
versions-all = []
versions-latest = []
legacy-node = []
legacy-deno = []
legacy-bun = []
legacy-undici-types = []

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
