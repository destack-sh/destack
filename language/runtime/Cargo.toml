[package]
name = "destack_runtime"
description = "Destack Runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["replay", "audio-backends-default"]
replay = []
audio-backends-default = [
    "audio-wasapi",
    "audio-asio",
    "audio-coreaudio",
    "audio-alsa",
    "audio-pipewire",
    "audio-pulseaudio",
    "audio-jack",
]
audio-wasapi = []
audio-asio = []
audio-coreaudio = []
audio-alsa = []
# linux backends
audio-pipewire = []
audio-pulseaudio = []
audio-jack = []

[dependencies]
# language
destack_artifact = { workspace = true }
destack_ast = { workspace = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_engine = { workspace = true }
destack_fir = { workspace = true }
destack_heap = { workspace = true }
destack_mir = { workspace = true }
destack_native = { workspace = true }
destack_query = { workspace = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_vm = { workspace = true }
destack_workspace = { workspace = true }

libc = { workspace = true }
postcard = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
rustc-hash = { workspace = true }

windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinSock",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

[dev-dependencies]
destack_compiler = { workspace = true }

[lints]
workspace = true
