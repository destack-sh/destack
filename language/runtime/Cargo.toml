[package]
name = "destack_runtime"
description = "Destack Runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["replay"]
replay = []
generate_bindings = [
    "dep:destack_builtin",
    "dep:destack_compiler",
]

[[bin]]
name = "generate-bindings"
path = "src/generate/main.rs"
required-features = ["generate_bindings"]

[dependencies]
# language
destack_ast = { workspace = true }
destack_base = { workspace = true }
destack_builtin = { workspace = true, optional = true }
destack_compiler = { workspace = true, optional = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_heap = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_vm = { workspace = true }
destack_vm_abi = { workspace = true }
destack_workspace = { workspace = true }

# general
getrandom = "0.4.0"
libc = { workspace = true }
postcard = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_WindowsProgramming",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7.11"

[dev-dependencies]

[lints]
workspace = true
