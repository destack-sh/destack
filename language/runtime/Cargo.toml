[package]
name = "destack_runtime"
description = "Destack Runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["replay", "audio-backends-default"]
replay = []
audio-backends-default = [
    "audio-wasapi",
    "audio-asio",
    "audio-coreaudio",
    "audio-alsa",
    "audio-pipewire",
    "audio-pulseaudio",
    "audio-jack",
    "audio-aaudio",
    "audio-opensles",
]
audio-wasapi = []
audio-asio = []
audio-coreaudio = []
audio-alsa = []
# linux backends
audio-pipewire = []
audio-pulseaudio = []
audio-jack = []
audio-aaudio = []
audio-opensles = []
generator = [
    "dep:destack_builtin",
    "dep:destack_compiler",
    "dep:destack_linter",
    "dep:destack_session",
]

[[bin]]
name = "generate-bindings"
path = "src/generate/main.rs"
required-features = ["generator"]

[[test]]
name = "runtime_execution"
path = "src/tests/driver.rs"
harness = false

[dependencies]
# language
destack_artifact = { workspace = true }
destack_ast = { workspace = true }
destack_builtin = { workspace = true, optional = true }
destack_compiler = { workspace = true, optional = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_engine = { workspace = true }
destack_fir = { workspace = true }
destack_heap = { workspace = true }
destack_mir = { workspace = true }
destack_native = { workspace = true }
destack_query = { workspace = true }
destack_linter = { workspace = true, optional = true }
destack_session = { workspace = true, optional = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_vm = { workspace = true }
destack_workspace = { workspace = true }

# general
base64 = { workspace = true }
argon2 = { workspace = true }
cfg-if = { workspace = true }
foreign-types-shared = { workspace = true }
jiff = { workspace = true }
libc = { workspace = true }
postcard = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# FUGU #Architecture: finally rip out the whole getrandom runtime dependency (and any other stray ones..?)
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(any(unix, windows))'.dependencies]
notify = { workspace = true }
notify-rust = { workspace = true }
openssl = { workspace = true, features = ["vendored"] }
openssl-sys = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pemfile = { workspace = true }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
vobject = { workspace = true }
zbus = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "ApplicationModel_Appointments",
    "ApplicationModel_Contacts",
    "Data_Xml_Dom",
    "Devices_Geolocation",
    "Devices_Enumeration",
    "Devices_Radios",
    "Devices_Midi",
    "Graphics_Imaging",
    "Foundation",
    "Foundation_Collections",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Devices",
    "Media_MediaProperties",
    "Storage_Streams",
    "UI_Notifications",
    "Win32_Storage_Packaging_Appx",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
