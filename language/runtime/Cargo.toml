[package]
name = "destack_runtime"
description = "Destack Runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = ["replay", "audio-backends-default"]
replay = []
audio-backends-default = [
    "audio-wasapi",
    "audio-asio",
    "audio-coreaudio",
    "audio-alsa",
    "audio-pipewire",
    "audio-pulseaudio",
    "audio-jack",
    "audio-aaudio",
    "audio-opensles",
]
audio-wasapi = []
audio-asio = []
audio-coreaudio = []
audio-alsa = []
# linux backends
audio-pipewire = []
audio-pulseaudio = []
audio-jack = []
audio-aaudio = []
audio-opensles = []
generate_bindings = [
    "dep:destack_builtin",
    "dep:destack_compiler",
]

[[bin]]
name = "generate-bindings"
path = "src/generate/main.rs"
required-features = ["generate_bindings"]

[dependencies]
# language
destack_ast = { workspace = true }
destack_base = { workspace = true }
destack_builtin = { workspace = true, optional = true }
destack_compiler = { workspace = true, optional = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_heap = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_vm = { workspace = true }
destack_vm_abi = { workspace = true }
destack_workspace = { workspace = true }

# general
base64 = { workspace = true }
argon2 = { workspace = true }
foreign-types-shared = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
postcard = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rustc-hash = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(any(unix, windows))'.dependencies]
notify = { workspace = true }
openssl = { workspace = true, features = ["vendored"] }
openssl-sys = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
rustls-pemfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_Networking_WinSock",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Display",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_Touch",
    "Win32_UI_Input_XboxController",
    "Win32_UI_HiDpi",
    "Win32_UI_ColorSystem",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_BiometricFramework",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation-sys = { workspace = true }
security-framework-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }
x11rb = { workspace = true, features = ["randr", "shape", "xfixes"] }

[dev-dependencies]
rustls-native-certs = { workspace = true }

[lints]
workspace = true
