[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = { workspace = true }
core-foundation-sys = { workspace = true }
objc2 = { workspace = true, features = ["exception"] }
security-framework-sys = { workspace = true }
objc2-user-notifications = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }
keyring = { workspace = true, features = ["linux-native-sync-persistent", "crypto-rust", "vendored"] }
udev = { workspace = true }
v4l2-sys-mit = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
x11rb = { workspace = true, features = ["allow-unsafe-code", "randr", "shape", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSControl", "NSResponder", "NSText", "NSTextField", "NSTextView", "NSView", "objc2-uniform-type-identifiers"] }
objc2-av-foundation = { workspace = true, features = ["AVCaptureOutputBase", "AVCapturePhotoOutput", "AVVideoSettings", "objc2-core-media"] }
objc2-core-bluetooth = { workspace = true }
objc2-contacts = { workspace = true }
