name = "Destack MIR"
grammar = "mir"
path_suffixes = ["dsm"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 0 }
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "<", end = ">", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] }
]
word_characters = ["@", "."]
tab_size = 4
