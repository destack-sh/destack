[package]
name = "destack_lsp_server"
description = "LSP server framework for the Destack language server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
destack_lsp_types = { workspace = true }

bytes = { workspace = true }
dashmap = { workspace = true }
futures = { workspace = true, default-features = false, features = ["std", "async-await"] }
httparse = { workspace = true }
memchr = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["codec"] }
tower = { workspace = true, default-features = false, features = ["util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
