[package]
name = "tspp_formatter"
description = "TS++ Formatter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = []
timings = []

[dependencies]
# language
tspp_artifact = { workspace = true }
tspp_core = { workspace = true }
tspp_dir = { workspace = true }
tspp_fir = { workspace = true }
tspp_parser = { workspace = true }
tspp_source = { workspace = true }
tspp_repository = { path = "../repository", default-features = false }

# general
markdown = { workspace = true }
rustc-hash = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
libtest-mimic = { workspace = true }
pulldown-cmark = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "fixture"
path = "tests/fixture/main.rs"
harness = false

[lints]
workspace = true
