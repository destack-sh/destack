[package]
name = "tspp_session"
description = "TS++ Session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
tspp_artifact = { workspace = true }
tspp_core = { workspace = true }
tspp_compiler = { workspace = true, default-features = false }
tspp_dir = { workspace = true }
tspp_index = { workspace = true }
tspp_linter = { workspace = true }
tspp_mir = { workspace = true }
tspp_parser = { workspace = true }
tspp_serde = { workspace = true }
tspp_source = { workspace = true }
tspp_repository = { path = "../repository", default-features = false }

# general
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[features]
default = ["native"]
native = ["tspp_compiler/native"]
deadlock-detection = ["tspp_compiler/deadlock-detection"]

[lints]
workspace = true
