[package]
name = "destack_session"
description = "Destack Session"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_artifact = { workspace = true }
destack_core = { workspace = true }
destack_compiler = { workspace = true, default-features = false }
destack_dir = { workspace = true }
destack_linter = { workspace = true }
destack_mir = { workspace = true }
destack_parser = { workspace = true }
destack_query = { workspace = true }
destack_serde = { workspace = true }
destack_source = { workspace = true }
destack_repository = { path = "../repository", default-features = false }

# general
futures = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
toml = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }

[features]
default = ["native"]
native = ["destack_compiler/native"]
deadlock-detection = ["destack_compiler/deadlock-detection"]

[lints]
workspace = true
