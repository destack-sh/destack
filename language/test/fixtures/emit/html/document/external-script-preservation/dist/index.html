<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Document entry that preserves external assets while rewriting local ones"
        />
        <title>External Script Preservation</title>
        <link rel="stylesheet" href="./site.css" />
        <link
            rel="stylesheet"
            href="https://cdn.example.com/widget-theme.css"
        />
    </head>
    <body>
        <header class="page-header">
            <h1>Workspace Integrations</h1>
            <p>
                Keep authored CDN dependencies intact while rewriting local
                document resources.
            </p>
        </header>
        <main id="app-root" class="page-shell" data-view="overview">
            <img
                class="local-mark"
                src="./workspace-mark.svg"
                alt="Workspace mark"
            />
            <img
                class="external-mark"
                src="https://cdn.example.com/widget-mark.svg"
                alt="External widget mark"
            />
        </main>
        <aside id="widget-root" class="widget-root"></aside>
        <script
            type="module"
            crossorigin="anonymous"
            src="https://cdn.example.com/widget.js"
        ></script>
        <script type="module" src="./site.js"></script>
    </body>
</html>
