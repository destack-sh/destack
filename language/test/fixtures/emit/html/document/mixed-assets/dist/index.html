<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Mixed Assets</title>
        <link rel="icon" href="./assets/local.jpg" />
        <link rel="preload" href="./assets/local.css" as="style" />
        <link rel="stylesheet" href="./assets/local.css" />
        <link rel="stylesheet" href="https://cdn.example.com/style.css" />
        <script type="module" src="./site.js"></script>
        <script src="https://cdn.example.com/script.js"></script>
    </head>
    <body>
        <h1>Mixed Assets</h1>
        <picture>
            <source srcset="./assets/local.jpg 1x, https://cdn.example.com/image@2x.jpg 2x" />
            <img src="./assets/local.jpg" />
        </picture>
        <img src="https://cdn.example.com/image.jpg" />
    </body>
</html>
