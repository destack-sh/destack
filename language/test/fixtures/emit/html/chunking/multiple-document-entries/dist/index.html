<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Document entry with multiple module roots, shared chunks, and lazy panels"
        />
        <title>Multiple Document Entries</title>
        <link rel="stylesheet" href="./site.css" />
    </head>
    <body>
        <header>
            <h1>Reference Workbench</h1>
            <p>
                Render separate overview and dashboard modules from one
                document while still sharing authored graph state.
            </p>
        </header>
        <main id="app-root" data-view="overview"></main>
        <section id="dashboard-root" data-view="configuration"></section>
        <footer>
            <small>Live previews are loaded through module entry points.</small>
        </footer>
        <script type="module" src="./app.js"></script>
        <script type="module" src="./dashboard.js"></script>
    </body>
</html>
