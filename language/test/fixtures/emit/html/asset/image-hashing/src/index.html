<!DOCTYPE html>
<html>
  <head>
    <link rel="preload" href="./image.jpg" as="image">
    <link rel="preload" href="./frame.svg" as="image" type="image/svg+xml">
  </head>
  <body>
    <img src="./image.jpg" alt="Local image">
    <picture>
      <source srcset="./frame.svg" type="image/svg+xml">
      <source srcset="./image.jpg 1x, https://example.com/image@2x.jpg 2x">
      <img src="./image.jpg" alt="Responsive local image">
    </picture>
    <img srcset="./image.jpg 1x, ./image.jpg 2x" alt="Local srcset image">
    <img src="./gallery/poster.svg" alt="Gallery poster">
    <object data="./frame.svg" type="image/svg+xml"></object>
    <img src="https://example.com/image.jpg" alt="External image">
  </body>
</html>
