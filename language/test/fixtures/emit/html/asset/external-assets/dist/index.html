<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>External Assets</title>
    <link rel="preconnect" href="https://cdn.example.com">
    <link rel="dns-prefetch" href="https://cdn.example.com">
    <link rel="preload" href="https://cdn.example.com/style.css" as="style">
    <link rel="preload" href="https://cdn.example.com/fonts/display.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="https://cdn.example.com/image-small.jpg" as="image" imagesrcset="https://cdn.example.com/image-small.jpg 1x, https://cdn.example.com/image-large.jpg 2x">
    <link rel="modulepreload" href="https://cdn.example.com/module.js">
    <link rel="stylesheet" href="https://cdn.example.com/style.css">
    <link rel="stylesheet" href="https://cdn.example.com/theme.css">
    <link rel="icon" href="https://cdn.example.com/favicon.png">
    <link rel="apple-touch-icon" href="https://cdn.example.com/touch-icon.png">
    <script src="https://cdn.example.com/script.js"></script>
    <script type="module" src="https://cdn.example.com/module.js"></script>
  </head>
  <body>
    <h1>External Assets</h1>
    <img src="https://cdn.example.com/image.jpg" alt="External image">
    <img srcset="https://cdn.example.com/image-small.jpg 1x, https://cdn.example.com/image-large.jpg 2x" alt="External responsive image">
    <picture>
      <source srcset="https://cdn.example.com/hero.avif" type="image/avif">
      <img src="https://cdn.example.com/hero.png" alt="External hero">
    </picture>
    <video controls poster="https://cdn.example.com/poster.jpg">
      <source src="https://cdn.example.com/video.webm" type="video/webm">
      <source src="https://cdn.example.com/video.mp4" type="video/mp4">
    </video>
    <audio controls>
      <source src="https://cdn.example.com/podcast.ogg" type="audio/ogg">
      <source src="https://cdn.example.com/podcast.mp3" type="audio/mpeg">
    </audio>
    <object data="https://cdn.example.com/chart.svg" type="image/svg+xml"></object>
  </body>
</html>
