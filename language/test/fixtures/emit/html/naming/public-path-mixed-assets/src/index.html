<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Document entry with public path rewriting across scripts, styles, and assets"
        />
        <title>Public Path Mixed Assets</title>
        <link rel="stylesheet" href="./site.css" />
    </head>
    <body>
        <header class="page-header">
            <h1>Workspace Public Path</h1>
            <p>
                Serve the same authored document shell from one CDN base path
                without touching external URLs.
            </p>
        </header>
        <main id="app-root" class="page-shell" data-view="overview">
            <img
                class="hero-mark"
                src="./images/workspace-mark.svg"
                alt="Workspace mark"
            />
            <picture class="hero-picture">
                <source
                    srcset="
                        ./images/workspace-mark.svg 1x,
                        ./images/workspace-mark-wide.svg 2x
                    "
                />
                <img
                    class="hero-mark-variants"
                    src="./images/workspace-mark.svg"
                    alt="Workspace mark variants"
                />
            </picture>
            <svg class="sprite-mark" aria-hidden="true" viewBox="0 0 64 64">
                <use
                    href="./images/workspace-sprite.svg#workspace-mark"
                ></use>
            </svg>
            <img
                class="external-mark"
                src="https://cdn.example.com/widget-mark.svg"
                alt="External widget mark"
            />
        </main>
        <script type="module" src="./page.ds"></script>
    </body>
</html>
