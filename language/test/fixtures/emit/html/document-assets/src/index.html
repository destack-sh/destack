<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Reference documentation with linked stylesheets and SVG assets"
        />
        <title>Document Assets</title>
        <link rel="stylesheet" href="./site.css" />
    </head>
    <body>
        <header class="page-header">
            <h1>Workspace Assets</h1>
            <p>
                Load authored document resources through linked stylesheet and
                SVG asset references.
            </p>
        </header>
        <main class="page-shell">
            <img
                class="hero-mark"
                src="./images/workspace-mark.svg"
                alt="Workspace mark"
            />
            <img
                class="hero-mark-variants"
                srcset="
                    ./images/workspace-mark.svg 1x,
                    ./images/workspace-mark-wide.svg 2x
                "
                alt="Workspace mark variants"
            />
            <svg class="sprite-mark" aria-hidden="true" viewBox="0 0 64 64">
                <use href="./images/workspace-sprite.svg#workspace-mark"></use>
            </svg>
        </main>
        <script type="module" src="./page.ds"></script>
    </body>
</html>
