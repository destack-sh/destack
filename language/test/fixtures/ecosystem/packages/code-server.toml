[package]
name = "code-server"
description = "VS Code in the browser"
repo = "https://github.com/coder/code-server"
ref = "9184b645cc7aa41b750e2f2ef956f2896512dd84"
language = "ts"
tags = ["application", "developer-tool", "desktop", "web"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "lib/**/*.ts", "lib/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
