[package]
name = "tanstack-store"
description = "TanStack Store reactive state management"
repo = "https://github.com/TanStack/store"
ref = "de41b4e5e3130ed7923c030385ed3591584a5b87"
language = "ts"
tags = ["library", "state", "frontend", "tanstack"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx", "src/**/*.ts"]
