[package]
name = "typebox"
description = "TypeBox runtime type builder"
repo = "https://github.com/sinclairzx81/typebox"
ref = "672ff3ffb88088bf0c5b94a7ae5d792e27296f9e"
language = "ts"
tier = "T5"
tags = ["types", "validation", "library"]

[discovery]
include = ["src/**/*.ts", "example/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/benchmark/**", "**/dist/**", "**/node_modules/**"]
