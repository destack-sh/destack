[package]
name = "prettier"
description = "Prettier code formatter"
repo = "https://github.com/prettier/prettier"
ref = "456d14dbc2639d5a6b3eb2d8836b30f63597e1d6"
language = "js"
tags = ["tooling", "formatter"]

[discovery]
include = ["src/**/*.js", "src/**/*.ts", "scripts/**/*.js", "index.d.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
