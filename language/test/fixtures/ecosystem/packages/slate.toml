[package]
name = "slate"
description = "Slate rich text editor framework"
repo = "https://github.com/ianstormtaylor/slate"
ref = "d211122d582c19d51023b27ce4940c66f3d205b3"
language = "ts"
tags = ["library", "editor", "frontend", "react", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
