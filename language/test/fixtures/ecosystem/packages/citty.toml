[package]
name = "citty"
description = "TypeScript CLI toolkit"
repo = "https://github.com/unjs/citty"
ref = "c9673e2fc100d444104a6834d51da989e9bd858b"
language = "ts"
tier = "T5"
tags = ["tooling", "cli", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
