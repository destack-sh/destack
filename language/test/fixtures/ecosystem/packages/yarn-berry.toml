[package]
name = "yarn-berry"
description = "Yarn modern package manager"
repo = "https://github.com/yarnpkg/berry"
ref = "60b83ace11bd36270c1ed117319139eaa6971db3"
language = "ts"
tags = ["tooling", "package-manager", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "scripts/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
