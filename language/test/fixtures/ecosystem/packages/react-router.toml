[package]
name = "react-router"
description = "React Router framework and routing library"
repo = "https://github.com/remix-run/react-router"
ref = "18ae5d189e7ce529e00669ec797d7fa445274a33"
language = "ts"
tags = ["framework", "frontend", "routing", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
