[package]
name = "definitelytyped"
description = "DefinitelyTyped type declaration repository"
repo = "https://github.com/DefinitelyTyped/DefinitelyTyped"
ref = "cdadc548856adf9479ec1984e629bb174f9410d9"
language = "ts"
tier = "T0"
tags = ["types", "declarations", "ecosystem"]

[discovery]
include = ["types/**/*.ts", "types/**/*.tsx", "types/**/*.js", "types/**/*.jsx"]
exclude = [
    "**/__tests__/**",
    "**/node_modules/**",
    "types/react-input-mask/react-input-mask-tests.tsx",
    "types/react-input-mask/v1/react-input-mask-tests.tsx",
]
