[package]
name = "semver"
description = "semver version parsing and range utility"
repo = "https://github.com/npm/node-semver"
ref = "5993c2e42bdf17c5f03e6360da51bc707fcee460"
language = "js"
tags = ["library", "utility"]

[discovery]
include = ["classes/**/*.js", "functions/**/*.js", "internal/**/*.js", "index.js"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/benchmark/**", "**/dist/**", "**/node_modules/**"]
