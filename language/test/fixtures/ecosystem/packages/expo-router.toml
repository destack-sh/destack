[package]
name = "expo-router"
description = "Expo Router package"
repo = "https://github.com/expo/expo"
ref = "de7b52b8d18b5abd21fc051255ed2ef40b583d17"
language = "ts"
tier = "T2"
tags = ["mobile", "framework", "router"]

[discovery]
include = ["packages/expo-router/**/*.ts", "packages/expo-router/**/*.tsx", "packages/expo-router/**/*.js", "packages/expo-router/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
