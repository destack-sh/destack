[package]
name = "tslib"
description = "tslib TypeScript runtime helper library"
repo = "https://github.com/microsoft/tslib"
ref = "d72d6f70b36286bc3f94a3dda1e64dcb568b1370"
language = "js"
tier = "T5"
tags = ["library", "utility", "typescript"]

[discovery]
include = ["tslib.js", "modules/**/*.js", "tslib.d.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/benchmark/**", "**/dist/**", "**/node_modules/**"]
