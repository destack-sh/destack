[package]
name = "playwright"
description = "Playwright browser testing framework"
repo = "https://github.com/microsoft/playwright"
ref = "23a8d5006d89d5cb355a2f241f7364c2435802e5"
language = "ts"
tags = ["tooling", "test", "automation"]

[discovery]
include = ["packages/**/*.ts", "utils/**/*.ts", "tests/**/*.ts"]
exclude = ["**/*.spec.ts", "**/*.test.ts", "**/__tests__/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
