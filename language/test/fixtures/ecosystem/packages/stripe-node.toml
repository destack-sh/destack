[package]
name = "stripe-node"
description = "Stripe Node.js library"
repo = "https://github.com/stripe/stripe-node"
ref = "47cdb5eb972d00bd682aa9078e0cfdc1049f7226"
language = "ts"
tier = "T5"
tags = ["sdk", "payments", "node"]

[discovery]
include = ["src/**/*.ts", "types/**/*.d.ts", "types/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
