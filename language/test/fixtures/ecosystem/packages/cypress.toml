[package]
name = "cypress"
description = "Cypress end to end testing framework"
repo = "https://github.com/cypress-io/cypress"
ref = "05b951c48054b9a7c28b565b869cd31a9c375e6e"
language = "js"
tags = ["tooling", "testing", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx", "cli/**/*.ts", "cli/**/*.js"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
