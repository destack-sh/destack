[package]
name = "kibana"
description = "Kibana observability and analytics application"
repo = "https://github.com/elastic/kibana"
ref = "d83e0ba465ad4ff0a9d0344e70880f89a1633ea1"
language = "ts"
tier = "T2"
tags = ["application", "web", "observability", "monorepo"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "x-pack/**/*.ts", "x-pack/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
