[package]
name = "changesets"
description = "Changesets release workflow tooling"
repo = "https://github.com/changesets/changesets"
ref = "b6f4c748c4ba50b5ac608f3ce41229526d1bfe94"
language = "ts"
tier = "T3"
tags = ["tooling", "release", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.d.ts", "packages/**/*.mts", "packages/**/*.cts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/e2e/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
