[package]
name = "preact"
description = "Preact fast React alternative"
repo = "https://github.com/preactjs/preact"
ref = "fbb6a4eb628589416b953045e2f6e3425a885bff"
language = "ts"
tags = ["frontend", "jsx", "library"]

[discovery]
include = [
  "src/**/*.ts",
  "src/**/*.tsx",
  "src/**/*.js",
  "src/**/*.jsx",
  "hooks/**/*.ts",
  "hooks/**/*.tsx",
  "hooks/**/*.js",
  "hooks/**/*.jsx",
  "compat/**/*.ts",
  "compat/**/*.tsx",
  "compat/**/*.js",
  "compat/**/*.jsx",
  "packages/**/*.ts",
  "packages/**/*.tsx",
  "packages/**/*.js",
  "packages/**/*.jsx",
]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
