[package]
name = "aws-sdk-js-v3"
description = "AWS SDK for JavaScript v3"
repo = "https://github.com/aws/aws-sdk-js-v3"
ref = "b037203be0358d33f3c27fb994750dd2c0aa1b9b"
language = "ts"
tags = ["sdk", "cloud", "aws", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "clients/**/*.ts", "clients/**/*.tsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
