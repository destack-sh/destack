[package]
name = "react-admin"
description = "React Admin framework"
repo = "https://github.com/marmelab/react-admin"
ref = "b3303e286ffe420de3a6d96a1622e6d5ba04d595"
language = "ts"
tags = ["framework", "frontend", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
