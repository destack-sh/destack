[package]
name = "jest"
description = "Jest testing framework"
repo = "https://github.com/jestjs/jest"
ref = "f459dd6377127410ded569cd4aa176834c4ec845"
language = "ts"
tags = ["tooling", "test", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/e2e/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
