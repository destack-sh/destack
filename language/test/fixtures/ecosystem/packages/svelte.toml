[package]
name = "svelte"
description = "Svelte compiler and runtime"
repo = "https://github.com/sveltejs/svelte"
ref = "220b526d3aac9db5ba06181165a9c24a663f178b"
language = "ts"
tier = "T5"
tags = ["frontend", "framework", "compiler"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.js", "src/**/*.ts", "src/**/*.js"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
