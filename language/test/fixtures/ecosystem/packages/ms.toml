# ms - tiny millisecond conversion utility
# https://github.com/vercel/ms
#
# good starter: very small, simple types, single file

[package]
name = "ms"
repo = "https://github.com/vercel/ms"
# use default branch (main) for now

[discovery]
include = ["src/**/*.ts"]
exclude = ["**/*.test.ts", "**/__tests__/**"]

[tiers]
parse = true
check = false
compile_js = false
compile_native = false
