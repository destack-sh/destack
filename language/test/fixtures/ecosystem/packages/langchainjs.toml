[package]
name = "langchainjs"
description = "LangChain JavaScript and TypeScript framework"
repo = "https://github.com/langchain-ai/langchainjs"
ref = "0eed408d8b005564197809e1e8366ee336364371"
language = "ts"
tags = ["framework", "ai", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
