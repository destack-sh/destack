[package]
name = "astro"
description = "Astro web framework"
repo = "https://github.com/withastro/astro"
ref = "0317e993bd13a0a02c0335382b0e740e0961050d"
language = "ts"
tags = ["framework", "frontend", "build"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
