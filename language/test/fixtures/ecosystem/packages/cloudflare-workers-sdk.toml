[package]
name = "cloudflare-workers-sdk"
description = "Cloudflare Workers SDK and tooling monorepo"
repo = "https://github.com/cloudflare/workers-sdk"
ref = "fee554961a41a3113e954669ff2511d0293a8813"
language = "ts"
tags = ["framework", "edge", "cloudflare", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
