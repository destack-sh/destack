[package]
name = "rollup"
description = "Rollup JavaScript bundler"
repo = "https://github.com/rollup/rollup"
ref = "c49fba1e8df6654c8f424350dc6871fa29acb17b"
language = "ts"
tags = ["tooling", "bundler", "build"]

[discovery]
include = ["src/**/*.ts", "cli/**/*.ts", "docs/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
