[package]
name = "expo"
description = "Expo React Native platform"
repo = "https://github.com/expo/expo"
ref = "4b7779007d5732ac7f5e05bdf964f1741eb26c27"
language = "ts"
tier = "T2"
tags = ["application", "mobile", "typescript"]

[discovery]
include = [
    "src/**/*.ts",
    "src/**/*.tsx",
    "packages/**/*.ts",
    "packages/**/*.tsx",
    "apps/**/*.ts",
    "apps/**/*.tsx",
    "**/*.d.ts",
    "**/*.mts",
    "**/*.cts",
]
exclude = [
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/out/**",
    "**/coverage/**",
    "**/vendor/**",
    "**/third_party/**",
    "packages/expo-module-template/**",
    "packages/expo-module-template-local/**",
    "packages/html-elements/src/ts-declarations/react-native-web.d.ts",
]
