[package]
name = "tiptap"
description = "Tiptap rich text editor framework"
repo = "https://github.com/ueberdosis/tiptap"
ref = "d77192b70f62a5a3df98bb4c58729b630a002e23"
language = "ts"
tags = ["library", "editor", "frontend", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
