[package]
name = "babel"
description = "Babel JavaScript compiler monorepo"
repo = "https://github.com/babel/babel"
ref = "b6c765e22b2f9d9e4b096d4c2a8ca5f0e272f3a0"
language = "js"
tags = ["tooling", "compiler", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx", "eslint/**/*.js"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
