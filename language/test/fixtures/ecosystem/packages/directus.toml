[package]
name = "directus"
description = "Directus data platform"
repo = "https://github.com/directus/directus"
ref = "dcb29a7a63581871fc321ef29d50767ab6338530"
language = "ts"
tier = "T2"
tags = ["application", "platform", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
