[package]
name = "storybook"
description = "Storybook UI component workshop"
repo = "https://github.com/storybookjs/storybook"
ref = "5f5ad4e5f3bc90aebce5c241a71ef00cb24bc689"
language = "ts"
tags = ["tooling", "frontend", "monorepo"]

[discovery]
include = ["code/**/*.ts", "code/**/*.tsx", "code/**/*.js", "code/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]

[compiler_options]
js_as_jsx = true
