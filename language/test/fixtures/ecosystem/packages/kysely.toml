[package]
name = "kysely"
description = "Type safe SQL query builder"
repo = "https://github.com/kysely-org/kysely"
ref = "4f43c7d2280eabb586d1db4b4ae1361aa99eca3f"
language = "ts"
tags = ["database", "query-builder", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
