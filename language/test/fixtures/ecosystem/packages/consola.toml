[package]
name = "consola"
description = "TypeScript logging utility"
repo = "https://github.com/unjs/consola"
ref = "512d570b3f99a27b6766a885cae2730aa3dc0ed4"
language = "ts"
tier = "T3"
tags = ["library", "logging", "typescript"]

[discovery]
include = ["src/**/*.ts", "packages/**/*.ts", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
