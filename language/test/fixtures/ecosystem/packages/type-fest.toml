[package]
name = "type-fest"
description = "TypeScript utility type collection"
repo = "https://github.com/sindresorhus/type-fest"
ref = "8e9af4cf8c7f0a583768e7dcd545ddc519e9ca98"
language = "ts"
tier = "T3"
tags = ["types", "library"]

[discovery]
include = ["source/**/*.ts", "source/**/*.d.ts"]
exclude = ["**/*.test.ts", "**/*.test-d.ts", "**/__tests__/**", "**/dist/**", "**/node_modules/**"]
