[package]
name = "hono"
description = "Hono web framework for edge runtimes"
repo = "https://github.com/honojs/hono"
ref = "69ad8857df4eeef1a02e628ab8f5b2b60e643f19"
language = "ts"
tags = ["backend", "framework", "edge"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "runtime/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/bench/**", "**/dist/**", "**/node_modules/**"]
