[package]
name = "strapi"
description = "Strapi headless CMS"
repo = "https://github.com/strapi/strapi"
ref = "e5475e965ebee98a8b25d9315d522dbbe2c00942"
language = "ts"
tags = ["application", "cms", "backend", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
