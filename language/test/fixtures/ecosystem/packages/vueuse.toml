[package]
name = "vueuse"
description = "TypeScript utility collection for Vue"
repo = "https://github.com/vueuse/vueuse"
ref = "7069eb4cc5ffd7d10ac07277db2d4b67967dfc3f"
language = "ts"
tags = ["frontend", "vue", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
