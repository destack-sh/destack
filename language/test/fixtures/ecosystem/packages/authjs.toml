[package]
name = "authjs"
description = "Auth.js authentication framework"
repo = "https://github.com/nextauthjs/next-auth"
ref = "f4570683676039dfa4e47e3fd69224d74dc7f6ca"
language = "ts"
tier = "T5"
tags = ["framework", "auth", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
