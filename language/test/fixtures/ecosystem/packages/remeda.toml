[package]
name = "remeda"
description = "TypeScript first utility library"
repo = "https://github.com/remeda/remeda"
ref = "0a6e249f2bdc8414ed0728fb880bfd7473e74f56"
language = "ts"
tier = "T5"
tags = ["library", "utility", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
