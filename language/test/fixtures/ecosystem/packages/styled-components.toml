[package]
name = "styled-components"
description = "styled-components css in js library"
repo = "https://github.com/styled-components/styled-components"
ref = "b5bb591600625b45f2c65297c433ba6a3e1644c3"
language = "ts"
tier = "T5"
tags = ["library", "frontend", "css", "react", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
