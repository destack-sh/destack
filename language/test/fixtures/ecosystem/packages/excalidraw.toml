[package]
name = "excalidraw"
description = "Excalidraw whiteboard application"
repo = "https://github.com/excalidraw/excalidraw"
ref = "89a9badc27d30947882be7f2d6230d95141dd18b"
language = "ts"
tier = "T2"
tags = ["application", "frontend", "canvas", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx", "excalidraw-app/**/*.ts", "excalidraw-app/**/*.tsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
