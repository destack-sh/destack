[package]
name = "supabase-js"
description = "Supabase TypeScript client"
repo = "https://github.com/supabase/supabase-js"
ref = "e0d50822f2574b3de79b5b33a496e1fc88eb777c"
language = "ts"
tier = "T5"
tags = ["library", "database", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
