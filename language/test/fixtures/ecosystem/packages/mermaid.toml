[package]
name = "mermaid"
description = "Mermaid diagramming toolkit"
repo = "https://github.com/mermaid-js/mermaid"
ref = "acd7db36d722b980c265df1a1a46414686a8a892"
language = "ts"
tags = ["tooling", "visualization", "frontend", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx", "src/**/*.ts", "src/**/*.tsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
