[package]
name = "drizzle-orm"
description = "TypeScript ORM and query builder"
repo = "https://github.com/drizzle-team/drizzle-orm"
ref = "e8e6edfef5ca69c6188d320388ad440265911057"
language = "ts"
tier = "T3"
tags = ["database", "backend", "library"]

[discovery]
include = ["drizzle-orm/src/**/*.ts", "drizzle-kit/src/**/*.ts"]
exclude = ["**/*.test.ts", "**/__tests__/**", "**/benchmarks/**", "**/dist/**", "**/node_modules/**"]
