[package]
name = "openai-node"
description = "OpenAI JavaScript and TypeScript SDK"
repo = "https://github.com/openai/openai-node"
ref = "2ffe3ea754ba4b24b0311957bc5bc6f67f43b3a1"
language = "ts"
tier = "T3"
tags = ["library", "sdk", "typescript"]

[discovery]
include = ["src/**/*.ts", "packages/**/*.ts", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
