[package]
name = "fp-ts"
description = "Functional programming primitives for TypeScript"
repo = "https://github.com/gcanti/fp-ts"
ref = "09045f5819af260b5a6c4aeabdf2fbc8d9b9e335"
language = "ts"
tags = ["library", "functional", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
