[package]
name = "n8n"
description = "n8n workflow automation platform"
repo = "https://github.com/n8n-io/n8n"
ref = "dbf6f753ac5ed4220255dcb09e0c370f4c7a95f7"
language = "ts"
tags = ["application", "automation", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
