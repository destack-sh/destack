[package]
name = "redux-toolkit"
description = "Redux Toolkit state management"
repo = "https://github.com/reduxjs/redux-toolkit"
ref = "cb04c8e523390eed11f5a5c19ef0cadbcfeaeb14"
language = "ts"
tier = "T5"
tags = ["state", "frontend", "library"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
