[package]
name = "mobx"
description = "MobX state management"
repo = "https://github.com/mobxjs/mobx"
ref = "29e6e707b302595ad9e9fb87cdd6733998f19b3f"
language = "ts"
tags = ["library", "state", "frontend", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
