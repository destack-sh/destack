[package]
name = "ant-design"
description = "Ant Design React UI library"
repo = "https://github.com/ant-design/ant-design"
ref = "95f032bc3d5f99854e5efdffe2d43da15d68bf95"
language = "ts"
tier = "T5"
tags = ["frontend", "ui", "tsx"]

[discovery]
include = ["components/**/*.ts", "components/**/*.tsx", "scripts/**/*.ts", "typings/**/*.d.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
