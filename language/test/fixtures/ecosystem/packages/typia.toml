[package]
name = "typia"
description = "TypeScript transformer and runtime validators"
repo = "https://github.com/samchon/typia"
ref = "4a5dd70365c145116221e83d100ad8cf547dabe2"
language = "ts"
tags = ["typescript", "validator", "tooling"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
