[package]
name = "ofetch"
description = "TypeScript fetch utility"
repo = "https://github.com/unjs/ofetch"
ref = "d50a2047d431ce7b1202d09d75a4bd611768c11c"
language = "ts"
tags = ["library", "http", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
