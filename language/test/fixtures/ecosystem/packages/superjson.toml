[package]
name = "superjson"
description = "Type safe JSON transport format"
repo = "https://github.com/blitz-js/superjson"
ref = "dbf102469bf0c4dade1b2888696ffae9943f758c"
language = "ts"
tier = "T5"
tags = ["library", "serialization", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
