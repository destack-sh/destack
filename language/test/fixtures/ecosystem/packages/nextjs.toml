[package]
name = "nextjs"
description = "Next.js React framework"
repo = "https://github.com/vercel/next.js"
ref = "208c4f44b1db7d97dcad84a12bf9ee4ba4810757"
language = "ts"
tags = ["framework", "frontend", "monorepo"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**", "**/src/compiled/**"]

[compiler_options]
js_as_jsx = true
