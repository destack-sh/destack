[package]
name = "backstage"
description = "Backstage developer portal platform"
repo = "https://github.com/backstage/backstage"
ref = "3062f246a414ac2eece334d6976ed47391d0f044"
language = "ts"
tier = "T2"
tags = ["application", "platform", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "apps/**/*.ts", "apps/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/node_modules/**", "**/dist/**", "**/build/**", "**/out/**", "**/coverage/**", "**/vendor/**", "**/third_party/**"]
