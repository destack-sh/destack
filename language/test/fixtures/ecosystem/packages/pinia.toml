[package]
name = "pinia"
description = "Pinia state management for Vue"
repo = "https://github.com/vuejs/pinia"
ref = "4a204d6ea1d37139b985df4e81c49562c134debb"
language = "ts"
tags = ["frontend", "vue", "state"]

[discovery]
include = ["packages/**/*.ts", "packages/**/*.tsx", "packages/**/*.js", "packages/**/*.jsx"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/build/**", "**/node_modules/**"]
