[package]
name = "tsx"
description = "TypeScript execute runtime"
repo = "https://github.com/privatenumber/tsx"
ref = "3a3a0071c78eee94b7c73776729389e38056c21a"
language = "ts"
tags = ["runtime", "tooling", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
