[package]
name = "ts-morph"
description = "TypeScript AST wrapper and project tooling"
repo = "https://github.com/dsherret/ts-morph"
ref = "0dd1adc87da3a423f8796f77c2c41c2598170a48"
language = "ts"
tags = ["typescript", "ast", "tooling"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
