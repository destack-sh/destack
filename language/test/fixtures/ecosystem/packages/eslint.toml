[package]
name = "eslint"
description = "Linting utility for JS/TS"
repo = "https://github.com/eslint/eslint"
ref = "da7cd0e79197ad16e17052eef99df141de6dbfb1"
language = "js"
tags = ["tooling", "lint", "monorepo"]

[discovery]
include = ["lib/**/*.js", "packages/**/*.js", "packages/**/*.ts"]
exclude = ["**/*.test.*", "**/__tests__/**", "**/tests/**", "**/fixtures/**", "**/dist/**", "**/node_modules/**"]
