[package]
name = "tsup"
description = "TypeScript bundler"
repo = "https://github.com/egoist/tsup"
ref = "b906f86102c02f1ef66ebd4a3f7ff50bdc07af65"
language = "ts"
tier = "T5"
tags = ["tooling", "bundler", "typescript"]

[discovery]
include = ["src/**/*.ts", "src/**/*.tsx", "packages/**/*.ts", "packages/**/*.tsx", "**/*.d.ts", "**/*.mts", "**/*.cts"]
exclude = ["**/dist/**", "**/build/**", "**/coverage/**", "**/node_modules/**"]
