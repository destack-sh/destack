[package]
name = "destack_linter"
description = "Destack Linter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
destack_artifact = { workspace = true }
destack_artifact_macros = { workspace = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }
destack_unicode = { workspace = true }
destack_repository = { path = "../repository", default-features = false }

[dev-dependencies]
# language
destack_session = { workspace = true, features = ["native"] }

# general
futures = { workspace = true, features = ["executor"] }

[lints]
workspace = true
