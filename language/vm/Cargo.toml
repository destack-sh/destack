[package]
name = "destack_vm"
description = "Destack VM - MIR interpreter and JIT execution engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = []
stats = []
perf-counters = ["dep:perf-event"]

[dependencies]
# language
destack_core = { workspace = true }
destack_engine = { workspace = true }
destack_heap = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }

# util
serde = { workspace = true, features = ["rc"] }
smallvec = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
perf-event = { workspace = true, optional = true }

[dev-dependencies]
clap = { workspace = true, features = ["derive"] }
criterion = { workspace = true }
destack_test_mirbench = { workspace = true, features = ["cli", "stats"] }
pprof = { workspace = true }

[[bench]]
name = "vm_execute"
harness = false

[lints]
workspace = true
