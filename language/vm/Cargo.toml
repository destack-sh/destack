[package]
name = "destack_vm"
description = "Destack bytecode virtual machine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
default = []

[dependencies]
# language
destack_bytecode = { workspace = true }
destack_heap = { workspace = true }
destack_memory = { workspace = true }
destack_mir = { workspace = true }
destack_program = { workspace = true }
destack_serde = { workspace = true }

# util
serde = { workspace = true, features = ["rc"] }

[dev-dependencies]
# language
destack_core = { workspace = true }
destack_source = { workspace = true }

# util
criterion = { workspace = true }

[[bench]]
name = "execute"
path = "benches/execute/bench.rs"
harness = false

[lints]
workspace = true
