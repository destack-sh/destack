[package]
name = "tspp_compiler"
description = "TS++ Compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
tspp_bytecode = { workspace = true }
# language
tspp_artifact = { workspace = true }
tspp_artifact_macros = { workspace = true }
tspp_core = { workspace = true }
tspp_dir = { workspace = true }
tspp_program = { workspace = true }
tspp_fir = { workspace = true }
tspp_formatter = { workspace = true }
tspp_heap = { workspace = true }
tspp_js = { workspace = true }
tspp_mir = { workspace = true }
tspp_native = { workspace = true }
tspp_parser = { workspace = true }
tspp_source = { workspace = true }
tspp_webassembly = { workspace = true }
tspp_repository = { path = "../repository", default-features = false }
tspp_serde = { workspace = true }

# general
dashmap = { workspace = true }
elsa = { workspace = true }
filetime = { workspace = true }
indexmap = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { workspace = true }
target-lexicon = { workspace = true }
base64 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-module = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
cranelift-object = { workspace = true, optional = true }
gimli = { workspace = true, features = ["write"], optional = true }
serde_yaml_ng = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
criterion = { workspace = true }
tspp_formatter = { workspace = true }
tspp_memory = { workspace = true }
tspp_session = { workspace = true, features = ["native"] }
futures = { workspace = true, features = ["executor"] }
pprof = { workspace = true }

[features]
default = ["native"]
native = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-module",
    "dep:cranelift-native",
    "dep:cranelift-object",
    "dep:gimli",
]
deadlock-detection = ["parking_lot/deadlock_detection"]

[[bench]]
name = "tspp_compile"
harness = false

[lints]
workspace = true
