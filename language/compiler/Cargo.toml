[package]
name = "destack_compiler"
description = "Destack Compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_ast = { workspace = true }
destack_compiler_macros = { workspace = true }
destack_codegen_cranelift = { workspace = true }
destack_codegen_js = { workspace = true }
destack_codegen_lib = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_machine = { workspace = true }
destack_mir = { workspace = true }
destack_parser = { workspace = true }
destack_resolver = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { workspace = true }

# general
crossbeam-deque = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

[lints]
workspace = true
