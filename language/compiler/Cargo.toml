[package]
name = "destack_compiler"
description = "Destack Compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_ast = { workspace = true }
destack_base = { workspace = true }
destack_builtin = { workspace = true }
destack_compiler_macros = { workspace = true }
destack_codegen_native = { workspace = true }
destack_codegen_js = { workspace = true }
destack_codegen_lib = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_linter = { workspace = true }
destack_vm = { workspace = true }
destack_mir = { workspace = true }
destack_parser = { workspace = true }
destack_resolver = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { workspace = true }

# general
crossbeam-deque = { workspace = true }
dashmap = { workspace = true }
filetime = { workspace = true }
fs2 = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true, features = ["deadlock_detection"] }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
smallvec = { workspace = true }
toml = { workspace = true }
target-lexicon = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
destack_formatter = { workspace = true }
criterion = { workspace = true }
pprof = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }

[features]
bench = []

[[bench]]
name = "destack_compile"
harness = false

[[example]]
name = "bench_stats"
required-features = ["bench"]

[lints]
workspace = true
