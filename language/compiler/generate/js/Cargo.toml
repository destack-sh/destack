[package]
name = "destack_codegen_js"
description = "Destack Codegen for JavaScript/TypeScript"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_artifact = { workspace = true }
destack_codegen_lib = { workspace = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_fir = { workspace = true }
destack_js = { workspace = true }
destack_mir = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { path = "../../../workspace", default-features = false }

# general
base64 = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]

[lints]
workspace = true
