[package]
description = "Internal pulley macros"
edition = "2024"
rust-version = "1.92.0"
license = "Apache-2.0 WITH LLVM-exception"
name = "pulley-macros"
repository = "https://github.com/bytecodealliance/wasmtime/tree/main/pulley/macros"
