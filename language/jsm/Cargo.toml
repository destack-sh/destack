[package]
name = "dyst_jsm"
description = "Dyst JavaScript VM"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "rust/lib.rs"
doctest = false

[dependencies]
dyst_source = { workspace = true }
dyst_ast = { workspace = true }
dyst_fir = { workspace = true }
dyst_dir = { workspace = true }
dyst_mir = { workspace = true }
dyst_session = { workspace = true }
dyst_prelude = { workspace = true }
dyst_diagnostic = { workspace = true }
dyst_string = { workspace = true }
dyst_memory = { workspace = true }

destack_unicode = { workspace = true }

v8 = { version = "142.0.0", optional = true }
deno_runtime = { version = "0.229.0", optional = true }

[dev-dependencies]

[features]
default = []
bun = []
deno = ["dep:deno_runtime"]
jsc = []
node = []
v8 = ["dep:v8"]

[lints]
workspace = true
