[package]
name = "destack_repository"
description = "Destack Repository"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
destack_artifact = { workspace = true }
destack_ast = { workspace = true }
destack_builtin = { workspace = true }
destack_core = { workspace = true }
destack_dir = { workspace = true }
destack_source = { workspace = true }
destack_workspace = { workspace = true }

# general
dashmap = { workspace = true }
im = "15.1.0"
indexmap = { workspace = true, features = ["serde"] }
parking_lot = { workspace = true }
postcard = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
smallvec = { workspace = true }

[lints]
workspace = true
