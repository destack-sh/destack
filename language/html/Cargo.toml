[package]
name = "destack_html"
description = "Destack HTML IR"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[features]
trace_tokenizer = []

[dependencies]
# language
destack_core = { workspace = true }
destack_fir = { workspace = true }
destack_source = { workspace = true }

# general
log = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }

[lints]
workspace = true
