[package]
name = "tspp_js"
description = "TS++ JavaScript IR"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
# language
tspp_core = { workspace = true }
tspp_dir = { workspace = true }
tspp_fir = { workspace = true }
tspp_serde = { workspace = true }
tspp_source = { workspace = true }

# general
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smallvec = { workspace = true, features = ["serde"] }

[lints]
workspace = true
