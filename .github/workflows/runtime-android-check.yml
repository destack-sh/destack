name: Runtime Check (Android)

on:
  workflow_call:
    inputs:
      android_api_level:
        description: "Android API level"
        required: false
        default: "24"
        type: string
      android_ndk_version:
        description: "Android NDK version"
        required: false
        default: "27.2.12479018"
        type: string
      android_cmdline_tools_version:
        description: "Android commandline tools version"
        required: false
        default: "13114758"
        type: string

permissions:
  contents: read

jobs:
  runtime-android-check:
    name: Runtime Check (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
      ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
      ANDROID_CMDLINE_TOOLS_VERSION: ${{ inputs.android_cmdline_tools_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy
          rust_targets: aarch64-linux-android

      - name: Install Android Host Dependencies
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just language/install-runtime-android-host-deps

      - name: Restore Android SDK Cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306
        with:
          path: |
            ${{ runner.temp }}/android-sdk/cmdline-tools
            ${{ runner.temp }}/android-sdk/licenses
            ${{ runner.temp }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android Runtime NDK
        run: just language/install-runtime-android-ndk
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Check Runtime (Android)
        run: just language/check-runtime-android
        env:
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Show sccache Stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
