name: Runtime Check (Linux)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-linux-check:
    name: Runtime Check (Linux, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy

      - name: Check Runtime (Linux)
        run: just language/check-runtime-linux

      - name: Check Runtime (Linux Wayland)
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just language/check-runtime-linux-wayland

      - name: Show sccache Stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
