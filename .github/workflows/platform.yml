name: Platform

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/platform.yml"
      - "dev/toolchain/versions.sh"
      - "justfile"
      - "platform/**"
      - "blog/**"
      - "docs/**"
      - "library/**"
      - "template/**"
      - "dev/release/config.json"
      - "package.json"
      - "deno.lock"
      - "deno.json"
  push:
    branches:
      - main
    paths:
      - ".github/actions/**"
      - ".github/workflows/platform.yml"
      - "dev/toolchain/versions.sh"
      - "justfile"
      - "platform/**"
      - "blog/**"
      - "docs/**"
      - "library/**"
      - "template/**"
      - "dev/release/config.json"
      - "package.json"
      - "deno.lock"
      - "deno.json"

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check Platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install platform tools
        uses: ./.github/actions/setup-platform

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.12.6

      - name: Check Platform
        run: |
          just library/check
          just library/test
          just platform/check-quick

  deploy:
    name: Deploy Website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_COMPANY_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPANY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install platform tools
        uses: ./.github/actions/setup-platform

      - name: Deploy Website
        run: just platform/deploy
