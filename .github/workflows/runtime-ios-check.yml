name: Runtime Check (iOS)

on:
  workflow_call:
    inputs:
      ios_deployment_target:
        description: "iOS deployment target version"
        required: false
        default: "13.0"
        type: string

permissions:
  contents: read

jobs:
  runtime-ios-check:
    name: Runtime Check (iOS)
    runs-on: macos-14
    timeout-minutes: 90
    env:
      IOS_DEPLOYMENT_TARGET: ${{ inputs.ios_deployment_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy
          rust_targets: aarch64-apple-ios

      - name: Check Runtime (iOS)
        run: just language/check-runtime-ios
        env:
          IOS_DEPLOYMENT_TARGET: ${{ env.IOS_DEPLOYMENT_TARGET }}

      - name: Show sccache Stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
