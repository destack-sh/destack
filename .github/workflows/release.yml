name: Release

on:
    schedule:
        - cron: "17 2 * * *"
    workflow_dispatch:

permissions: {}

env:
    DESTACK_RELEASE_CHANNEL: stable

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

defaults:
    run:
        working-directory: "@platform/release"

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            version: ${{ steps.release.outputs.version }}
            build: ${{ steps.release.outputs.build }}
            publish: ${{ steps.release.outputs.publish }}
            targets: ${{ steps.release.outputs.targets }}
            signed: ${{ steps.release.outputs.signed }}
            unsigned: ${{ steps.release.outputs.unsigned }}
            installers: ${{ steps.release.outputs.installers }}
            names: ${{ steps.release.outputs.names }}
            renew: ${{ steps.release.outputs.renew }}
            check: ${{ steps.release.outputs.check }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Select release version and work
              id: release
              run: bun run src/github/prepare.ts

    check:
        name: Check workspace
        needs: [prepare]
        if: needs.prepare.outputs.build == 'true'
        permissions:
            contents: read
        uses: ./.github/workflows/check.yml

    build:
        name: Build distribution (${{ matrix.target }})
        needs: [prepare, check]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.targets) }}
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install native desktop dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
            - name: Install Rust
              shell: bash
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Build distribution
              run: bun run src/distribution/build.ts ${{ matrix.target }}
            - name: Verify distribution
              run: bun run src/distribution/verify.ts ${{ matrix.target }}
            - name: Pack distribution
              run: bun run src/distribution/pack.ts ${{ matrix.target }}
            - name: Verify archive staging and activation with disposable signing keys
              run: bun run src/distribution/rehearse.ts "$DESTACK_RELEASE_VERSION" "$GITHUB_WORKSPACE/dist/$DESTACK_RELEASE_VERSION/destack-$DESTACK_RELEASE_VERSION-${{ matrix.target }}.tar.gz"
              shell: bash
            - name: Upload unsigned distribution
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: unsigned-${{ matrix.target }}
                  retention-days: 14
                  path: dist/*/*.tar.gz
                  if-no-files-found: error

    sign:
        name: Sign distribution (${{ matrix.target }})
        needs: [prepare, build]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        environment: release-stable
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.signed) }}
        env:
            DESTACK_SIGNING: release
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Download unsigned distribution
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  name: unsigned-${{ matrix.target }}
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Unpack distribution
              run: bun run src/signing/sign.ts unpack ${{ matrix.target }}
            - name: Prepare Apple signing credentials
              if: matrix.signer == 'apple'
              uses: ./.github/actions/setup-apple
              with:
                  certificate: ${{ secrets.APPLE_CERTIFICATE }}
                  password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  identity: ${{ vars.APPLE_SIGNING_IDENTITY }}
                  key: ${{ secrets.APPLE_NOTARY_KEY }}
                  key-id: ${{ vars.APPLE_NOTARY_KEY_ID }}
                  issuer: ${{ vars.APPLE_NOTARY_ISSUER }}
            - name: Sign and notarize distribution
              run: bun run src/signing/sign.ts sign ${{ matrix.target }}
            - name: Verify distribution
              run: bun run src/distribution/verify.ts ${{ matrix.target }}
            - name: Pack distribution
              run: bun run src/distribution/pack.ts ${{ matrix.target }}
            - name: Upload signed distribution
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: signed-${{ matrix.target }}
                  retention-days: 14
                  path: dist/*/*.tar.gz
                  if-no-files-found: error
            - name: Remove Apple signing credentials
              if: always() && matrix.signer == 'apple'
              run: bun run src/apple/credential.ts remove

    build-installers:
        name: Build installer (${{ matrix.name }})
        needs: [prepare, build, sign]
        if: >-
            !cancelled() && needs.build.result == 'success' && needs.prepare.outputs.installers != '[]' &&
            (needs.sign.result == 'success' || (needs.prepare.outputs.publish != 'true' && needs.sign.result == 'skipped'))
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        environment: ${{ needs.prepare.outputs.publish == 'true' && 'release-stable' || 'build' }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.installers) }}
        env:
            DESTACK_SIGNING: ${{ needs.prepare.outputs.publish == 'true' && 'release' || 'development' }}
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Download the installer's distributions
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: ${{ needs.prepare.outputs.publish == 'true' && 'signed' || 'unsigned' }}-${{ matrix.targets }}
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Prepare Apple signing credentials
              if: needs.prepare.outputs.publish == 'true' && matrix.signer == 'apple'
              uses: ./.github/actions/setup-apple
              with:
                  certificate: ${{ secrets.APPLE_CERTIFICATE }}
                  password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  identity: ${{ vars.APPLE_SIGNING_IDENTITY }}
                  key: ${{ secrets.APPLE_NOTARY_KEY }}
                  key-id: ${{ vars.APPLE_NOTARY_KEY_ID }}
                  issuer: ${{ vars.APPLE_NOTARY_ISSUER }}
            - name: Build installer
              run: bun run src/installer/build.ts ${{ matrix.name }}
            - name: Upload installer
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: installer-${{ matrix.name }}
                  retention-days: 14
                  path: dist/*/destack-*-${{ matrix.name }}.${{ matrix.format }}
                  if-no-files-found: error
            - name: Remove Apple signing credentials
              if: always() && needs.prepare.outputs.publish == 'true' && matrix.signer == 'apple'
              run: bun run src/apple/credential.ts remove

    publish:
        name: Publish release
        needs: [prepare, sign, build-installers]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: release-stable
        permissions:
            contents: read
            id-token: write
            attestations: write
        concurrency:
            group: update-repository
            cancel-in-progress: false
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Download signed distributions
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: signed-*
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Download distributions without a platform signer
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: unsigned-${{ needs.prepare.outputs.unsigned }}
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Download installers
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with:
                  pattern: installer-*
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Attest build provenance of the archives and installers
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
              with:
                  subject-path: dist/${{ needs.prepare.outputs.version }}/destack-*
            - name: Prepare update signing keys
              run: bun run src/github/credential.ts release
              env:
                  DESTACK_TARGETS_KEY: ${{ secrets.DESTACK_TARGETS_KEY }}
                  DESTACK_SNAPSHOT_KEY: ${{ secrets.DESTACK_SNAPSHOT_KEY }}
                  DESTACK_TIMESTAMP_KEY: ${{ secrets.DESTACK_TIMESTAMP_KEY }}
            - name: Sign targets, snapshot and timestamp
              run: bun run src/repository/sign.ts ${{ needs.prepare.outputs.names }}
            - name: Upload release
              run: bun run src/repository/upload.ts
              env:
                  CLOUDFLARE_RELEASE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_RELEASE_ACCESS_KEY_ID }}
                  CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY }}
            - name: Verify published metadata and archives
              run: bun run src/repository/verify.ts
            - name: Remove update signing keys
              if: always()
              run: bun run src/github/credential.ts remove

    record:
        name: Record release
        needs: [prepare, publish]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Tag the release and publish its notes
              run: bun run src/github/record.ts

    deploy:
        name: Deploy production
        needs: [prepare, publish]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: production
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        env:
            AWS_REGION: eu-central-1
            TF_IN_AUTOMATION: "true"
            CLOUDFLARE_COMPANY_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPANY_API_TOKEN }}
            PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
            PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
            DESTACK_ROOT_KEY: ${{ secrets.DESTACK_ROOT_KEY }}
            DESTACK_OPERATOR: ${{ vars.DESTACK_OPERATOR }}
            STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        defaults:
            run:
                working-directory: "@platform/release"
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Assume deploy role
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
              with:
                  role-to-assume: arn:aws:iam::903685415634:role/destack-deploy
                  role-session-name: deploy-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Deploy production
              run: bun run src/main.ts deploy production

    drift:
        name: Check production drift
        needs: [prepare]
        if: github.event_name == 'schedule'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: drift
        permissions:
            contents: read
            id-token: write
        env:
            AWS_REGION: eu-central-1
            TF_IN_AUTOMATION: "true"
            CLOUDFLARE_COMPANY_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPANY_API_TOKEN }}
            PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
            PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
        defaults:
            run:
                working-directory: "@platform/release"
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Assume plan role
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
              with:
                  role-to-assume: arn:aws:iam::903685415634:role/destack-plan
                  role-session-name: drift-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Refuse production universe drift
              run: bun run src/main.ts drift production universe
            - name: Refuse production eu drift
              run: bun run src/main.ts drift production eu
            - name: Refuse production us drift
              run: bun run src/main.ts drift production us

    renew:
        name: Renew release metadata
        needs: [prepare]
        if: needs.prepare.outputs.renew == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: renewal-stable
        permissions:
            contents: read
        concurrency:
            group: update-repository
            cancel-in-progress: false
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Prepare freshness signing keys
              run: bun run src/github/credential.ts renew
              env:
                  DESTACK_SNAPSHOT_KEY: ${{ secrets.DESTACK_SNAPSHOT_KEY }}
                  DESTACK_TIMESTAMP_KEY: ${{ secrets.DESTACK_TIMESTAMP_KEY }}
            - name: Sign snapshot and timestamp
              run: bun run src/repository/renew.ts freshness
            - name: Submit signed freshness
              run: bun run src/repository/submit.ts dist/refresh
            - name: Verify published metadata
              run: bun run src/repository/verify.ts dist/refresh
            - name: Remove freshness signing keys
              if: always()
              run: bun run src/github/credential.ts remove

    check-expiry:
        name: Check release metadata expiry
        needs: [prepare, publish, renew]
        if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.check == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Check every role outlives its renewal window
              run: bun run src/repository/expiry.ts

    verify:
        name: Verify installation and updates (${{ matrix.target }})
        needs: [prepare, publish]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.targets) }}
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              working-directory: ${{ github.workspace }}
              run: bun install --frozen-lockfile
            - name: Install Linux desktop runtime dependencies
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0
            - name: Install the published distribution and verify restart and updates
              run: bun run src/distribution/install.ts
