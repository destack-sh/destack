name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_packages:
        description: "Publish library/platform packages after verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-11-27
  BUN_VERSION: 1.2.18

jobs:
  verify:
    name: Release Verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run language check
        run: just language/check

      - name: Run parser crate tests
        run: cargo test --release -p destack_parser --lib

      - name: Run smoke tests
        run: just language/test-smoke

      - name: Run specification tests
        run: just language/test-specification

      - name: Run query tests
        run: just language/test-query

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library format check
        run: just library/format-check

      - name: Run library lint
        run: just library/lint

      - name: Run library tests
        run: just library/test

      - name: Run platform format check
        run: just platform/format-check

      - name: Run platform lint
        run: just platform/lint

      - name: Run platform tests
        run: just platform/test

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Build language artifacts
        run: just language/build

      - name: Generate CLI schema
        run: just platform/generate-schema

      - name: Upload release schemas
        uses: actions/upload-artifact@v4
        with:
          name: release-schemas-${{ github.sha }}
          path: |
            workspace/generated/dsconfig.schema.json
            platform/cli/generated/cli-report.schema.json
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release schemas
        uses: actions/download-artifact@v4
        with:
          name: release-schemas-${{ github.sha }}
          path: release-schemas

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-schemas/*

  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - build-artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_packages == true
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Publish packages
        run: just publish ""
