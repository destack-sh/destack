name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_packages:
        description: "Publish library/platform packages after verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-11-27
  BUN_VERSION: 1.2.18

jobs:
  verify:
    name: Release Verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run language format gate
        run: just language/ci-format

      - name: Run language lint gate
        run: just language/ci-lint

      - name: Cache conformance fixtures
        id: language-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/conformance/test262
            language/test/fixtures/conformance/babel
            language/test/fixtures/conformance/swc
            language/test/fixtures/conformance/biome
          key: ${{ runner.os }}-language-conformance-${{ hashFiles('language/test/fixtures/conformance/*-fetch.sh') }}

      - name: Install conformance fixtures
        if: steps.language-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-conformance

      - name: Cache formatter conformance fixtures
        id: language-formatter-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/formatter/conformance/staging/prettier
            language/test/fixtures/formatter/conformance/staging/oxfmt
          key: ${{ runner.os }}-language-formatter-conformance-${{ hashFiles('language/test/fixtures/formatter/conformance/*-fetch.sh') }}

      - name: Install formatter conformance fixtures
        if: steps.language-formatter-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-formatter-conformance

      - name: Run language test gates
        run: just language/ci-tests

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library format check
        run: just library/ci-format

      - name: Run library lint
        run: just library/ci-lint

      - name: Run library tests
        run: just library/ci-tests

      - name: Run platform format check
        run: just platform/ci-format

      - name: Run platform lint
        run: just platform/ci-lint

      - name: Run platform tests
        run: just platform/ci-tests

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - verify
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Build language artifacts
        run: just language/build

      - name: Generate CLI schema
        run: just platform/generate-schema

      - name: Upload release schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-schemas-${{ github.sha }}
          path: |
            workspace/generated/dsconfig.schema.json
            platform/cli/generated/cli-report.schema.json
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-schemas-${{ github.sha }}
          path: release-schemas

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          generate_release_notes: true
          files: release-schemas/*

  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - build-artifacts
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_packages == true
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Publish packages
        run: just publish ""
