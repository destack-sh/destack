name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Release Verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate release tag matches VERSION.txt
        run: bash scripts/ci/validate-release-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Validate zed grammar pins
        run: python3 bridge/zed/scripts/check_grammar_sources.py --require-pinned --pin-destack-revision "${GITHUB_SHA}"

      - name: Setup Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Validate tracked version files
        run: cargo run -p destack_cli --release -- dev version check

      - name: Validate changelog entry for release version
        run: bash scripts/ci/validate-release-changelog.sh "$(cat VERSION.txt)"

      - name: Run language format gate
        run: just language/ci-format

      - name: Run language lint gate
        run: just language/ci-lint

      - name: Cache conformance fixtures
        id: language-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/parser/conformance/test262
            language/test/fixtures/parser/conformance/babel
            language/test/fixtures/parser/conformance/swc
            language/test/fixtures/parser/conformance/biome
          key: ${{ runner.os }}-language-conformance-${{ hashFiles('language/test/fixtures/parser/conformance/*-fetch.sh') }}

      - name: Install conformance fixtures
        if: steps.language-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-parser-conformance

      - name: Cache formatter conformance fixtures
        id: language-formatter-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/formatter/conformance/staging/prettier
            language/test/fixtures/formatter/conformance/staging/oxfmt
          key: ${{ runner.os }}-language-formatter-conformance-${{ hashFiles('language/test/fixtures/formatter/conformance/*-fetch.sh') }}

      - name: Install formatter conformance fixtures
        if: steps.language-formatter-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-formatter-conformance

      - name: Run language release tests
        run: just language/test-release

      - name: Ensure language bridge toolchains
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just bridge/toolchain-ensure

      - name: Run library format check
        run: just library/ci-format

      - name: Run library lint
        run: just library/ci-lint

      - name: Run library release tests
        run: just library/test-release

      - name: Run service format check
        run: just service/ci-format

      - name: Run app format check
        run: just app/ci-format

      - name: Run bridge format check
        run: just bridge/ci-format

      - name: Run service lint
        run: just service/ci-lint

      - name: Run app lint
        run: just app/ci-lint

      - name: Run bridge lint
        run: just bridge/ci-lint

      - name: Run service release tests
        run: just service/test-release

      - name: Run app release tests
        run: just app/test-release

      - name: Run bridge release tests
        run: just bridge/test-release

  runtime-android:
    name: Runtime Android
    needs:
      - verify
    uses: ./.github/workflows/runtime-android.yml

  runtime-ios:
    name: Runtime iOS
    needs:
      - verify
    uses: ./.github/workflows/runtime-ios.yml

  runtime-linux:
    name: Runtime Linux
    needs:
      - verify
    uses: ./.github/workflows/runtime-linux.yml

  runtime-macos:
    name: Runtime macOS
    needs:
      - verify
    uses: ./.github/workflows/runtime-macos.yml

  runtime-windows:
    name: Runtime Windows
    needs:
      - verify
    uses: ./.github/workflows/runtime-windows.yml

  runtime-windows-gnu:
    name: Runtime Windows GNU
    needs:
      - verify
    uses: ./.github/workflows/runtime-windows-gnu.yml

  runtime-wasip1:
    name: Runtime WASIp1
    needs:
      - verify
    uses: ./.github/workflows/runtime-wasip1.yml

  release-smoke-runtime-unix:
    needs:
      - verify
      - runtime-linux
      - runtime-macos
    uses: ./.github/workflows/release-runtime-smoke-unix.yml

  release-smoke-runtime-windows:
    needs:
      - verify
      - runtime-windows
    uses: ./.github/workflows/release-runtime-smoke-windows.yml

  release-smoke-runtime-windows-gnu:
    needs:
      - verify
      - runtime-windows-gnu
    uses: ./.github/workflows/release-runtime-smoke-windows-gnu.yml

  build-artifacts:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - verify
      - runtime-android
      - runtime-ios
      - runtime-linux
      - runtime-macos
      - runtime-windows
      - runtime-windows-gnu
      - runtime-wasip1
      - release-smoke-runtime-unix
      - release-smoke-runtime-windows
      - release-smoke-runtime-windows-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Build language artifacts
        run: just language/build

      - name: Generate CLI schema
        run: just app/generate-schema

      - name: Upload release schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-schemas-${{ github.sha }}
          path: |
            workspace/generated/dsconfig.schema.json
            app/cli/generated/cli-report.schema.json
          if-no-files-found: error

  build-cli-binaries:
    name: Build CLI Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs:
      - verify
      - runtime-android
      - runtime-ios
      - runtime-linux
      - runtime-macos
      - runtime-windows
      - runtime-windows-gnu
      - runtime-wasip1
      - release-smoke-runtime-unix
      - release-smoke-runtime-windows
      - release-smoke-runtime-windows-gnu
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linker: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            linker: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            linker: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            linker: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: ${{ matrix.target }}

      - name: Install Linux cross compiler
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI binaries
        run: cargo build --release -p destack_cli --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Stage unix release binaries
        if: runner.os != 'Windows'
        run: |
          mkdir -p "release-binaries/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/destack" "release-binaries/${{ matrix.target }}/destack"
          cp "target/${{ matrix.target }}/release/ds" "release-binaries/${{ matrix.target }}/ds"
          cp "target/${{ matrix.target }}/release/dsc" "release-binaries/${{ matrix.target }}/dsc"
          cp "target/${{ matrix.target }}/release/dsx" "release-binaries/${{ matrix.target }}/dsx"

      - name: Stage windows release binaries
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "release-binaries/${{ matrix.target }}" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/destack.exe" "release-binaries/${{ matrix.target }}/destack.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/ds.exe" "release-binaries/${{ matrix.target }}/ds.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/dsc.exe" "release-binaries/${{ matrix.target }}/dsc.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/dsx.exe" "release-binaries/${{ matrix.target }}/dsx.exe" -Force

      - name: Upload cli binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-binaries-${{ matrix.target }}-${{ github.sha }}
          path: release-binaries/${{ matrix.target }}
          if-no-files-found: error

  package-cli-artifacts:
    name: Package CLI Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - build-cli-binaries
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download linux x64 cli binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-binaries-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: release-binaries/x86_64-unknown-linux-gnu

      - name: Download linux arm64 cli binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-binaries-aarch64-unknown-linux-gnu-${{ github.sha }}
          path: release-binaries/aarch64-unknown-linux-gnu

      - name: Download macos x64 cli binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-binaries-x86_64-apple-darwin-${{ github.sha }}
          path: release-binaries/x86_64-apple-darwin

      - name: Download macos arm64 cli binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-binaries-aarch64-apple-darwin-${{ github.sha }}
          path: release-binaries/aarch64-apple-darwin

      - name: Download windows x64 cli binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-binaries-x86_64-pc-windows-msvc-${{ github.sha }}
          path: release-binaries/x86_64-pc-windows-msvc

      - name: Stage binaries for packaging scripts
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          mkdir -p target/aarch64-unknown-linux-gnu/release
          mkdir -p target/x86_64-apple-darwin/release
          mkdir -p target/aarch64-apple-darwin/release
          mkdir -p target/x86_64-pc-windows-msvc/release

          cp release-binaries/x86_64-unknown-linux-gnu/* target/x86_64-unknown-linux-gnu/release/
          cp release-binaries/aarch64-unknown-linux-gnu/* target/aarch64-unknown-linux-gnu/release/
          cp release-binaries/x86_64-apple-darwin/* target/x86_64-apple-darwin/release/
          cp release-binaries/aarch64-apple-darwin/* target/aarch64-apple-darwin/release/
          cp release-binaries/x86_64-pc-windows-msvc/* target/x86_64-pc-windows-msvc/release/

      - name: Package cli release archives
        run: bash app/cli/install/package-release-artifacts.sh "$(cat VERSION.txt)" release-cli-assets

      - name: Validate cli release archives
        run: bash app/cli/install/validate-release-artifacts.sh "$(cat VERSION.txt)" release-cli-assets

      - name: Run installer smoke test
        run: bash app/cli/install/test-install.sh "$(cat VERSION.txt)" release-cli-assets

      - name: Upload cli release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-cli-assets-${{ github.sha }}
          path: release-cli-assets/*
          if-no-files-found: error

  smoke-install-windows:
    name: Smoke Test Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    needs:
      - package-cli-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download cli release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-assets-${{ github.sha }}
          path: release-cli-assets

      - name: Run windows installer smoke test
        shell: powershell
        run: |
          $version = (Get-Content "VERSION.txt").Trim()
          $releaseTag = "v$version"
          $tempRoot = Join-Path $env:RUNNER_TEMP "destack-install-smoke-$env:GITHUB_RUN_ID"
          $releaseDirectory = Join-Path $tempRoot "releases\download\$releaseTag"
          $installDirectory = Join-Path $tempRoot "install\bin"
          $port = Get-Random -Minimum 20000 -Maximum 60000
          $pythonCommand = $null
          $pythonArguments = @()

          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item "release-cli-assets/destack-$version-x86_64-pc-windows-msvc.zip" "$releaseDirectory/" -Force
          Copy-Item "release-cli-assets/SHA256SUMS" "$releaseDirectory/" -Force

          if ($null -ne (Get-Command "python" -ErrorAction SilentlyContinue)) {
            $pythonCommand = "python"
          } elseif ($null -ne (Get-Command "py" -ErrorAction SilentlyContinue)) {
            $pythonCommand = "py"
            $pythonArguments += "-3"
          } else {
            throw "missing python runtime on windows runner"
          }

          $pythonArguments += @("-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", "$tempRoot")

          $serverProcess = $null
          try {
            $serverProcess = Start-Process `
              -FilePath $pythonCommand `
              -ArgumentList $pythonArguments `
              -PassThru

            $healthUrl = "http://127.0.0.1:$port/releases/download/$releaseTag/SHA256SUMS"
            $attempt = 0
            while ($attempt -lt 10) {
              try {
                Invoke-WebRequest -Uri $healthUrl | Out-Null
                break
              } catch {
                Start-Sleep -Seconds 1
                $attempt += 1
              }
            }

            if ($attempt -ge 10) {
              throw "local installer smoke server did not start in time"
            }

            $env:DESTACK_VERSION = $version
            $env:DESTACK_RELEASE_BASE_URL = "http://127.0.0.1:$port/releases/download"
            $env:DESTACK_INSTALL = $installDirectory
            $env:DESTACK_NO_MODIFY_PATH = "1"
            .\app\cli\install\install.ps1

            & (Join-Path $installDirectory "destack.exe") --version | Out-Null
            & (Join-Path $installDirectory "ds.exe") --version | Out-Null
          } finally {
            if ($null -ne $serverProcess -and -not $serverProcess.HasExited) {
              Stop-Process -Id $serverProcess.Id -Force
            }
          }

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-artifacts
      - package-cli-artifacts
      - smoke-install-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download release schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-schemas-${{ github.sha }}
          path: release-schemas

      - name: Download cli release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-assets-${{ github.sha }}
          path: release-cli-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          generate_release_notes: true
          files: |
            release-schemas/*
            release-cli-assets/*
            app/cli/install/install.sh
            app/cli/install/install.ps1

  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - build-artifacts
      - package-cli-artifacts
      - smoke-install-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate release tag matches VERSION.txt
        run: bash scripts/ci/validate-release-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Setup Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005
        with:
          ruby-version: "3.4"

      - name: Setup Dart for pub.dev OIDC
        if: vars.PUB_DEV_USE_OIDC == 'true'
        uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c

      - name: Download cli release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-cli-assets-${{ github.sha }}
          path: release-cli-assets

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Ensure bridge publish toolchains
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just bridge/toolchain-ensure

      - name: Stage cli npm binaries from release artifacts
        run: just app/stage-cli-binaries-from-artifacts "$(cat VERSION.txt)" "release-cli-assets"

      - name: Validate publish configuration
        run: |
          if [ -z "${CARGO_TOKEN}" ]; then
            echo "missing CARGO_TOKEN secret"
            exit 1
          fi
          if [ -z "${VSCE_PAT}" ]; then
            echo "missing VSCE_PAT secret"
            exit 1
          fi
          if [ -z "${MAVEN_REPOSITORY_USERNAME}" ]; then
            echo "missing MAVEN_REPOSITORY_USERNAME secret"
            exit 1
          fi
          if [ -z "${MAVEN_REPOSITORY_PASSWORD}" ]; then
            echo "missing MAVEN_REPOSITORY_PASSWORD secret"
            exit 1
          fi
          if [ -z "${MAVEN_GPG_PRIVATE_KEY}" ]; then
            echo "missing MAVEN_GPG_PRIVATE_KEY secret"
            exit 1
          fi
          if [ -z "${MAVEN_GPG_PASSPHRASE}" ]; then
            echo "missing MAVEN_GPG_PASSPHRASE secret"
            exit 1
          fi
          if [ -z "${MAVEN_GPG_KEY_ID}" ]; then
            echo "missing MAVEN_GPG_KEY_ID variable"
            exit 1
          fi
          if [ -z "${HEX_API_KEY}" ]; then
            echo "missing HEX_API_KEY secret"
            exit 1
          fi

          if [ "${NPM_USE_TRUSTED_PUBLISHING}" != "true" ] && [ -z "${NPM_TOKEN}" ]; then
            echo "missing npm auth: set NPM_TOKEN or enable NPM_USE_TRUSTED_PUBLISHING=true"
            exit 1
          fi

          if [ "${NUGET_USE_TRUSTED_PUBLISHING}" = "true" ]; then
            if [ -z "${NUGET_PUBLISH_USERNAME}" ]; then
              echo "missing NUGET_PUBLISH_USERNAME variable for trusted nuget publishing"
              exit 1
            fi
          elif [ -z "${NUGET_API_KEY}" ]; then
            echo "missing NUGET_API_KEY secret"
            exit 1
          fi

          if [ "${RUBYGEMS_USE_TRUSTED_PUBLISHING}" = "true" ]; then
            if [ -z "${RUBYGEMS_OIDC_ROLE}" ]; then
              echo "missing RUBYGEMS_OIDC_ROLE variable for trusted rubygems publishing"
              exit 1
            fi
          elif [ -z "${RUBYGEMS_API_KEY}" ]; then
            echo "missing RUBYGEMS_API_KEY secret"
            exit 1
          fi

          if [ "${PUB_DEV_USE_OIDC}" != "true" ] && [ -z "${PUB_DEV_CREDENTIALS_JSON}" ]; then
            echo "missing pub.dev auth: set PUB_DEV_CREDENTIALS_JSON or enable PUB_DEV_USE_OIDC=true"
            exit 1
          fi

          if [ "${PUBLISH_ZED}" = "true" ]; then
            if [ -z "${ZED_GITHUB_TOKEN}" ]; then
              echo "missing ZED_GITHUB_TOKEN secret"
              exit 1
            fi
            if [ -z "${ZED_REGISTRY_PUSH_TO}" ]; then
              echo "missing ZED_REGISTRY_PUSH_TO variable"
              exit 1
            fi
          fi
        env:
          NPM_USE_TRUSTED_PUBLISHING: ${{ vars.NPM_USE_TRUSTED_PUBLISHING }}
          NUGET_USE_TRUSTED_PUBLISHING: ${{ vars.NUGET_USE_TRUSTED_PUBLISHING }}
          NUGET_PUBLISH_USERNAME: ${{ vars.NUGET_PUBLISH_USERNAME }}
          RUBYGEMS_USE_TRUSTED_PUBLISHING: ${{ vars.RUBYGEMS_USE_TRUSTED_PUBLISHING }}
          RUBYGEMS_OIDC_ROLE: ${{ vars.RUBYGEMS_OIDC_ROLE }}
          PUB_DEV_USE_OIDC: ${{ vars.PUB_DEV_USE_OIDC }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_ID: ${{ vars.MAVEN_GPG_KEY_ID }}
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
          PUB_DEV_CREDENTIALS_JSON: ${{ secrets.PUB_DEV_CREDENTIALS_JSON }}
          PUBLISH_ZED: ${{ vars.RELEASE_PUBLISH_ZED }}
          ZED_GITHUB_TOKEN: ${{ secrets.ZED_GITHUB_TOKEN }}
          ZED_REGISTRY_PUSH_TO: ${{ vars.ZED_REGISTRY_PUSH_TO }}

      - name: Configure npm token authentication
        if: vars.NPM_USE_TRUSTED_PUBLISHING != 'true'
        run: |
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Login to NuGet with OIDC
        if: vars.NUGET_USE_TRUSTED_PUBLISHING == 'true'
        id: nuget-login
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544
        with:
          user: ${{ vars.NUGET_PUBLISH_USERNAME }}

      - name: Configure RubyGems credentials with OIDC
        if: vars.RUBYGEMS_USE_TRUSTED_PUBLISHING == 'true'
        uses: rubygems/configure-rubygems-credentials@bc6dd217f8a4f919d6835fcfefd470ef821f5c44
        with:
          role-to-assume: ${{ vars.RUBYGEMS_OIDC_ROLE }}

      - name: Publish npm packages
        run: |
          just library/publish-live
          just template/publish-create-destack-live
          just app/publish-live
          just bridge/publish-npm ""
          just bridge/publish-bun ""
          just bridge/publish-vite ""
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          DESTACK_NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_USE_TRUSTED_PUBLISHING }}

      - name: Publish Cargo packages
        run: just bridge/publish-cargo ""
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}

      - name: Publish NuGet package
        run: just bridge/publish-nuget ""
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_OIDC_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Publish Maven package
        run: just bridge/publish-maven ""
        env:
          MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_KEY_ID: ${{ vars.MAVEN_GPG_KEY_ID }}

      - name: Publish Ruby gem
        run: just bridge/publish-rubygems ""
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}

      - name: Publish Hex package
        run: just bridge/publish-hex ""
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Publish pub.dev package with OIDC
        if: vars.PUB_DEV_USE_OIDC == 'true'
        run: just bridge/publish-pub ""
        env:
          DESTACK_PUB_USE_OIDC: "1"

      - name: Publish pub.dev package with credentials
        if: vars.PUB_DEV_USE_OIDC != 'true'
        run: just bridge/publish-pub ""
        env:
          PUB_DEV_CREDENTIALS_JSON: ${{ secrets.PUB_DEV_CREDENTIALS_JSON }}

      - name: Build PyPI distributions
        run: |
          python3 -m pip install --upgrade pip build twine
          (cd bridge/python && python3 -m build && python3 -m twine check dist/*)
          (cd bridge/python/aliases/destack-py && python3 -m build && python3 -m twine check dist/*)

      - name: Publish PyPI package
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
        with:
          packages-dir: bridge/python/dist

      - name: Publish PyPI legacy alias package
        uses: pypa/gh-action-pypi-publish@ec4db0b4ddc65acdf4bff5fa45ac92d78b56bdf0
        with:
          packages-dir: bridge/python/aliases/destack-py/dist

      - name: Publish VS Code extension
        run: just bridge/publish-vscode ""
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish zed registry PR
        if: vars.RELEASE_PUBLISH_ZED == 'true'
        run: just bridge/publish-zed "" "$(cat VERSION.txt)"
        env:
          GH_TOKEN: ${{ secrets.ZED_GITHUB_TOKEN }}
          DESTACK_ZED_REGISTRY_PUSH_TO: ${{ vars.ZED_REGISTRY_PUSH_TO }}
