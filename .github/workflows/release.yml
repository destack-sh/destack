name: Release

on:
    schedule:
        - cron: "17 2 * * *"
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

defaults:
    run:
        working-directory: "@platform/release"

jobs:
    prepare:
        name: Prepare release
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
            actions: read
        outputs:
            commit: ${{ steps.commit.outputs.commit }}
            version: ${{ steps.release.outputs.version }}
            build: ${{ steps.release.outputs.build }}
            publish: ${{ steps.release.outputs.publish }}
            targets: ${{ steps.release.outputs.targets }}
            signed: ${{ steps.release.outputs.signed }}
            unsigned: ${{ steps.release.outputs.unsigned }}
            installers: ${{ steps.release.outputs.installers }}
            names: ${{ steps.release.outputs.names }}
            renew: ${{ steps.release.outputs.renew }}
            published: ${{ steps.release.outputs.published }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            - name: Select the commit to release
              id: commit
              working-directory: ${{ github.workspace }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHA: ${{ github.sha }}
              run: |
                  # build a branch's own commit, which the release never publishes
                  if [ "$GITHUB_REF" != refs/heads/main ]; then
                      echo "commit=$SHA" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  # release the newest push to main up to the run's commit that passed the check workflow
                  passed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/check.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[].head_sha')"
                  commit=""
                  for candidate in $passed; do
                      if git merge-base --is-ancestor "$candidate" "$SHA"; then
                          commit="$candidate"
                          break
                      fi
                  done
                  if [ -z "$commit" ]; then
                      echo "::error::no commit up to ${SHA} passed the check"
                      exit 1
                  fi
                  git checkout --quiet --detach "$commit"
                  echo "commit=$commit" >> "$GITHUB_OUTPUT"
            - name: Set up
              uses: ./.github/actions/setup
            - name: Select release version and work
              id: release
              run: bun run src/main.ts release prepare

    releases:
        name: Build first-party releases
        needs: [prepare]
        if: needs.prepare.outputs.build == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Set up the sandbox the releases compile in
              uses: ./.github/actions/setup-sandbox
            - name: Restore the release store
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      target/releases/store.db*
                      target/releases/files
                  key: release-store-${{ needs.prepare.outputs.commit }}
                  restore-keys: release-store-
            - name: Build first-party releases
              run: bun run src/main.ts platform build
            - name: Save the release store
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      target/releases/store.db*
                      target/releases/files
                  key: release-store-${{ needs.prepare.outputs.commit }}

    build:
        name: Build distribution (${{ matrix.target }})
        needs: [prepare, releases]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.targets) }}
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Install native desktop dependencies
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-apt
              with:
                  packages: libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libxdo-dev libayatana-appindicator3-dev
            - name: Install Rust
              shell: bash
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable
            - name: Set up
              uses: ./.github/actions/setup
            - name: Set up the sandbox the build compiles in
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-sandbox
            - name: Restore the release store
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      target/releases/store.db*
                      target/releases/files
                  key: release-store-${{ needs.prepare.outputs.commit }}
                  fail-on-cache-miss: true
            - name: Cache the native desktop build
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: dist/.native
                  key: native-${{ matrix.target }}-${{ hashFiles('@destack/desktop/native/Cargo.lock') }}
                  restore-keys: native-${{ matrix.target }}-
            - name: Build distribution
              run: bun run src/main.ts distribution build ${{ matrix.target }}
            - name: Pack distribution
              run: bun run src/main.ts distribution pack ${{ matrix.target }}
            - name: Upload unsigned distribution
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: unsigned-${{ matrix.target }}
                  retention-days: 14
                  path: dist/${{ needs.prepare.outputs.version }}/*.tar.gz
                  if-no-files-found: error
            - name: Pack toolchain
              # a tarball keeps every file the manifest lists, dotfiles included, which directory artifacts drop
              env:
                  TOOLCHAIN: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.version }}/${{ matrix.target }}/toolchain
              run: tar -cf "$RUNNER_TEMP/toolchain.tar" -C "$TOOLCHAIN" .
            - name: Upload unsigned toolchain
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: toolchain-unsigned-${{ matrix.target }}
                  retention-days: 14
                  path: ${{ runner.temp }}/toolchain.tar
                  if-no-files-found: error

    sign:
        name: Sign distribution (${{ matrix.target }})
        needs: [prepare, build]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        environment: release
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.signed) }}
        env:
            DESTACK_SIGNING: release
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Download unsigned distribution
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: unsigned-${{ matrix.target }}
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Unpack distribution
              run: bun run src/main.ts signing sign unpack ${{ matrix.target }}
            - name: Download unsigned toolchain
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: toolchain-unsigned-${{ matrix.target }}
                  path: ${{ runner.temp }}
            - name: Unpack toolchain
              env:
                  TOOLCHAIN: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.version }}/${{ matrix.target }}/toolchain
              run: mkdir -p "$TOOLCHAIN" && tar -xf "$RUNNER_TEMP/toolchain.tar" -C "$TOOLCHAIN" && rm "$RUNNER_TEMP/toolchain.tar"
            - name: Prepare Apple signing credentials
              if: matrix.signer == 'apple'
              uses: ./.github/actions/setup-apple
              with:
                  certificate: ${{ secrets.APPLE_CERTIFICATE }}
                  password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  identity: ${{ vars.APPLE_SIGNING_IDENTITY }}
                  key: ${{ secrets.APPLE_NOTARY_KEY }}
                  key-id: ${{ vars.APPLE_NOTARY_KEY_ID }}
                  issuer: ${{ vars.APPLE_NOTARY_ISSUER }}
            - name: Sign and notarize distribution
              run: bun run src/main.ts signing sign sign ${{ matrix.target }}
            - name: Pack distribution
              run: bun run src/main.ts distribution pack ${{ matrix.target }}
            - name: Upload signed distribution
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: signed-${{ matrix.target }}
                  retention-days: 14
                  path: dist/${{ needs.prepare.outputs.version }}/*.tar.gz
                  if-no-files-found: error
            - name: Pack toolchain
              # a tarball keeps every file the manifest lists, dotfiles included, which directory artifacts drop
              env:
                  TOOLCHAIN: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.version }}/${{ matrix.target }}/toolchain
              run: tar -cf "$RUNNER_TEMP/toolchain.tar" -C "$TOOLCHAIN" .
            - name: Upload signed toolchain
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: toolchain-signed-${{ matrix.target }}
                  retention-days: 14
                  path: ${{ runner.temp }}/toolchain.tar
                  if-no-files-found: error
            - name: Remove Apple signing credentials
              if: always() && matrix.signer == 'apple'
              run: bun run src/main.ts signing credential remove

    installers:
        name: Build installer (${{ matrix.name }})
        needs: [prepare, build, sign]
        if: >-
            !cancelled() && needs.build.result == 'success' && needs.prepare.outputs.installers != '[]' &&
            (needs.sign.result == 'success' || (needs.prepare.outputs.publish != 'true' && needs.sign.result == 'skipped'))
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        environment: ${{ needs.prepare.outputs.publish == 'true' && 'release' || 'build' }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.installers) }}
        env:
            DESTACK_SIGNING: ${{ needs.prepare.outputs.publish == 'true' && 'release' || 'development' }}
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Download the installer's distributions
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: ${{ needs.prepare.outputs.publish == 'true' && 'signed' || 'unsigned' }}-${{ matrix.targets }}
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Prepare Apple signing credentials
              if: needs.prepare.outputs.publish == 'true' && matrix.signer == 'apple'
              uses: ./.github/actions/setup-apple
              with:
                  certificate: ${{ secrets.APPLE_CERTIFICATE }}
                  password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  identity: ${{ vars.APPLE_SIGNING_IDENTITY }}
                  key: ${{ secrets.APPLE_NOTARY_KEY }}
                  key-id: ${{ vars.APPLE_NOTARY_KEY_ID }}
                  issuer: ${{ vars.APPLE_NOTARY_ISSUER }}
            - name: Build installer
              run: bun run src/main.ts installer build ${{ matrix.name }}
            - name: Upload installer
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: installer-${{ matrix.name }}
                  retention-days: 14
                  path: dist/${{ needs.prepare.outputs.version }}/destack-*-${{ matrix.name }}.${{ matrix.format }}
                  if-no-files-found: error
            - name: Remove Apple signing credentials
              if: always() && needs.prepare.outputs.publish == 'true' && matrix.signer == 'apple'
              run: bun run src/main.ts signing credential remove

    publish:
        name: Publish release
        needs: [prepare, sign, installers]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        environment: release
        permissions:
            contents: read
            id-token: write
            attestations: write
        concurrency:
            group: update-repository
            cancel-in-progress: false
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Download signed distributions
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: signed-*
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Download distributions without a platform signer
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: unsigned-${{ needs.prepare.outputs.unsigned }}
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Download installers
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: installer-*
                  merge-multiple: true
                  path: dist/${{ needs.prepare.outputs.version }}
            - name: Download signed toolchains
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: toolchain-signed-*
                  path: dist/${{ needs.prepare.outputs.version }}/toolchain
            - name: Download toolchains without a platform signer
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  pattern: toolchain-unsigned-${{ needs.prepare.outputs.unsigned }}
                  path: dist/${{ needs.prepare.outputs.version }}/toolchain
            - name: Unpack toolchains
              env:
                  TOOLCHAINS: ${{ github.workspace }}/dist/${{ needs.prepare.outputs.version }}/toolchain
              run: |
                  for directory in "$TOOLCHAINS"/*/; do
                      tar -xf "$directory/toolchain.tar" -C "$directory"
                      rm "$directory/toolchain.tar"
                  done
            - name: Attest build provenance of the archives and installers
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: dist/${{ needs.prepare.outputs.version }}/destack-*
            - name: Prepare update signing keys
              run: bun run src/main.ts github credential release
              env:
                  DESTACK_TARGETS_KEY: ${{ secrets.DESTACK_TARGETS_KEY }}
                  DESTACK_SNAPSHOT_KEY: ${{ secrets.DESTACK_SNAPSHOT_KEY }}
                  DESTACK_TIMESTAMP_KEY: ${{ secrets.DESTACK_TIMESTAMP_KEY }}
            - name: Sign targets, snapshot and timestamp
              run: bun run src/main.ts update sign ${{ needs.prepare.outputs.names }}
            - name: Upload release
              run: bun run src/main.ts update publish
              env:
                  CLOUDFLARE_RELEASE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_RELEASE_ACCESS_KEY_ID }}
                  CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY }}
            - name: Verify published metadata and archives
              run: bun run src/main.ts update verify
            - name: Remove update signing keys
              if: always()
              run: bun run src/main.ts github credential remove

    record:
        name: Record release
        needs: [prepare, publish]
        if: needs.prepare.outputs.publish == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Tag the release and publish its notes
              run: bun run src/main.ts release record

    deploy:
        name: Deploy production
        needs: [prepare, publish]
        # deploy once the operator bootstrapped the platform and set DESTACK_PLATFORM to deployed
        if: needs.prepare.outputs.publish == 'true' && vars.DESTACK_PLATFORM == 'deployed'
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        environment: production
        permissions:
            contents: read
            id-token: write
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        env:
            AWS_REGION: eu-central-1
            TF_IN_AUTOMATION: "true"
            CLOUDFLARE_COMPANY_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPANY_API_TOKEN }}
            GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
            GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
            MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
            DESTACK_OPERATOR: ${{ vars.DESTACK_OPERATOR }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Set up the sandbox the platform build compiles in
              uses: ./.github/actions/setup-sandbox
            - name: Restore the release store
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      target/releases/store.db*
                      target/releases/files
                  key: release-store-${{ needs.prepare.outputs.commit }}
                  fail-on-cache-miss: true
            - name: Assume deploy role
              uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
              with:
                  role-to-assume: arn:aws:iam::903685415634:role/destack-platform-deploy
                  role-session-name: deploy-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Deploy production
              run: bun run src/main.ts platform deploy production
            - name: Publish the platform's releases
              run: bun run src/main.ts platform publish production

    verify:
        name: Verify installation and updates (${{ matrix.target }})
        needs: [prepare, publish]
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 10
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.prepare.outputs.targets) }}
        env:
            DESTACK_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Install Linux desktop runtime dependencies
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-apt
              with:
                  packages: libwebkit2gtk-4.1-0
            - name: Install the published release through its install script, and verify restart and updates
              run: bun run src/main.ts distribution install-check

    renew:
        name: Renew release metadata
        needs: [prepare]
        if: needs.prepare.outputs.renew == 'true'
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: renewal
        permissions:
            contents: read
        concurrency:
            group: update-repository
            cancel-in-progress: false
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Prepare freshness signing keys
              run: bun run src/main.ts github credential renew
              env:
                  DESTACK_SNAPSHOT_KEY: ${{ secrets.DESTACK_SNAPSHOT_KEY }}
                  DESTACK_TIMESTAMP_KEY: ${{ secrets.DESTACK_TIMESTAMP_KEY }}
            - name: Sign snapshot and timestamp
              run: bun run src/main.ts update renew freshness
            - name: Publish signed freshness
              run: bun run src/main.ts update publish dist/refresh
              env:
                  CLOUDFLARE_RELEASE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_RELEASE_ACCESS_KEY_ID }}
                  CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_RELEASE_SECRET_ACCESS_KEY }}
            - name: Verify published metadata
              run: bun run src/main.ts update verify dist/refresh
            - name: Remove freshness signing keys
              if: always()
              run: bun run src/main.ts github credential remove

    expiry:
        name: Check release metadata expiry
        needs: [prepare, publish, renew]
        if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.published == 'true' || needs.publish.result == 'success') }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare.outputs.commit }}
            - name: Set up
              uses: ./.github/actions/setup
            - name: Check every role outlives its renewal window
              run: bun run src/main.ts update expiry
