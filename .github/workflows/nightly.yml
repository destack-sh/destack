name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-check:
    name: Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy

      - name: Check Hygiene
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just check-hygiene

      - name: Check Projects
        run: just check-projects

      - name: Check Release Drift
        run: just check-release-drift

  language-check:
    name: Language Check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Language Check Toolchain
        uses: ./.github/actions/setup-language-check
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Language
        run: just language/full

  library-check:
    name: Library Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Library
        run: just library/full

  service-check:
    name: Service Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Service
        run: just service/full

  app-check:
    name: App Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check App
        run: just app/full

  bridge-check:
    name: Bridge Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          rust_targets: wasm32-wasip2
          install_js_dependencies: "true"

      - name: Check Bridge
        run: just bridge/full --pin-destack-revision "${GITHUB_SHA}"

  language-fuzz:
    name: Language Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz Language
        run: just language/fuzz 120

  language-bench:
    name: Language Bench
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Bench Language
        run: just language/bench

  runtime-android-check:
    name: Runtime Check (Android)
    uses: ./.github/workflows/runtime-android-check.yml

  runtime-ios-check:
    name: Runtime Check (iOS)
    uses: ./.github/workflows/runtime-ios-check.yml

  runtime-linux-check:
    name: Runtime Check (Linux)
    uses: ./.github/workflows/runtime-linux-check.yml

  runtime-macos-check:
    name: Runtime Check (macOS)
    uses: ./.github/workflows/runtime-macos-check.yml

  runtime-windows-check:
    name: Runtime Check (Windows)
    uses: ./.github/workflows/runtime-windows-check.yml
