name: Nightly

on:
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly-metadata:
    name: Nightly Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      release_body: ${{ steps.metadata.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Resolve Nightly Metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(tr -d '[:space:]' < VERSION.txt)"
          short_sha="$(git rev-parse --short=12 "${GITHUB_SHA}")"
          nightly_date="$(date -u +%Y%m%d)"
          nightly_version="${base_version}-nightly.${nightly_date}+${short_sha}"
          nightly_tag="nightly"
          nightly_name="Nightly ${nightly_version}"
          nightly_body=$'Automated canary build from `main`.\n\n'
          nightly_body+="Version: \`${nightly_version}\`"$'\n'
          nightly_body+="Commit: \`${GITHUB_SHA}\`"$'\n'
          nightly_body+="Channel: \`nightly\`"$'\n'

          {
            echo "version=${nightly_version}"
            echo "tag=${nightly_tag}"
            echo "release_name=${nightly_name}"
            echo "release_body<<EOF"
            printf '%s\n' "${nightly_body}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  hygiene-check:
    name: Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy

      - name: Check Hygiene
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just check-hygiene

      - name: Check Projects
        run: just check-projects

      - name: Check Release Drift
        run: just check-release-drift

  language-check:
    name: Language Check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Language Check Toolchain
        uses: ./.github/actions/setup-language-check
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Language
        run: just language/full

  language-resolver-windows-check:
    name: Language Resolver Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun Node and just
        uses: ./.github/actions/setup-rust-bun-just

      - name: Check Package Managers
        shell: bash
        run: |
          corepack pnpm --version
          corepack yarn --version

      - name: Install Resolver Fixtures
        shell: bash
        run: just language/install-resolver

      - name: Check Language Resolver (Windows)
        shell: bash
        run: just language/test-resolver

  library-check:
    name: Library Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Library
        run: just library/full

  service-check:
    name: Service Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Service
        run: just service/full

  app-check:
    name: App Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check App
        run: just app/full

  bridge-check:
    name: Bridge Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          rust_targets: wasm32-wasip2
          install_js_dependencies: "true"

      - name: Check Bridge
        run: just bridge/full --pin-destack-revision "${GITHUB_SHA}"

  bridge-swift-build:
    name: Bridge Swift Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Build Bridge Swift
        run: cd bridge/swift && swift build

  language-fuzz:
    name: Language Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz Language
        run: just language/fuzz 120

  language-bench:
    name: Language Bench
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Bench Language
        run: just language/bench

  runtime-android-check:
    name: Runtime Check (Android)
    uses: ./.github/workflows/runtime-android-check.yml

  runtime-ios-check:
    name: Runtime Check (iOS)
    uses: ./.github/workflows/runtime-ios-check.yml

  runtime-linux-check:
    name: Runtime Check (Linux)
    uses: ./.github/workflows/runtime-linux-check.yml

  runtime-macos-check:
    name: Runtime Check (macOS)
    uses: ./.github/workflows/runtime-macos-check.yml

  runtime-windows-check:
    name: Runtime Check (Windows)
    uses: ./.github/workflows/runtime-windows-check.yml

  nightly-build:
    name: Nightly Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - nightly-metadata
      - language-check
      - language-resolver-windows-check
      - library-check
      - service-check
      - app-check
      - bridge-check
      - bridge-swift-build
      - runtime-android-check
      - runtime-ios-check
      - runtime-linux-check
      - runtime-macos-check
      - runtime-windows-check
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Build Language
        run: just language/build

      - name: Build CLI Schema
        run: just app/generate-schema

      - name: Upload Nightly Schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-schemas-${{ github.sha }}
          path: |
            workspace/generated/dsconfig.schema.json
            app/cli/generated/cli-report.schema.json
          if-no-files-found: error

  nightly-cli-build:
    name: Nightly CLI Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    needs:
      - nightly-metadata
      - language-check
      - language-resolver-windows-check
      - library-check
      - service-check
      - app-check
      - bridge-check
      - bridge-swift-build
      - runtime-android-check
      - runtime-ios-check
      - runtime-linux-check
      - runtime-macos-check
      - runtime-windows-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            linker: ""
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            linker: ""
          - runner: macos-14
            target: aarch64-apple-darwin
            linker: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            linker: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: ${{ matrix.target }}

      - name: Install Linux Cross Compiler
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        run: cargo build --release -p destack_cli --target "${{ matrix.target }}"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Stage Unix CLI Binaries
        if: runner.os != 'Windows'
        run: |
          mkdir -p "release-binaries/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/destack" "release-binaries/${{ matrix.target }}/destack"
          cp "target/${{ matrix.target }}/release/ds" "release-binaries/${{ matrix.target }}/ds"
          cp "target/${{ matrix.target }}/release/dsc" "release-binaries/${{ matrix.target }}/dsc"
          cp "target/${{ matrix.target }}/release/dsx" "release-binaries/${{ matrix.target }}/dsx"

      - name: Stage Windows CLI Binaries
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "release-binaries/${{ matrix.target }}" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/destack.exe" "release-binaries/${{ matrix.target }}/destack.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/ds.exe" "release-binaries/${{ matrix.target }}/ds.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/dsc.exe" "release-binaries/${{ matrix.target }}/dsc.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/dsx.exe" "release-binaries/${{ matrix.target }}/dsx.exe" -Force

      - name: Upload Nightly CLI Binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-cli-binaries-${{ matrix.target }}-${{ github.sha }}
          path: release-binaries/${{ matrix.target }}
          if-no-files-found: error

  nightly-cli-package:
    name: Nightly CLI Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - nightly-metadata
      - nightly-cli-build
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download Linux x64 CLI Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-binaries-x86_64-unknown-linux-gnu-${{ github.sha }}
          path: release-binaries/x86_64-unknown-linux-gnu

      - name: Download Linux arm64 CLI Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-binaries-aarch64-unknown-linux-gnu-${{ github.sha }}
          path: release-binaries/aarch64-unknown-linux-gnu

      - name: Download macOS x64 CLI Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-binaries-x86_64-apple-darwin-${{ github.sha }}
          path: release-binaries/x86_64-apple-darwin

      - name: Download macOS arm64 CLI Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-binaries-aarch64-apple-darwin-${{ github.sha }}
          path: release-binaries/aarch64-apple-darwin

      - name: Download Windows x64 CLI Binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-binaries-x86_64-pc-windows-msvc-${{ github.sha }}
          path: release-binaries/x86_64-pc-windows-msvc

      - name: Stage CLI Binaries
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          mkdir -p target/aarch64-unknown-linux-gnu/release
          mkdir -p target/x86_64-apple-darwin/release
          mkdir -p target/aarch64-apple-darwin/release
          mkdir -p target/x86_64-pc-windows-msvc/release

          cp release-binaries/x86_64-unknown-linux-gnu/* target/x86_64-unknown-linux-gnu/release/
          cp release-binaries/aarch64-unknown-linux-gnu/* target/aarch64-unknown-linux-gnu/release/
          cp release-binaries/x86_64-apple-darwin/* target/x86_64-apple-darwin/release/
          cp release-binaries/aarch64-apple-darwin/* target/aarch64-apple-darwin/release/
          cp release-binaries/x86_64-pc-windows-msvc/* target/x86_64-pc-windows-msvc/release/

      - name: Package Nightly CLI Assets
        run: bash app/cli/install/package-release-artifacts.sh "${{ needs.nightly-metadata.outputs.version }}" nightly-cli-assets
        env:
          DESTACK_RELEASE_TAG: ${{ needs.nightly-metadata.outputs.tag }}
          DESTACK_RELEASE_CHANNEL: nightly

      - name: Check Nightly CLI Assets
        run: bash app/cli/install/validate-release-artifacts.sh "${{ needs.nightly-metadata.outputs.version }}" nightly-cli-assets
        env:
          DESTACK_RELEASE_TAG: ${{ needs.nightly-metadata.outputs.tag }}
          DESTACK_RELEASE_CHANNEL: nightly

      - name: Check Nightly CLI Installer
        run: bash app/cli/install/test-install.sh "${{ needs.nightly-metadata.outputs.version }}" nightly-cli-assets
        env:
          DESTACK_RELEASE_TAG: ${{ needs.nightly-metadata.outputs.tag }}

      - name: Upload Nightly CLI Assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-cli-assets-${{ github.sha }}
          path: nightly-cli-assets/*
          if-no-files-found: error

  nightly-windows-installer-check:
    name: Nightly Windows Installer Check
    runs-on: windows-latest
    timeout-minutes: 30
    needs:
      - nightly-metadata
      - nightly-cli-package
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download Nightly CLI Assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-assets-${{ github.sha }}
          path: nightly-cli-assets

      - name: Check Nightly Windows Installer
        shell: powershell
        run: |
          $version = "${{ needs.nightly-metadata.outputs.version }}"
          $releaseTag = "${{ needs.nightly-metadata.outputs.tag }}"
          $tempRoot = Join-Path $env:RUNNER_TEMP "destack-install-smoke-$env:GITHUB_RUN_ID"
          $releaseDirectory = Join-Path $tempRoot "releases\download\$releaseTag"
          $installDirectory = Join-Path $tempRoot "install\bin"
          $port = Get-Random -Minimum 20000 -Maximum 60000
          $pythonCommand = $null
          $pythonArguments = @()

          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          Copy-Item "nightly-cli-assets/destack-$version-x86_64-pc-windows-msvc.zip" "$releaseDirectory/" -Force
          Copy-Item "nightly-cli-assets/SHA256SUMS" "$releaseDirectory/" -Force

          if ($null -ne (Get-Command "python" -ErrorAction SilentlyContinue)) {
            $pythonCommand = "python"
          } elseif ($null -ne (Get-Command "py" -ErrorAction SilentlyContinue)) {
            $pythonCommand = "py"
            $pythonArguments += "-3"
          } else {
            throw "missing python runtime on windows runner"
          }

          $pythonArguments += @("-m", "http.server", "$port", "--bind", "127.0.0.1", "--directory", "$tempRoot")

          $serverProcess = $null
          try {
            $serverProcess = Start-Process `
              -FilePath $pythonCommand `
              -ArgumentList $pythonArguments `
              -PassThru

            $healthUrl = "http://127.0.0.1:$port/releases/download/$releaseTag/SHA256SUMS"
            $attempt = 0
            while ($attempt -lt 10) {
              try {
                Invoke-WebRequest -Uri $healthUrl | Out-Null
                break
              } catch {
                Start-Sleep -Seconds 1
                $attempt += 1
              }
            }

            if ($attempt -ge 10) {
              throw "local installer smoke server did not start in time"
            }

            $env:DESTACK_VERSION = $version
            $env:DESTACK_RELEASE_BASE_URL = "http://127.0.0.1:$port/releases/download"
            $env:DESTACK_INSTALL = $installDirectory
            $env:DESTACK_NO_MODIFY_PATH = "1"
            .\app\cli\install\install.ps1

            & (Join-Path $installDirectory "destack.exe") --version | Out-Null
            & (Join-Path $installDirectory "ds.exe") --version | Out-Null
          } finally {
            if ($null -ne $serverProcess -and -not $serverProcess.HasExited) {
              Stop-Process -Id $serverProcess.Id -Force
            }
          }

  nightly-release-create:
    name: Nightly Release Create
    runs-on: ubuntu-latest
    needs:
      - nightly-metadata
      - nightly-build
      - nightly-cli-package
      - nightly-windows-installer-check
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Download Nightly Schemas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-schemas-${{ github.sha }}
          path: nightly-schemas

      - name: Download Nightly CLI Assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nightly-cli-assets-${{ github.sha }}
          path: nightly-cli-assets

      - name: Check Nightly Signing Configuration
        run: |
          if [ -z "${RELEASE_GPG_PRIVATE_KEY}" ]; then
            echo "missing RELEASE_GPG_PRIVATE_KEY secret"
            exit 1
          fi
          if [ -z "${RELEASE_GPG_PASSPHRASE}" ]; then
            echo "missing RELEASE_GPG_PASSPHRASE secret"
            exit 1
          fi
          if [ -z "${RELEASE_GPG_KEY_ID}" ]; then
            echo "missing RELEASE_GPG_KEY_ID variable"
            exit 1
          fi
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_KEY_ID: ${{ vars.RELEASE_GPG_KEY_ID }}

      - name: Install Nightly Signing Key
        run: |
          printf '%s\n' "${RELEASE_GPG_PRIVATE_KEY}" > release-signing.key.asc
          gpg --batch --import release-signing.key.asc
          rm -f release-signing.key.asc
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}

      - name: Sign Nightly Integrity Files
        run: |
          if [ ! -f "nightly-cli-assets/SHA256SUMS" ]; then
            echo "missing nightly-cli-assets/SHA256SUMS"
            exit 1
          fi
          if [ ! -f "nightly-cli-assets/manifest.json" ]; then
            echo "missing nightly-cli-assets/manifest.json"
            exit 1
          fi
          if [ ! -f "app/cli/install/install.sh" ]; then
            echo "missing app/cli/install/install.sh"
            exit 1
          fi
          if [ ! -f "app/cli/install/install.ps1" ]; then
            echo "missing app/cli/install/install.ps1"
            exit 1
          fi

          gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" --local-user "${RELEASE_GPG_KEY_ID}" --armor --detach-sign --output nightly-cli-assets/SHA256SUMS.asc nightly-cli-assets/SHA256SUMS
          gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" --local-user "${RELEASE_GPG_KEY_ID}" --armor --detach-sign --output nightly-cli-assets/manifest.json.asc nightly-cli-assets/manifest.json
          gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" --local-user "${RELEASE_GPG_KEY_ID}" --armor --detach-sign --output nightly-cli-assets/install.sh.asc app/cli/install/install.sh
          gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE}" --local-user "${RELEASE_GPG_KEY_ID}" --armor --detach-sign --output nightly-cli-assets/install.ps1.asc app/cli/install/install.ps1
        env:
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_GPG_KEY_ID: ${{ vars.RELEASE_GPG_KEY_ID }}

      - name: Update Nightly Tag
        run: |
          git tag -f "${NIGHTLY_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${NIGHTLY_TAG}" --force
        env:
          NIGHTLY_TAG: ${{ needs.nightly-metadata.outputs.tag }}

      - name: Create Nightly Prerelease
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ needs.nightly-metadata.outputs.tag }}
          name: ${{ needs.nightly-metadata.outputs.release_name }}
          body: ${{ needs.nightly-metadata.outputs.release_body }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: |
            nightly-schemas/*
            nightly-cli-assets/*
            app/cli/install/install.sh
            app/cli/install/install.ps1
            app/cli/install/release-signing-public.asc
