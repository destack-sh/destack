name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly-core:
    name: Nightly Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy

      - name: Run hygiene checks
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just check-hygiene

  nightly-integration:
    name: Nightly Integration
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs:
      - nightly-core
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: clippy
          install_js_dependencies: "true"

      - name: Cache conformance fixtures
        id: language-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/parser/conformance/test262
            language/test/fixtures/parser/conformance/babel
            language/test/fixtures/parser/conformance/swc
            language/test/fixtures/parser/conformance/biome
          key: ${{ runner.os }}-language-conformance-${{ hashFiles('language/test/fixtures/parser/conformance/*-fetch.sh') }}

      - name: Cache formatter conformance fixtures
        id: language-formatter-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/formatter/conformance/staging/prettier
            language/test/fixtures/formatter/conformance/staging/oxfmt
          key: ${{ runner.os }}-language-formatter-conformance-${{ hashFiles('language/test/fixtures/formatter/conformance/*-fetch.sh') }}

      - name: Run language full gate
        run: just language/full

      - name: Run library full gate
        run: just library/full

      - name: Run service full gate
        run: just service/full

      - name: Run app full gate
        run: just app/full

      - name: Run bridge full gate
        run: just bridge/full

  nightly-fuzz:
    name: Nightly Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - nightly-core
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run language fuzz suite
        run: just language/fuzz 120

  nightly-benchmark:
    name: Nightly Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs:
      - nightly-core
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just

      - name: Run language benchmark suite
        run: just language/benchmark

  runtime-android:
    name: Runtime Android
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-android.yml

  runtime-ios:
    name: Runtime iOS
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-ios.yml

  runtime-linux:
    name: Runtime Linux
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-linux.yml

  runtime-macos:
    name: Runtime macOS
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-macos.yml

  runtime-windows:
    name: Runtime Windows
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-windows.yml

  runtime-windows-gnu:
    name: Runtime Windows GNU
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-windows-gnu.yml

  runtime-wasip1:
    name: Runtime WASIp1
    needs:
      - nightly-core
    uses: ./.github/workflows/runtime-wasip1.yml
