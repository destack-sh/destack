name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-11-27
  BUN_VERSION: 1.2.18

jobs:
  repo-integrity:
    name: Repo Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Validate zed grammar pins
        run: python3 platform/zed/scripts/check_grammar_sources.py --require-pinned --pin-destack-revision "${GITHUB_SHA}"

  language-format:
    name: Language Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run language format check
        run: just language/ci-format

  language-lint:
    name: Language Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run language lint
        run: just language/ci-lint

  language-tests:
    name: Language Tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache conformance fixtures
        id: language-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/conformance/test262
            language/test/fixtures/conformance/babel
            language/test/fixtures/conformance/swc
            language/test/fixtures/conformance/biome
          key: ${{ runner.os }}-language-conformance-${{ hashFiles('language/test/fixtures/conformance/*-fetch.sh') }}

      - name: Install conformance fixtures
        if: steps.language-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-conformance

      - name: Cache formatter conformance fixtures
        id: language-formatter-conformance-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            language/test/fixtures/formatter/conformance/staging/prettier
            language/test/fixtures/formatter/conformance/staging/oxfmt
          key: ${{ runner.os }}-language-formatter-conformance-${{ hashFiles('language/test/fixtures/formatter/conformance/*-fetch.sh') }}

      - name: Install formatter conformance fixtures
        if: steps.language-formatter-conformance-cache.outputs.cache-hit != 'true'
        run: just language/install-formatter-conformance

      - name: Run language ci tests
        run: just language/test-ci

  runtime-android:
    name: Runtime Android
    needs:
      - repo-integrity
    uses: ./.github/workflows/runtime-android.yml
    with:
      rust_toolchain: ${{ env.RUST_TOOLCHAIN }}

  library-format:
    name: Library Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library format check
        run: just library/ci-format

  library-lint:
    name: Library Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library lint
        run: just library/ci-lint

  library-tests:
    name: Library Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library ci tests
        run: just library/test-ci

  platform-format:
    name: Platform Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run platform format check
        run: just platform/ci-format

      - name: Run client format check
        run: just client/ci-format

  platform-lint:
    name: Platform Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run platform lint
        run: just platform/ci-lint

      - name: Run client lint
        run: just client/ci-lint

  platform-tests:
    name: Platform Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - repo-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run platform ci tests
        run: just platform/test-ci

      - name: Run client ci tests
        run: just client/test-ci
