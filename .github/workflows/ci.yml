name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-check:
    name: Hygiene Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Check Hygiene
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just check-hygiene

  language-check:
    name: Language Check
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy

      - name: Check Language
        run: just language/check-quick

  language-runtime-linux-check:
    name: Language Runtime Check (Linux)
    uses: ./.github/workflows/language-runtime-linux-check.yml

  library-check:
    name: Library Check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Library
        run: just library/check-quick

  service-check:
    name: Service Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check Service
        run: just service/check-quick

  app-check:
    name: App Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          install_js_dependencies: "true"

      - name: Check App
        run: just app/check-quick

  bridge-check:
    name: Bridge Check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust Bun and just
        uses: ./.github/actions/setup-rust-bun-just
        with:
          rust_components: rustfmt clippy
          rust_targets: wasm32-wasip2
          install_js_dependencies: "true"

      - name: Check Bridge
        run: just bridge/check-quick --pin-destack-revision "${GITHUB_SHA}"
