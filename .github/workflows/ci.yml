name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-11-27
  BUN_VERSION: 1.2.18

jobs:
  language-format:
    name: Language Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Run language format check
        run: just language/format-check

  language-lint:
    name: Language Lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Run language lint
        run: just language/lint

  language-tests:
    name: Language Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Run parser crate tests
        run: cargo test --release -p destack_parser --lib

      - name: Run smoke tests
        run: just language/test-smoke

      - name: Run specification tests
        run: just language/test-specification

      - name: Run query tests
        run: just language/test-query

  library-format:
    name: Library Format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library format check
        run: just library/format-check

  library-lint:
    name: Library Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library lint
        run: just library/lint

  library-tests:
    name: Library Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run library tests
        run: just library/test

  platform-format:
    name: Platform Format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component rustfmt
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Run platform format check
        run: just platform/format-check

  platform-lint:
    name: Platform Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Run platform lint
        run: just platform/lint

  platform-tests:
    name: Platform Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal
          rustup default "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Run platform tests
        run: just platform/test
