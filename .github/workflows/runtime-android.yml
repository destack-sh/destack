name: Runtime Android

on:
  workflow_call:
    inputs:
      android_api_level:
        description: "Android API level"
        required: false
        default: "24"
        type: string
      android_ndk_version:
        description: "Android NDK version"
        required: false
        default: "27.2.12479018"
        type: string
      android_cmdline_tools_version:
        description: "Android commandline tools version"
        required: false
        default: "13114758"
        type: string

permissions:
  contents: read

jobs:
  runtime-android:
    name: Runtime Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_API_LEVEL: ${{ inputs.android_api_level }}
      ANDROID_NDK_VERSION: ${{ inputs.android_ndk_version }}
      ANDROID_CMDLINE_TOOLS_VERSION: ${{ inputs.android_cmdline_tools_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy
          rust_targets: aarch64-linux-android

      - name: Ensure Android host dependencies
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just runtime-android-host-deps

      - name: Restore Android sdk cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/android-sdk/cmdline-tools
            ${{ runner.temp }}/android-sdk/licenses
            ${{ runner.temp }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-sdk-${{ env.ANDROID_CMDLINE_TOOLS_VERSION }}-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Install Android NDK
        run: ./.github/scripts/install-android-ndk.sh
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

      - name: Run android runtime check
        run: just runtime-android-check
        env:
          ANDROID_API_LEVEL: ${{ env.ANDROID_API_LEVEL }}
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
