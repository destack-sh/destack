name: Release Runtime Smoke Windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-smoke-runtime-windows:
    name: Runtime Release Smoke (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: x86_64-pc-windows-msvc

      - name: Build runtime smoke release binary
        run: cargo build --release -p destack_runtime --bin runtime-smoke --target x86_64-pc-windows-msvc

      - name: Run runtime smoke release binary
        shell: powershell
        run: .\target\x86_64-pc-windows-msvc\release\runtime-smoke.exe
