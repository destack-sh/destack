name: Release Runtime Smoke Windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-runtime-release-windows:
    name: Runtime Release Smoke (windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: x86_64-pc-windows-msvc

      - name: Build and run runtime smoke release binary
        run: just language/smoke-runtime-release x86_64-pc-windows-msvc
