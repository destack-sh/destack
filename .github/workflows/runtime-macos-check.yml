name: Runtime Check (macOS)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-macos-check:
    name: Runtime Check (macOS)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy

      - name: Check Runtime (macOS)
        run: just language/check-runtime-macos

      - name: Show sccache Stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
