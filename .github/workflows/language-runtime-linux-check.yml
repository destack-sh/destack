name: Language Runtime Check (Linux)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  language-runtime-linux-check:
    name: Language Runtime Check (Linux, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy

      - name: Install Zig
        if: matrix.arch == 'x86_64'
        uses: ./.github/actions/setup-zig

      - name: Check Language Runtime (Linux)
        run: just language/check-runtime-linux

      - name: Check Language Runtime (Windows GNU)
        if: matrix.arch == 'x86_64'
        run: just language/check-runtime-windows-gnu

      - name: Check Language Runtime (Linux Wayland)
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just language/check-runtime-linux-wayland

      - name: Show sccache Stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
