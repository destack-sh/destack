name: Check

on:
    pull_request:
    push:
        branches: [main]
    workflow_call:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    repository:
        name: Check workflows and documents, list affected packages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            packages: ${{ steps.affected.outputs.packages }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  # the merge base with the target branch, or the pushed range, selects the affected packages
                  fetch-depth: 0
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Lint workflows
              run: actionlint
            - name: Check repository documents
              run: bun run destack-check check README.md AGENTS.md CONTRIBUTING.md SECURITY.md
            - name: List affected packages
              id: affected
              env:
                  EVENT: ${{ github.event_name }}
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  # gate the pull request's or the push's affected packages, and every package for a release
                  base=""
                  if [ "$EVENT" = pull_request ]; then
                      base="origin/$BASE_REF"
                  elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                      base="$BEFORE"
                  fi
                  packages="$(just affected "$base" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')"
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"
                  echo "$packages"

    gate:
        name: Gate ${{ matrix.package }}
        needs: [repository]
        if: needs.repository.outputs.packages != '[]'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            max-parallel: 16
            matrix:
                package: ${{ fromJSON(needs.repository.outputs.packages) }}
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports: ["55432:5432"]
                options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Install sandbox tools
              # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap socat ripgrep
                  sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
            - name: Run the gates
              env:
                  PACKAGE: ${{ matrix.package }}
                  DESTACK_TEST_POSTGRES: postgres://postgres@127.0.0.1:55432/postgres
              run: just gate "$PACKAGE"

    macos:
        name: Test updates on macOS
        runs-on: macos-15
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Set up Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Typecheck updates
              run: bun run --cwd @destack/update typecheck
            - name: Test updates
              run: bun --bun run --cwd @destack/update test --maxWorkers=4
