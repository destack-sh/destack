name: Check

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    repository:
        name: Check workflows and documents, list affected packages
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            packages: ${{ steps.affected.outputs.packages }}
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # the merge base with the target branch, or the pushed range, selects the affected packages
                  fetch-depth: 0
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Install actionlint
              env:
                  # the pinned release and its archive's SHA-256 from the release's checksums
                  VERSION: 1.7.12
                  SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
              run: |
                  archive="actionlint_${VERSION}_linux_amd64.tar.gz"
                  curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${archive}"
                  echo "${SHA256}  ${archive}" | sha256sum --check --strict
                  tar -xzf "${archive}" actionlint
                  sudo install actionlint /usr/local/bin/actionlint
            - name: Lint workflows
              run: actionlint
            - name: Check repository documents
              run: bun run destack-check check README.md AGENTS.md CONTRIBUTING.md SECURITY.md
            - name: List affected packages
              id: affected
              env:
                  EVENT: ${{ github.event_name }}
                  BASE_REF: ${{ github.base_ref }}
                  BEFORE: ${{ github.event.before }}
              run: |
                  # gate the pull request's or the push's affected packages, and every package for a release
                  base=""
                  if [ "$EVENT" = pull_request ]; then
                      base="origin/$BASE_REF"
                  elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
                      base="$BEFORE"
                  fi
                  packages="$(just affected "$base" | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')"
                  echo "packages=$packages" >> "$GITHUB_OUTPUT"
                  echo "$packages"

    gate:
        name: Gate ${{ matrix.package }}
        needs: [repository]
        if: needs.repository.outputs.packages != '[]'
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            max-parallel: 16
            matrix:
                package: ${{ fromJSON(needs.repository.outputs.packages) }}
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports: ["55432:5432"]
                options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up platform tools
              uses: ./.github/actions/setup-platform
            - name: Set up the sandbox
              uses: ./.github/actions/setup-sandbox
            - name: Install the gates' other system tools
              uses: ./.github/actions/setup-apt
              with:
                  packages: zsh age
            - name: Run the test PostgreSQL without durability
              env:
                  POSTGRES: ${{ job.services.postgres.id }}
              run: |
                  docker exec "$POSTGRES" psql -U postgres -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
            - name: Restore the test builds and templates
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  # the bounded, content-addressed parts: builds by digest, templates by their inputs
                  path: |
                      ~/.cache/destack/test/store.db*
                      ~/.cache/destack/test/files
                      ~/.cache/destack/test/layered
                      ~/.cache/destack/templates
                  key: destack-test-${{ runner.os }}-${{ github.sha }}
                  restore-keys: destack-test-${{ runner.os }}-
            - name: Run the gates
              env:
                  PACKAGE: ${{ matrix.package }}
                  DESTACK_TEST_POSTGRES: postgres://postgres@127.0.0.1:55432/postgres
              run: just gate "$PACKAGE"
            - name: Save the test builds and templates
              # save once per commit from the gate writing the most templates, which every gate restores
              if: matrix.package == '@destack/machine'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.cache/destack/test/store.db*
                      ~/.cache/destack/test/files
                      ~/.cache/destack/test/layered
                      ~/.cache/destack/templates
                  key: destack-test-${{ runner.os }}-${{ github.sha }}

    macos:
        name: Test updates on macOS
        runs-on: macos-15
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up
              uses: ./.github/actions/setup
            - name: Typecheck updates
              run: bun run --cwd @destack/update typecheck
            - name: Test updates
              run: bun --bun run --cwd @destack/update test --maxWorkers=4
