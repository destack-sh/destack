name: Runtime Windows GNU

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-windows-gnu:
    name: Runtime Windows GNU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy
          rust_targets: x86_64-pc-windows-gnu

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64

      - name: Run windows gnu runtime checks
        run: just runtime-windows-gnu-check
