name: Runtime Windows GNU

on:
  workflow_call:
    inputs:
      rust_toolchain:
        description: "Rust toolchain version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-windows-gnu:
    name: Runtime Windows GNU
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ inputs.rust_toolchain }}" --profile minimal --component clippy
          rustup default "${{ inputs.rust_toolchain }}"
          rustup target add x86_64-pc-windows-gnu
          rustc --version
          cargo --version

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2

      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run windows gnu runtime checks
        run: just check-runtime-windows-gnu
