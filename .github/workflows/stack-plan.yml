name: Plan stack

on:
    pull_request:
        paths: ["@platform/stack/**"]

permissions:
    contents: read

env:
    AWS_REGION: eu-central-1
    TF_IN_AUTOMATION: "true"

jobs:
    plan:
        name: Plan stack
        if: github.event.pull_request.head.repo.full_name == github.repository
        permissions:
            id-token: write
            contents: read
            pull-requests: write
        concurrency:
            group: stack-plan-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        environment: plan
        env:
            CLOUDFLARE_COMPANY_API_TOKEN: ${{ secrets.CLOUDFLARE_COMPANY_API_TOKEN }}
            PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
            PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
            TF_CLI_ARGS_plan: -no-color
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Set up platform tools
              uses: ./.github/actions/setup-platform

            - name: Install OpenTofu
              uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
              with:
                  tofu_version: 1.12.6

            - name: Assume plan role
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
              with:
                  role-to-assume: arn:aws:iam::903685415634:role/destack-plan
                  role-session-name: stack-plan-${{ github.run_id }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Select deployments
              id: select
              env:
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  selected=()
                  add() {
                      for deployment in "$@"; do
                          [[ " ${selected[*]} " == *" $deployment "* ]] || selected+=("$deployment")
                      done
                  }
                  while IFS= read -r file; do
                      case "${file#@platform/stack/}" in
                          src/shared/* | deployment/shared.tfvars) add shared ;;
                          src/universe/*.tf | src/universe/.terraform.lock.hcl) add production/universe ;;
                          src/residency/*) add production/eu production/us ;;
                          src/database/*) add production/universe production/eu production/us ;;
                          deployment/production/*.tfvars)
                              name="${file#@platform/stack/deployment/}"
                              add "${name%.tfvars}"
                              ;;
                          src/main.ts | src/command/* | src/cloudflare/* | src/deployment/* | src/placement/* | src/universe/residency.ts | package.json | justfile)
                              add shared production/universe production/eu production/us
                              ;;
                      esac
                  done < <(git diff --name-only "$BASE...$HEAD" -- "@platform/stack")
                  echo "deployments=${selected[*]}" >> "$GITHUB_OUTPUT"

            - name: Plan deployments
              working-directory: "@platform/stack"
              env:
                  DEPLOYMENTS: ${{ steps.select.outputs.deployments }}
              run: |
                  mkdir -p "$RUNNER_TEMP/plan"
                  status=0
                  for deployment in $DEPLOYMENTS; do
                      output="$RUNNER_TEMP/plan/${deployment//\//-}.txt"
                      # shellcheck disable=SC2086
                      if bun run src/main.ts diff ${deployment//\// } > "$output" 2>&1; then
                          echo "success" > "$output.status"
                      else
                          echo "failure" > "$output.status"
                          status=1
                      fi
                      cat "$output"
                  done
                  exit "$status"

            - name: Comment plans
              if: always() && steps.select.outcome == 'success'
              env:
                  GH_TOKEN: ${{ github.token }}
                  DEPLOYMENTS: ${{ steps.select.outputs.deployments }}
                  NUMBER: ${{ github.event.pull_request.number }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  marker="<!-- stack-deploy-plan -->"
                  body="$RUNNER_TEMP/comment.md"
                  {
                      echo "$marker"
                      echo "### Stack plan for $HEAD"
                      if [[ -z "$DEPLOYMENTS" ]]; then
                          echo
                          echo "This change touches no production deployment."
                      fi
                      for deployment in $DEPLOYMENTS; do
                          output="$RUNNER_TEMP/plan/${deployment//\//-}.txt"
                          status="$(cat "$output.status" 2>/dev/null || echo skipped)"
                          echo
                          echo "<details><summary><code>$deployment</code>: $status</summary>"
                          echo
                          echo '```'
                          if [[ -f "$output" ]]; then
                              tail -c 12000 "$output"
                          fi
                          echo '```'
                          echo "</details>"
                      done
                  } > "$body"
                  comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
                      --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
                  if [[ -n "$comment" ]]; then
                      gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F "body=@$body" > /dev/null
                  else
                      gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -F "body=@$body" > /dev/null
                  fi

