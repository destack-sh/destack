name: Release Runtime Smoke Windows GNU

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release-smoke-runtime-windows-gnu:
    name: Runtime Release Smoke (windows-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: x86_64-pc-windows-gnu

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64

      - name: Build and run runtime smoke release binary
        run: just runtime-windows-gnu-smoke --release
