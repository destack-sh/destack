name: Runtime Cross Targets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-cross-targets:
    name: Runtime Cross Targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-gnu

      - name: Setup Zig
        uses: ./.github/actions/setup-zig

      - name: Lint runtime toolchain scripts
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just runtime-toolchain-lint

      - name: Run runtime cross-target checks
        run: just runtime-cross-targets-check
