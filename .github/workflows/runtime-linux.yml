name: Runtime Linux

on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime-linux:
    name: Runtime Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Rust and just
        uses: ./.github/actions/setup-rust-just
        with:
          rust_components: clippy

      - name: Run linux runtime check
        run: just runtime-linux-check

      - name: Run linux wayland backend check
        run: DESTACK_AUTO_INSTALL_TOOLCHAINS=1 just runtime-linux-wayland-check
