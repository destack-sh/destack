name: Runtime WASIp1

on:
  workflow_call:
    inputs:
      rust_toolchain:
        description: "Rust toolchain version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-wasip1:
    name: Runtime WASIp1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "${{ inputs.rust_toolchain }}" --profile minimal
          rustup default "${{ inputs.rust_toolchain }}"
          rustup target add wasm32-wasip1
          rustc --version
          cargo --version

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Install just
        uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781

      - name: Run wasip1 runtime check
        run: just runtime-wasip1-check
