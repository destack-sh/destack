name: Check workspace

on:
    pull_request:
    push:
        branches: [main]
    workflow_call:
        inputs:
            dialects:
                description: Database dialects to test, as a JSON array
                type: string
                default: '["sqlite"]'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-check-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    typecheck:
        name: Typecheck workspace
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Install platform tools
              uses: ./.github/actions/setup-platform
            - name: Install OpenTofu
              uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
              with:
                  tofu_version: 1.12.6
            - name: Typecheck workspace
              run: just check

    lint:
        name: Lint and format workspace
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Install platform tools
              uses: ./.github/actions/setup-platform
            - name: Lint workspace
              run: just lint
            - name: Check workspace formatting
              run: just format-check

    test:
        name: Test workspace (${{ matrix.dialect }})
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                dialect: ${{ fromJSON(inputs.dialects || '["sqlite"]') }}
        services:
            postgres:
                # an empty image skips the container on runs without postgres
                image: ${{ matrix.dialect == 'postgres' && 'postgres:18' || '' }}
                env:
                    POSTGRES_HOST_AUTH_METHOD: trust
                ports: ["55432:5432"]
                options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
        env:
            DESTACK_TEST_POSTGRES: ${{ matrix.dialect == 'postgres' && 'postgres://postgres@127.0.0.1:55432/postgres' || '' }}
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Install platform tools
              uses: ./.github/actions/setup-platform
            - name: Install sandbox tools
              # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes bubblewrap socat ripgrep
                  sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
            - name: Test workspace
              run: just test
            - name: Test releases
              run: just @platform/release/test

    macos:
        name: Test filesystem and updates on macOS
        runs-on: macos-15
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
              with:
                  persist-credentials: false
            - name: Install Bun
              uses: ./.github/actions/setup-bun
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Check filesystem types
              run: bun run --cwd @destack/fs check
            - name: Test filesystem operations
              run: bun --bun run --cwd @destack/fs test
            - name: Check update types
              run: bun run --cwd @destack/update check
            - name: Test updates
              run: bun --bun run --cwd @destack/update test
