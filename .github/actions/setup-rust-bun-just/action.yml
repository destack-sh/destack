name: setup-rust-bun-just
description: install rust toolchain, restore rust cache, install just, and setup bun with node

inputs:
  rust_components:
    description: rust components to install as a space separated list
    required: false
    default: ""
  rust_targets:
    description: rust targets to install as a space separated list
    required: false
    default: ""
  install_js_dependencies:
    description: install js dependencies through bun
    required: false
    default: "false"

outputs:
  rust_toolchain:
    description: resolved rust toolchain version
    value: ${{ steps.rust.outputs.rust_toolchain }}
  bun_version:
    description: resolved bun version
    value: ${{ steps.versions.outputs.bun_version }}
  node_version:
    description: resolved node version
    value: ${{ steps.versions.outputs.node_version }}

runs:
  using: composite
  steps:
    - id: rust
      uses: ./.github/actions/setup-rust-just
      with:
        rust_components: ${{ inputs.rust_components }}
        rust_targets: ${{ inputs.rust_targets }}

    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../../../dev/toolchain/versions.sh"
        echo "bun_version=${DESTACK_BUN_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "node_version=${DESTACK_NODE_VERSION}" >> "${GITHUB_OUTPUT}"

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: ${{ steps.versions.outputs.node_version }}

    - uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3
      with:
        bun-version: ${{ steps.versions.outputs.bun_version }}

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ steps.versions.outputs.bun_version }}-${{ hashFiles('bun.lock', 'package.json', 'app/**/package.json', 'bridge/**/package.json', 'library/**/package.json', 'platform/**/package.json', 'template/**/package.json') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ steps.versions.outputs.bun_version }}-

    - shell: bash
      run: |
        set -euo pipefail
        corepack enable
        node --version
        npm --version
        corepack --version

    - if: inputs.install_js_dependencies == 'true'
      shell: bash
      run: |
        set -euo pipefail
        bun install --frozen-lockfile
