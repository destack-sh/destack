name: setup-zig
description: setup zig using the repository pinned version

outputs:
  zig_version:
    description: resolved zig version
    value: ${{ steps.versions.outputs.zig_version }}

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../../../toolchain/versions.sh"
        echo "zig_version=${DESTACK_ZIG_VERSION}" >> "${GITHUB_OUTPUT}"

    - uses: mlugg/setup-zig@53fc45b17fe98b52f92ee5ea08ff48a85a3e7eb7
      with:
        version: ${{ steps.versions.outputs.zig_version }}
