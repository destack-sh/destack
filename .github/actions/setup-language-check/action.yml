name: Setup Language Check
description: Install shared toolchains for language check lanes

inputs:
  rust_components:
    description: Space separated Rust components to install
    required: false
    default: rustfmt clippy
  install_js_dependencies:
    description: Whether to install repository JavaScript dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust Bun and just
      uses: ./.github/actions/setup-rust-bun-just
      with:
        rust_components: ${{ inputs.rust_components }}
        install_js_dependencies: ${{ inputs.install_js_dependencies }}
