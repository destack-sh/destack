name: Set up the sandbox
description: Install the tools the Linux sandbox runs, which builds and tests compile and run in.

runs:
    using: composite
    steps:
        - name: Install bubblewrap, socat and ripgrep
          uses: ./.github/actions/setup-apt
          with:
              packages: bubblewrap socat ripgrep
        - name: Allow unprivileged user namespaces
          shell: bash
          # bubblewrap needs unprivileged user namespaces, which Ubuntu 24.04 restricts through AppArmor
          run: sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
