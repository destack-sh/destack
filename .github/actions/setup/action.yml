name: Set up
description: Install the pinned Bun, the Node the oxlint rule tests need, and the workspace's dependencies.

runs:
    using: composite
    steps:
        - name: Read Bun version
          id: version
          shell: bash
          run: |
              version=$(jq -er '.packageManager | select(startswith("bun@")) | ltrimstr("bun@")' package.json)
              echo "bun=${version}" >> "${GITHUB_OUTPUT}"
        - name: Install Bun
          uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
          with:
              bun-version: ${{ steps.version.outputs.bun }}
        - name: Install Node
          uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
          with:
              node-version-file: package.json
        - name: Cache Bun dependencies
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.bun }}-${{ hashFiles('bun.lock') }}
        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
