name: setup-rust-just
description: install rust toolchain, restore rust cache, and install just

inputs:
  rust_components:
    description: rust components to install as a space separated list
    required: false
    default: ""
  rust_targets:
    description: rust targets to install as a space separated list
    required: false
    default: ""

outputs:
  rust_toolchain:
    description: resolved rust toolchain version
    value: ${{ steps.versions.outputs.rust_toolchain }}
  sccache_version:
    description: resolved sccache version
    value: ${{ steps.versions.outputs.sccache_version }}

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        set -euo pipefail
        source "${GITHUB_ACTION_PATH}/../../../dev/toolchain/versions.sh"
        echo "rust_toolchain=${DESTACK_RUST_TOOLCHAIN}" >> "${GITHUB_OUTPUT}"
        echo "sccache_version=${DESTACK_SCCACHE_VERSION}" >> "${GITHUB_OUTPUT}"

    - shell: bash
      run: |
        set -euo pipefail

        echo "RUSTC_WRAPPER=sccache" >> "${GITHUB_ENV}"
        echo "SCCACHE_DIR=${HOME}/.cache/sccache" >> "${GITHUB_ENV}"
        echo "SCCACHE_CACHE_SIZE=2G" >> "${GITHUB_ENV}"

        mkdir -p "${HOME}/.cache/sccache"

    - shell: bash
      run: |
        set -euo pipefail

        rust_components="${{ inputs.rust_components }}"
        rust_targets="${{ inputs.rust_targets }}"
        rust_component_args=()

        # collect optional rust components
        for rust_component in ${rust_components}; do
            rust_component_args+=(--component "${rust_component}")
        done

        rustup toolchain install "${{ steps.versions.outputs.rust_toolchain }}" --profile minimal "${rust_component_args[@]}"
        rustup default "${{ steps.versions.outputs.rust_toolchain }}"

        # add optional rust targets
        if [ -n "${rust_targets}" ]; then
            rustup target add ${rust_targets}
        fi

        rustc --version
        cargo --version

    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        add-job-id-key: false
        env-vars: RUSTC_WRAPPER SCCACHE_DIR SCCACHE_CACHE_SIZE
        cache-directories: |
          ~/.cache/sccache

    - uses: taiki-e/install-action@29932c26a55563997b9acacb544fc35fd54aa781
      with:
        tool: just sccache@${{ steps.versions.outputs.sccache_version }}

    - shell: bash
      run: |
        set -euo pipefail

        sccache --version
