[tool.black]
line-length = 100

[tool.django-stubs]
django_settings_module = "bench.settings"

[tool.mypy]
plugins = "mypy_django_plugin.main,mypy_drf_plugin.main"
follow_imports = "normal"
warn_redundant_casts = true
warn_unused_ignores = true
files = ["bench"]
exclude = ["^bench/migrations", "test_[a-z_]*\\.py"]

[[tool.mypy.overrides]]
module = "uvicorn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "gunicorn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fsspec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rest_framework_nested"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hub"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "PIL.Image"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_filters"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "django_filters.rest_framework"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cachetools"
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 8
ensure_newline_before_comments = true
known_first_party = "bench"
skip = "migrations"

[tool.pytest.ini_options]
addopts = "--ds=bench.settings"
# use below for distributed pytest
# addopts = "--ds=bench.settings -n=4 --dist=loadscope"