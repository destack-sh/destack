[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = [
	# pycodestyle
	"E",
	# Pyflakes
	"F",
	# pyupgrade
	"UP",
	# refurb
	"FURB",
	# flake8-bugbear
	"B",
	# flake8-simplify
	"SIM",
	# flake8-comprehensions
	"C4",
	# flake8-async
	"ASYNC",
	# flake8-datetimez,
	"DTZ",
	# flake8-pytest-style
	"PT",
	# flake8-print
	"T20",
	# isort
	"I",
	# pep8-naming
	"N",
	# ruff
	"RUF",
]
ignore = [
	# line too long
	"E501",
	# getattr/setattr with constant 
	"B009",
	"B010",
	# multiple asserts in one line
	"PT018",
	# exception too broad
	"PT011",
	# single if instead of nested ifs
	"SIM102",
	# non lowercase variable in function
	"N806",
]

[tool.pyright]
include = ["bench"]
exclude = ["^bench/migrations", "^venv|^venv-runtime", "test_[a-z_]*\\.py"]
ignore = ["^bench/migrations", "^venv|^venv-runtime", "test_[a-z_]*\\.py"]
venv = "venv"
strictDictionaryInference = true
strictListInference = true
strictTupleInference = true
strictSetInference = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
addopts = ["--color=yes", '-rP', '--strict-markers']
markers = [
	"slow: mark test as slow (>1s per run)",
	"hypothesis: mark test as using hypothesis",
]
