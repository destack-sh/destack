#
# Meta
#

[project]
name = "destack"
version = "2025.08.08.1"
description = "Universe simulation engine (i.e. insanely integrated full stack technology platform)"

[tool.uv]
workspace = { members = [
	"destack",
	"destack-py",
	"destack-py-system",
	"destack-py-server",
	"destack-py-web",
] }

#
# Ruff
#

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = [
	# pycodestyle
	"E",
	# Pyflakes
	"F",
	# pyupgrade
	"UP",
	# refurb
	"FURB",
	# flake8-bugbear
	"B",
	# flake8-simplify
	"SIM",
	# flake8-comprehensions
	"C4",
	# flake8-async
	"ASYNC",
	# flake8-datetimez,
	"DTZ",
	# flake8-pytest-style
	"PT",
	# flake8-print
	"T20",
	# isort
	"I",
	# pep8-naming
	"N",
	# ruff
	"RUF",
]
ignore = [
	# line too long
	"E501",
	# getattr/setattr with constant 
	"B009",
	"B010",
	# multiple asserts in one line
	"PT018",
	# exception too broad
	"PT011",
	# pytest.raises should contain a single statement
	"PT012",
	# single if instead of nested ifs
	"SIM102",
	# non lowercase variable in function
	"N806",
	# identical if/else branches
	"SIM114",
	# repeated list append
	"FURB113",
]

[tool.ruff.lint.isort]
known-first-party = ["destack"]

#
# Pyright
#

[tool.pyright]
include = ["destack", "destack-py", "destack-py-server", "destack-py-web"]
ignore = ["*/venv*"]
venv = "destack-py-server/venv"
extraPaths = ["destack", "destack-py", "destack-py-server", "destack-py-web"]
strictDictionaryInference = true
strictListInference = true
strictTupleInference = true
strictSetInference = true
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportUnknownLambdaType = false
reportUnusedVariable = false
reportUnusedFunction = false
reportUnusedImport = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryContains = false
reportUnnecessaryComparison = false
reportUnnecessaryCast = false
reportConstantRedefinition = false
reportIncompatibleVariableOverride = false
