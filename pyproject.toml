[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
# ignore line too long
ignore = ["E501"]

[tool.django-stubs]
django_settings_module = "bench.settings"

[tool.pyright]
include = ["bench"]
exclude = ["^bench/migrations", "^venv|^venv-worker", "test_[a-z_]*\\.py"]
ignore = ["^bench/migrations", "^venv|^venv-worker", "test_[a-z_]*\\.py"]
venv = "venv"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 8
ensure_newline_before_comments = true
known_first_party = "bench"
skip = "migrations"

[tool.pytest.ini_options]
addopts = "--ds=bench.settings"
# use below for distributed pytest
# addopts = "--ds=bench.settings -n=4 --dist=loadscope"