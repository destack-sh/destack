[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = [
	# pycodestyle
	"E",
	# Pyflakes
	"F",
	# pyupgrade
	"UP",
	# refurb
	"FURB",
	# flake8-bugbear
	"B",
	# flake8-simplify
	"SIM",
	# flake8-comprehensions
	"C4",
	# flake8-async
	"ASYNC",
	# flake8-datetimez,
	"DTZ",
	# flake8-pytest-style
	"PT",
	# flake8-print
	"T20",
	# isort
	"I",
	# pep8-naming
	"N",
	# ruff
	"RUF",
]
ignore = [
	# line too long
	"E501",
	# getattr/setattr with constant 
	"B009",
	"B010",
	# multiple asserts in one line
	"PT018",
	# exception too broad
	"PT011",
	# pytest.raises should contain a single statement
	"PT012",
	# single if instead of nested ifs
	"SIM102",
	# non lowercase variable in function
	"N806",
]

[tool.pyright]
include = ["bench"]
exclude = ["^bench/migrations", "^venv*"]
ignore = ["^bench/migrations", "^venv*"]
venv = "venv"
strictDictionaryInference = true
strictListInference = true
strictTupleInference = true
strictSetInference = true
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportUnknownLambdaType = false
reportUnusedVariable = false
reportUnusedFunction = false
reportUnusedImport = false
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryContains = false
reportUnnecessaryComparison = false
reportUnnecessaryCast = false
reportConstantRedefinition = false

[tool.coverage.run]
omit = ["bench/migrations/*", "bench/test/*"]

[tool.pytest_env]
ENVIRONMENT = "test"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = "test/**/*.py test/*.py"
python_classes = "!TestProfile"
log_cli = true
addopts = [
	'-rP',
	"-vv",
	"--import-mode=importlib",
	"--color=yes",
	'--strict-markers',
	'--hypothesis-show-statistics',
]
markers = [
	"hypothesis: test uses hypothesis",
	"model: test uses some ML model",
	"quick: quick to run (for simulations)",
	"careful: test is slow or resource intensive",
	"paranoid: test is very slow or resource intensive",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
