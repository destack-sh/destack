[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
# ignore line too long
ignore = ["E501"]

[tool.pyright]
include = ["bench"]
exclude = ["^bench/migrations", "^venv|^venv-runtime", "test_[a-z_]*\\.py"]
ignore = ["^bench/migrations", "^venv|^venv-runtime", "test_[a-z_]*\\.py"]
venv = "venv"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 8
ensure_newline_before_comments = true
known_first_party = "bench"
skip = "migrations"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--color=yes"]