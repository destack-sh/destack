[workspace]
resolver = "2"
members = [
	# language
	"language/ast",
	"language/codegen/cranelift",
	"language/codegen/lib",
	"language/codegen/js",
	"language/compiler",
	"language/dir",
	"language/fir",
	"language/formatter",
	"language/linter",
	"language/machine",
	"language/mir",
	"language/parser",
	"language/resolver",
	"language/source",
	"language/test",
	"language/unicode",
	"language/workspace",
	# library
	"library/napi",
	# platform
	"platform/cli",
	"platform/daemon",
	"platform/lsp",
	"platform/vscode",
]

[workspace.package]
version = "0.47.3"
edition = "2024"
authors = ["Symbol Industries"]
license = "Apache-2.0"
rust-version = "1.88.0"

[workspace.dependencies]
# language
destack_ast = { path = "language/ast" }
destack_codegen_cranelift = { path = "language/codegen/cranelift" }
destack_codegen_js = { path = "language/codegen/js" }
destack_codegen_lib = { path = "language/codegen/lib" }
destack_compiler = { path = "language/compiler" }
destack_dir = { path = "language/dir" }
destack_fir = { path = "language/fir" }
destack_formatter = { path = "language/formatter" }
destack_linter = { path = "language/linter" }
destack_machine = { path = "language/machine" }
destack_mir = { path = "language/mir" }
destack_parser = { path = "language/parser" }
destack_resolver = { path = "language/resolver" }
destack_source = { path = "language/source" }
destack_test = { path = "language/test" }
destack_unicode = { path = "language/unicode" }
destack_workspace = { path = "language/workspace" }

# library
destack_napi = { path = "library/napi" }

# platform
destack_cli = { path = "platform/cli" }
destack_daemon = { path = "platform/daemon" }
destack_lsp = { path = "platform/lsp" }
destack_vscode = { path = "platform/vscode" }

# general
cfg-if = "1.0.4"
crossbeam-deque = "0.8.6"
dashmap = "6.1.0"
indexmap = "2.12.0"
papaya = "0.2.3"
parking_lot = "0.12.5"
rayon = "1.11.0"
rustc-hash = "2.1.1"
rustix = "1.1.2"
serde = "1.0.228"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
simdutf8 = "0.1.5"
smallvec = "1.15.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.7"

# dev
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true
split-debuginfo = "unpacked"
panic = "abort"

[profile.bench]
opt-level = 2
codegen-units = 1
lto = "off"
debug-assertions = false
overflow-checks = false
split-debuginfo = "unpacked"
strip = "none"
debug = true

[profile.release]
opt-level = 2
codegen-units = 1
lto = "off"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
