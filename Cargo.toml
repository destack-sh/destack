[workspace]
resolver = "2"
members = [
	# language
	"language/ast",
	"language/compiler",
	"language/dir",
	"language/machine",
	"language/fir",
	"language/formatter",
	"language/javascript/ast",
	"language/javascript/transpiler",
	"language/javascript/machine",
	"language/mir",
	"language/parser",
	"language/source",
	"language/test",
	# extension
	"extension/cli",
	"extension/lsp",
	"extension/napi",
	"extension/vscode",
	# platform
	"platform/file",
	"platform/terminal",
	"platform/json",
	"platform/order",
	"platform/time",
	"platform/unicode",
	"platform/uuid",
]

[workspace.package]
version = "2025.11.5-0"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# language
dyst_ast = { path = "language/ast" }
dyst_compiler = { path = "language/compiler" }
dyst_dir = { path = "language/dir" }
dyst_fir = { path = "language/fir" }
dyst_formatter = { path = "language/formatter" }
dyst_javascript_ast = { path = "language/javascript/ast" }
dyst_javascript_transpiler = { path = "language/javascript/transpiler" }
dyst_javascript_machine = { path = "language/javascript/machine" }
dyst_machine = { path = "language/machine" }
dyst_mir = { path = "language/mir" }
dyst_parser = { path = "language/parser" }
dyst_workspace = { path = "language/workspace" }
dyst_source = { path = "language/source" }
dyst_test = { path = "language/test" }

# extension
destack_lsp = { path = "extension/lsp" }
destack_vscode = { path = "extension/vscode" }
destack_napi = { path = "extension/napi" }

# platform
destack_cli = { path = "extension/cli" }
destack_file = { path = "platform/file" }
destack_json = { path = "platform/json" }
destack_order = { path = "platform/order" }
destack_terminal = { path = "platform/terminal" }
destack_time = { path = "platform/time" }
destack_unicode = { path = "platform/unicode" }
destack_uuid = { path = "platform/uuid" }

# general
rayon = "1.11.0"

# build
wasm-bindgen = "0.2.100"

# dev
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true
split-debuginfo = "unpacked"
panic = "abort"

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
split-debuginfo = "unpacked"
strip = "none"
debug = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
