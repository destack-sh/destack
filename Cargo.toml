[workspace]
resolver = "2"
members = [
	# language
	"language/air",
	"language/arena",
	"language/ast",
	"language/cranelift",
	"language/diagnostic",
	"language/dir",
	"language/format",
	"language/llvm",
	"language/mir",
	"language/rust",
	"language/source",
	"language/token",
	"language/vm",
	# library
	"library/access",
	"library/animation",
	"library/audio",
	"library/cli",
	"library/cloud",
	"library/core",
	"library/file",
	"library/geometry",
	"library/image",
	"library/json",
	"library/locale",
	"library/network",
	"library/telemetry",
	"library/order",
	"library/perception",
	"library/physics",
	"library/prelude",
	"library/scene",
	"library/script",
	"library/social",
	"library/style",
	"library/time",
	"library/tokei",
	"library/unicode",
	"library/universe",
	"library/uuid",
	"library/video",
	"library/view",
	# extension
	"extension/lsp",
	"extension/zed",
	# platform
	"platform/web",
	# demo
	"demo/breakout",
	"demo/tetris",
	# test
	"test/demo",
	"test/simulation",
]

[workspace.package]
version = "2025.9.10-0"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# language
dyst_language_air = { path = "language/air" }
dyst_language_ast = { path = "language/ast" }
dyst_language_arena = { path = "language/arena" }
dyst_language_cranelift = { path = "language/cranelift" }
dyst_language_diagnostic = { path = "language/diagnostic" }
dyst_language_dir = { path = "language/dir" }
dyst_language_format = { path = "language/format" }
dyst_language_llvm = { path = "language/llvm" }
dyst_language_mir = { path = "language/mir" }
dyst_language_rust = { path = "language/rust" }
dyst_language_session = { path = "language/session" }
dyst_language_source = { path = "language/source" }
dyst_language_token = { path = "language/token" }
dyst_language_vm = { path = "language/vm" }
# TODO! :Architecture: re-sorganize / split Dyst & Destack (language, library, platform, ext, ...) 
# library
destack_library_access = { path = "library/access" }
destack_library_animation = { path = "library/animation" }
destack_library_audio = { path = "library/audio" }
destack_library_cli = { path = "library/cli" }
destack_library_cloud = { path = "library/cloud" }
destack_library_core = { path = "library/core" }
destack_library_file = { path = "library/file" }
destack_library_geometry = { path = "library/geometry" }
destack_library_image = { path = "library/image" }
destack_library_json = { path = "library/json" }
destack_library_locale = { path = "library/locale" }
destack_library_network = { path = "library/network" }
destack_library_telemetry = { path = "library/telemetry" }
destack_library_order = { path = "library/order" }
destack_library_perception = { path = "library/perception" }
destack_library_physics = { path = "library/physics" }
destack_library_prelude = { path = "library/prelude" }
destack_library_scene = { path = "library/scene" }
destack_library_script = { path = "library/script" }
destack_library_social = { path = "library/social" }
destack_library_style = { path = "library/style" }
destack_library_time = { path = "library/time" }
destack_library_tokei = { path = "library/tokei" }
destack_library_unicode = { path = "library/unicode" }
destack_library_universe = { path = "library/universe" }
destack_library_uuid = { path = "library/uuid" }
destack_library_video = { path = "library/video" }
destack_library_view = { path = "library/view" }
# extension
destack_extension_lsp = { path = "extension/lsp" }
# platform
destack_platform_web = { path = "platform/web" }
# ...
# demo
destack_demo_breakout = { path = "demo/breakout" }
destack_demo_tetris = { path = "demo/tetris" }
# test
destack_test_demo = { path = "test/demo" }
destack_test_simulation = { path = "test/simulation" }

# build dependencies
wasm-bindgen = "0.2.100"

# dev dependencies
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = "warn"
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "none"
debug = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
