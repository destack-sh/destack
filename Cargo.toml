[workspace]
resolver = "2"
members = [
	# language
	"language/air",
	"language/ast",
	"language/cranelift",
	"language/collections",
	"language/concurrency",
	"language/diagnostic",
	"language/dir",
	"language/fir",
	"language/llvm",
	"language/mir",
	"language/prelude",
	"language/source",
	"language/string",
	"language/token",
	"language/vm",
	# library
	"library/access",
	"library/animation",
	"library/audio",
	"library/cli",
	"library/cloud",
	"library/entity",
	"library/event",
	"library/file",
	"library/geometry",
	"library/image",
	"library/json",
	"library/locale",
	"library/network",
	"library/order",
	"library/perception",
	"library/physics",
	"library/scene",
	"library/script",
	"library/social",
	"library/style",
	"library/telemetry",
	"library/text",
	"library/time",
	"library/tokei",
	"library/unicode",
	"library/universe",
	"library/uuid",
	"library/video",
	"library/view",
	# extension
	"extension/lsp",
	"extension/python",
	"extension/rust",
	"extension/javascript",
	"extension/zed",
	# platform
	"platform/web",
	# demo
	"demo/breakout",
	"demo/tetris",
	# test
	"test/demo",
	"test/simulation",
]

[workspace.package]
version = "2025.9.26-4"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# language
dyst_air = { path = "language/air" }
dyst_ast = { path = "language/ast" }
dyst_cranelift = { path = "language/cranelift" }
dyst_collections = { path = "language/collections" }
dyst_concurrency = { path = "language/concurrency" }
dyst_diagnostic = { path = "language/diagnostic" }
dyst_dir = { path = "language/dir" }
dyst_fir = { path = "language/fir" }
dyst_llvm = { path = "language/llvm" }
dyst_mir = { path = "language/mir" }
dyst_memory = { path = "language/memory" }
dyst_session = { path = "language/session" }
dyst_source = { path = "language/source" }
dyst_token = { path = "language/token" }
dyst_vm = { path = "language/vm" }
dyst_prelude = { path = "language/prelude" }
# library
destack_access = { path = "library/access" }
destack_animation = { path = "library/animation" }
destack_audio = { path = "library/audio" }
destack_cli = { path = "library/cli" }
destack_cloud = { path = "library/cloud" }
destack_entity = { path = "library/entity" }
destack_event = { path = "library/event" }
destack_file = { path = "library/file" }
destack_geometry = { path = "library/geometry" }
destack_image = { path = "library/image" }
destack_json = { path = "library/json" }
destack_locale = { path = "library/locale" }
destack_network = { path = "library/network" }
destack_order = { path = "library/order" }
destack_perception = { path = "library/perception" }
destack_physics = { path = "library/physics" }
destack_scene = { path = "library/scene" }
destack_script = { path = "library/script" }
destack_social = { path = "library/social" }
destack_style = { path = "library/style" }
destack_text = { path = "library/text" }
destack_time = { path = "library/time" }
destack_tokei = { path = "library/tokei" }
destack_unicode = { path = "library/unicode" }
destack_universe = { path = "library/universe" }
destack_uuid = { path = "library/uuid" }
destack_video = { path = "library/video" }
destack_view = { path = "library/view" }
# extension
destack_javascript = { path = "extension/javascript" }
destack_python = { path = "extension/python" }
destack_rust = { path = "extension/rust" }
destack_telemetry = { path = "extension/telemetry" }
destack_lsp = { path = "extension/lsp" }
# platform
destack_platform_web = { path = "platform/web" }
# demo
destack_breakout = { path = "demo/breakout" }
destack_tetris = { path = "demo/tetris" }
# test
destack_demo = { path = "test/demo" }
destack_simulation = { path = "test/simulation" }

# build dependencies
wasm-bindgen = "0.2.100"

# dev dependencies
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = "warn"
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "none"
debug = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
