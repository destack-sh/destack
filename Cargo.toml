[workspace]
resolver = "2"
members = [
	# language
	"language/artifact",
	"language/artifact/macros",
	"language/compiler",
	"language/compiler/native",
	"language/compiler/native/cranelift/assembler-x64",
	"language/compiler/native/cranelift/bforest",
	"language/compiler/native/cranelift/bitset",
	"language/compiler/native/cranelift/codegen",
	"language/compiler/native/cranelift/control",
	"language/compiler/native/cranelift/entity",
	"language/compiler/native/cranelift/frontend",
	"language/compiler/native/cranelift/isle",
	"language/compiler/native/cranelift/module",
	"language/compiler/native/cranelift/native",
	"language/compiler/native/cranelift/object",
	"language/compiler/native/cranelift/reader",
	"language/compiler/native/cranelift/serde",
	"language/compiler/native/cranelift/srcgen",
	"language/compiler/native/pulley",
	"language/compiler/native/pulley/macros",
	"language/compiler/native/regalloc2",
	"language/compiler/native/wasmtime-core",
	"language/core",
	"language/dir",
	"language/engine",
	"language/fir",
	"language/formatter",
	"language/heap",
	"language/json",
	"language/js",
	"language/linter",
	"language/linter/macros",
	"language/memory",
	"language/native",
	"language/vm",
	"language/mir",
	"language/parser",
	"language/qir",
	"language/query",
	"language/runtime",
	"language/session",
	"language/lsp",
	"language/lsp/server",
	"language/lsp/types",
	"language/daemon",
	"language/source",
	"language/test",
	"language/unicode",
	"language/repository",
	"language/workspace",
	# app
	"app/cli",
	# bridge
	"bridge/capi",
	"bridge/generate",
	"bridge/language",
	"bridge/language/macros",
	"bridge/napi",
	"bridge/python/rust",
	"bridge/rust",
	"bridge/wasm",
	"bridge/zed",
]

[workspace.package]
version = "0.55.4"
edition = "2024"
authors = ["Symbol Industries"]
license = "MIT"
rust-version = "1.93.0"

[workspace.dependencies]
# language
destack_artifact = { path = "language/artifact" }
destack_artifact_macros = { path = "language/artifact/macros" }
destack_codegen_native = { path = "language/compiler/native" }
destack_compiler = { path = "language/compiler" }
destack_core = { path = "language/core" }
destack_dir = { path = "language/dir" }
destack_engine = { path = "language/engine" }
destack_fir = { path = "language/fir" }
destack_formatter = { path = "language/formatter" }
destack_heap = { path = "language/heap" }
destack_json = { path = "language/json" }
destack_js = { path = "language/js" }
destack_linter = { path = "language/linter" }
destack_linter_macros = { path = "language/linter/macros" }
destack_memory = { path = "language/memory" }
destack_native = { path = "language/native" }
destack_vm = { path = "language/vm" }
destack_mir = { path = "language/mir" }
destack_parser = { path = "language/parser" }
destack_qir = { path = "language/qir" }
destack_query = { path = "language/query" }
destack_runtime = { path = "language/runtime" }
destack_session = { path = "language/session" }
destack_source = { path = "language/source" }
destack_test = { path = "language/test" }
destack_unicode = { path = "language/unicode" }
destack_workspace = { path = "language/workspace" }
destack_repository = { path = "language/repository" }
destack_daemon = { path = "language/daemon" }
destack_lsp = { path = "language/lsp" }
destack_lsp_server = { path = "language/lsp/server" }
destack_lsp_types = { path = "language/lsp/types" }

# app
destack_cli = { path = "app/cli" }

# bridge
destack_bridge_generate = { path = "bridge/generate" }
destack_bridge_language = { path = "bridge/language", version = "=0.55.4" }
destack_bridge_language_macros = { path = "bridge/language/macros", version = "=0.55.4" }
destack_capi = { path = "bridge/capi" }
destack_napi = { path = "bridge/napi" }
destack_wasm = { path = "bridge/wasm" }
destack = { path = "bridge/rust" }
destack_python = { path = "bridge/python/rust" }
destack_zed = { path = "bridge/zed" }

# codegen
cranelift-assembler-x64 = { path = "language/compiler/native/cranelift/assembler-x64" }
cranelift-bforest = { path = "language/compiler/native/cranelift/bforest" }
cranelift-bitset = { path = "language/compiler/native/cranelift/bitset" }
cranelift-codegen = { path = "language/compiler/native/cranelift/codegen" }
cranelift-control = { path = "language/compiler/native/cranelift/control" }
cranelift-entity = { path = "language/compiler/native/cranelift/entity" }
cranelift-frontend = { path = "language/compiler/native/cranelift/frontend" }
cranelift-isle = { path = "language/compiler/native/cranelift/isle" }
cranelift-module = { path = "language/compiler/native/cranelift/module" }
cranelift-native = { path = "language/compiler/native/cranelift/native" }
cranelift-object = { path = "language/compiler/native/cranelift/object" }
cranelift-reader = { path = "language/compiler/native/cranelift/reader" }
cranelift-serde = { path = "language/compiler/native/cranelift/serde" }
cranelift-srcgen = { path = "language/compiler/native/cranelift/srcgen" }
regalloc2 = { path = "language/compiler/native/regalloc2" }
wasmtime-core = { path = "language/compiler/native/wasmtime-core", package = "wasmtime-internal-core" }
pulley-interpreter = { path = "language/compiler/native/pulley" }
pulley-macros = { path = "language/compiler/native/pulley/macros" }
target-lexicon = "0.13.4"

# cranelift external deps (from wasmtime workspace)
anyhow = "1.0.100"
bumpalo = "3"
capstone = "0.13.0"
env_logger = "0.11"
gimli = { version = "0.33.0", default-features = false }
hashbrown = { version = "0.17", default-features = false }
libc = "0.2"
libm = "0.2.16"
log = "0.4.28"
object = { version = "0.39.0", default-features = false, features = ["write"] }
proptest = "1.6.0"
serde_derive = "1.0.228"
similar = "2.1.0"
slice-group-by = "0.3.1"

# general
aho-corasick = "1.1"
argon2 = "0.5.3"
base64 = "0.22"
blake3 = "1.8.2"
bytes = "1.11.1"
bitflags = "2.11.0"
cfg-if = "1.0.4"
clap_complete = "4.6.0"
console = "0.16.3"
fancy-regex = "0.17.0"
fluent-uri = "0.4.1"
foreign-types-shared = "0.1.1"
futures = { version = "0.3.32", default-features = false }
getrandom = "0.4.0"
httparse = "1.10.1"
indicatif = "0.18.4"
keyring = { version = "3.6.3", default-features = false }
io-uring = "0.7.11"
core-foundation-sys = "0.8.7"
openssl = "0.10.76"
openssl-sys = "0.9.112"
num_cpus = "1.17.0"
percent-encoding = "2.3.2"
perf-event = "0.4.9"
regex = "1.12"
toml = "0.9.11"
regex-syntax = "0.8"
rustls = "0.23.37"
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
security-framework-sys = "2.17.0"
serde_repr = "0.1.20"
stacker = "0.1.22"
sha2 = { version = "0.10.9", default-features = false }
crossbeam-channel = "0.5.15"
crossbeam-deque = "0.8.6"
dashmap = "6.1.0"
filetime = "0.2.26"
fs2 = "0.4.3"
indexmap = "2.13.0"
interprocess = "2.2.1"
jiff = "0.2.23"
memchr = "2.7"
markdown = "1.0.0"
mime_guess = "2.0.5"
notify = "8.2.0"
proc-macro2 = "1.0"
prettyplease = "0.2.37"
papaya = "0.2.3"
parking_lot = "0.12.5"
pyo3 = "0.28.3"
pulldown-cmark = "0.13.1"
quote = "1.0"
rayon = "1.11.0"
rustc-hash = "2.1.1"
rustix = { version = "1.1.3", features = ["fs"] }
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
vobject = "0.8.0"
syn = { version = "2.0.117", features = ["full", "extra-traits"] }
postcard = { version = "1.1.3", features = ["alloc"] }
simdutf8 = "0.1.5"
smallvec = "1.15.1"
termcolor = "1.4.1"
tiktoken-rs = "0.9.1"
thiserror = "2.0"
tokio = "1.50.0"
tokio-util = "0.7.18"
tower = { version = "0.5.3", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
udev = "0.9.3"
url = "2.5.8"
pnp = "0.12.8"
wasm-bindgen = "0.2.114"
x11rb = "0.13.2"
wayland-client = "0.31.13"
wayland-protocols = { version = "0.32.11", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.11", features = ["client"] }
v4l2-sys-mit = "0.3.0"
objc2 = "0.6.4"
block2 = "0.6.2"
objc2-app-kit = "0.3.2"
objc2-av-foundation = "0.3.2"
objc2-core-bluetooth = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-contacts = "0.3.2"
objc2-core-location = "0.3.2"
objc2-event-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-uniform-type-identifiers = "0.3.2"
objc2-user-notifications = "0.3.2"
dispatch2 = "0.3.1"
notify-rust = "4.12.0"
zbus = { version = "5.14.0", default-features = false, features = ["blocking", "blocking-api"] }
windows = { version = "0.60.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows-core = "0.60.1"
windows-collections = "0.1.1"
windows-future = "0.1.1"
windows-sys = "0.52.0"
zeroize = "1.8.1"

# dev
arbtest = "0.3.2"
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
schemars = { version = "1.2", features = ["indexmap2"] }
static_assertions = "1.1.0"
criterion = { version = "0.8", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
collapsible_match = { level = "allow", priority = 1 }
expect_used = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }
type_complexity = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true
split-debuginfo = "unpacked"
panic = "abort"

[profile.bench]
opt-level = 2
codegen-units = 1
lto = "off"
debug-assertions = false
overflow-checks = false
split-debuginfo = "unpacked"
strip = "none"
debug = true

[profile.release]
opt-level = 2
codegen-units = 16
lto = "off"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
