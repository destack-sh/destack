[workspace]
resolver = "2"
members = [
	# destack_lang
	"destack_lang/ast",
	"destack_lang/bytecode",
	"destack_lang/dir",
	"destack_lang/lex",
	"destack_lang/mir",
	"destack_lang/parse",
	"destack_lang/vm",
	# destack_std
	"destack_std/access",
	"destack_std/animation",
	"destack_std/audio",
	"destack_std/cli",
	"destack_std/cloud",
	"destack_std/core",
	"destack_std/fs",
	"destack_std/geometry",
	"destack_std/image",
	"destack_std/json",
	"destack_std/localization",
	"destack_std/lsp",
	"destack_std/observability",
	"destack_std/order",
	"destack_std/perception",
	"destack_std/physics",
	"destack_std/scene",
	"destack_std/script",
	"destack_std/social",
	"destack_std/style",
	"destack_std/time",
	"destack_std/tokei",
	"destack_std/unicode",
	"destack_std/universe",
	"destack_std/uuid",
	"destack_std/video",
	"destack_std/view",
	"destack_std/web",
	# destack_bridge
	"destack_bridge/zed",
]

[workspace.package]
version = "2025.8.21-6"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# destack_lang
destack_lang_ast = { path = "destack_lang/ast" }
destack_lang_bytecode = { path = "destack_lang/bytecode" }
destack_lang_dir = { path = "destack_lang/dir" }
destack_lang_lex = { path = "destack_lang/lex" }
destack_lang_mir = { path = "destack_lang/mir" }
destack_lang_parse = { path = "destack_lang/parse" }
destack_lang_vm = { path = "destack_lang/vm" }
# destack_std
destack_std_access = { path = "destack_std/access" }
destack_std_animation = { path = "destack_std/animation" }
destack_std_audio = { path = "destack_std/audio" }
destack_std_cli = { path = "destack_std/cli" }
destack_std_cloud = { path = "destack_std/cloud" }
destack_std_core = { path = "destack_std/core" }
destack_std_fs = { path = "destack_std/fs" }
destack_std_geometry = { path = "destack_std/geometry" }
destack_std_image = { path = "destack_std/image" }
destack_std_json = { path = "destack_std/json" }
destack_std_localization = { path = "destack_std/localization" }
destack_std_lsp = { path = "destack_std/lsp" }
destack_std_observability = { path = "destack_std/observability" }
destack_std_order = { path = "destack_std/order" }
destack_std_perception = { path = "destack_std/perception" }
destack_std_physics = { path = "destack_std/physics" }
destack_std_scene = { path = "destack_std/scene" }
destack_std_script = { path = "destack_std/script" }
destack_std_social = { path = "destack_std/social" }
destack_std_style = { path = "destack_std/style" }
destack_std_time = { path = "destack_std/time" }
destack_std_tokei = { path = "destack_std/tokei" }
destack_std_unicode = { path = "destack_std/unicode" }
destack_std_universe = { path = "destack_std/universe" }
destack_std_uuid = { path = "destack_std/uuid" }	
destack_std_video = { path = "destack_std/video" }
destack_std_view = { path = "destack_std/view" }
destack_std_web = { path = "destack_std/web" }

# build dependencies
wasm-bindgen = "0.2.100"

# dev dependencies
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = "warn"
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
lto = "fat"
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "none"
debug = true
panic = "abort"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
