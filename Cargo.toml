[workspace]
resolver = "2"
members = [
	# lang
	"lang/codegen_rust",
	"lang/dir",
	"lang/lex",
	"lang/mir",
	"lang/parse",
	"lang/preload",
	"lang/vm",
	# std
	"std/access",
	"std/animation",
	"std/audio",
	"std/cli",
	"std/cloud",
	"std/core",
	"std/fs",
	"std/geometry",
	"std/image",
	"std/json",
	"std/localization",
	"std/lsp",
	"std/observability",
	"std/order",
	"std/perception",
	"std/physics",
	"std/scene",
	"std/script",
	"std/social",
	"std/style",
	"std/time",
	"std/tokei",
	"std/unicode",
	"std/universe",
	"std/uuid",
	"std/video",
	"std/view",
	"std/web",
	# ext
	"ext/zed",
	# demo
	"demo/breakout",
	"demo/tetris",
	# test
	"test/demo",
	"test/simulation",
]

[workspace.package]
version = "2025.8.22-1"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# lang
destack_lang_dir = { path = "lang/dir" }
destack_lang_lex = { path = "lang/lex" }
destack_lang_mir = { path = "lang/mir" }
destack_lang_parse = { path = "lang/parse" }
destack_lang_preload = { path = "lang/preload" }
destack_lang_vm = { path = "lang/vm" }
# std
destack_std_access = { path = "std/access" }
destack_std_animation = { path = "std/animation" }
destack_std_audio = { path = "std/audio" }
destack_std_cli = { path = "std/cli" }
destack_std_cloud = { path = "std/cloud" }
destack_std_core = { path = "std/core" }
destack_std_fs = { path = "std/fs" }
destack_std_geometry = { path = "std/geometry" }
destack_std_image = { path = "std/image" }
destack_std_json = { path = "std/json" }
destack_std_localization = { path = "std/localization" }
destack_std_lsp = { path = "std/lsp" }
destack_std_observability = { path = "std/observability" }
destack_std_order = { path = "std/order" }
destack_std_perception = { path = "std/perception" }
destack_std_physics = { path = "std/physics" }
destack_std_scene = { path = "std/scene" }
destack_std_script = { path = "std/script" }
destack_std_social = { path = "std/social" }
destack_std_style = { path = "std/style" }
destack_std_time = { path = "std/time" }
destack_std_tokei = { path = "std/tokei" }
destack_std_unicode = { path = "std/unicode" }
destack_std_universe = { path = "std/universe" }
destack_std_uuid = { path = "std/uuid" }
destack_std_video = { path = "std/video" }
destack_std_view = { path = "std/view" }
destack_std_web = { path = "std/web" }
# demo
destack_demo_breakout = { path = "demo/breakout" }
destack_demo_tetris = { path = "demo/tetris" }
# test
destack_test_demo = { path = "test/demo" }
destack_test_simulation = { path = "test/simulation" }

# build dependencies
wasm-bindgen = "0.2.100"

# dev dependencies
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = "warn"
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
lto = "thin"
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "none"
debug = true

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
