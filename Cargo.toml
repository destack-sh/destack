[workspace]
resolver = "2"
members = [
	# language
	"language/ast",
	"language/container",
	"language/compiler",
	"language/concurrency",
	"language/diagnostic",
	"language/dir",
	"language/fir",
	"language/formatter",
	"language/machine",
	"language/mir",
	"language/parser",
	"language/package",
	"language/prelude",
	"language/source",
	"language/string",
	# library
	"library/access",
	"library/animation",
	"library/audio",
	"library/cloud",
	"library/entity",
	"library/event",
	"library/file",
	"library/geometry",
	"library/image",
	"library/json",
	"library/locale",
	"library/network",
	"library/order",
	"library/perception",
	"library/physics",
	"library/scene",
	"library/script",
	"library/social",
	"library/style",
	"library/telemetry",
	"library/terminal",
	"library/test",
	"library/text",
	"library/time",
	"library/unicode",
	"library/universe",
	"library/uuid",
	"library/video",
	"library/view",
	# extension
	"extension/cli",
	"extension/lsp",
	"extension/python",
	"extension/rust",
	"extension/javascript",
	"extension/tokei",
	"extension/web",
	"extension/vscode",
	"extension/zed",
]

[workspace.package]
version = "2025.10.16-3"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
# language
dyst_ast = { path = "language/ast" }
dyst_compiler = { path = "language/compiler" }
dyst_concurrency = { path = "language/concurrency" }
dyst_container = { path = "language/container" }
dyst_diagnostic = { path = "language/diagnostic" }
dyst_dir = { path = "language/dir" }
dyst_fir = { path = "language/fir" }
dyst_formatter = { path = "language/formatter" }
dyst_memory = { path = "language/memory" }
dyst_machine = { path = "language/machine" }
dyst_mir = { path = "language/mir" }
dyst_parser = { path = "language/parser" }
dyst_package = { path = "language/package" }
dyst_prelude = { path = "language/prelude" }
dyst_session = { path = "language/session" }
dyst_source = { path = "language/source" }
dyst_string = { path = "language/string" }
# library
destack_access = { path = "library/access" }
destack_animation = { path = "library/animation" }
destack_audio = { path = "library/audio" }
destack_cloud = { path = "library/cloud" }
destack_disk = { path = "library/disk" }
destack_entity = { path = "library/entity" }
destack_event = { path = "library/event" }
destack_file = { path = "library/file" }
destack_geometry = { path = "library/geometry" }
destack_image = { path = "library/image" }
destack_json = { path = "library/json" }
destack_locale = { path = "library/locale" }
destack_network = { path = "library/network" }
destack_order = { path = "library/order" }
destack_perception = { path = "library/perception" }
destack_physics = { path = "library/physics" }
destack_scene = { path = "library/scene" }
destack_script = { path = "library/script" }
destack_social = { path = "library/social" }
destack_style = { path = "library/style" }
destack_text = { path = "library/text" }
destack_telemetry = { path = "library/telemetry" }
destack_terminal = { path = "library/terminal" }
destack_test = { path = "library/test" }
destack_time = { path = "library/time" }
destack_unicode = { path = "library/unicode" }
destack_universe = { path = "library/universe" }
destack_uuid = { path = "library/uuid" }
destack_video = { path = "library/video" }
destack_view = { path = "library/view" }
# extension
destack_cli = { path = "extension/cli" }
destack_javascript = { path = "extension/javascript" }
destack_lsp = { path = "extension/lsp" }
destack_python = { path = "extension/python" }
destack_tokei = { path = "extension/tokei" }
destack_rust = { path = "extension/rust" }
destack_web = { path = "extension/web" }
destack_vscode = { path = "extension/vscode" }
destack_zed = { path = "extension/zed" }

# build dependencies
wasm-bindgen = "0.2.100"

# dev dependencies
arbitrary = { version = "1.4.2", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
expect_used = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "none"
debug = true

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
