[workspace]
resolver = "2"
members = [
	"destack-rs/destack",
	"destack-rs/destack_fractional",
	"destack-rs/destack_time",
	"destack-rs-system/destack_system",
	"destack-rs-test/destack_test",
]

[workspace.package]
version = "2025.8.11-1"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
destack = { path = "destack-rs/destack" }
destack_fractional = { path = "destack-rs/destack_fractional" }
destack_time = { path = "destack-rs/destack_time" }
destack_system = { path = "destack-rs-system/destack_system" }

# dependencies
bytes = "1.10.1"
mio = "1.0.4"
once_cell = "1.21.3"
regex = "1.11.1"
smallvec = "1.15.1"
sysinfo = "0.36.1"
tokio = "1.47.1"
uuid = { version = "1.17.0", features = ["v5", "v7"] }
wasm-bindgen = "0.2.100"

# dev-dependencies
criterion = "0.7.0"
loom = "0.7.2"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
static_assertions = "1.1.0"
wasm-bindgen-test = "0.3.50"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = "warn"
perf = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 1
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "none"
debug = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
