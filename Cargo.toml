[workspace]
resolver = "2"
members = [
	# language
	"language/base",
	"language/ast",
	"language/builtin",
	"language/test/mirbench",
	"language/codegen/native",
	"language/codegen/native/cranelift/assembler-x64",
	"language/codegen/native/cranelift/bforest",
	"language/codegen/native/cranelift/bitset",
	"language/codegen/native/cranelift/codegen",
	"language/codegen/native/cranelift/control",
	"language/codegen/native/cranelift/entity",
	"language/codegen/native/cranelift/frontend",
	"language/codegen/native/cranelift/isle",
	"language/codegen/native/cranelift/module",
	"language/codegen/native/cranelift/native",
	"language/codegen/native/cranelift/object",
	"language/codegen/native/cranelift/reader",
	"language/codegen/native/cranelift/serde",
	"language/codegen/native/cranelift/srcgen",
	"language/codegen/native/regalloc2",
	"language/codegen/native/wasmtime-math",
	"language/codegen/lib",
	"language/codegen/js",
	"language/compiler",
	"language/compiler/macros",
	"language/dir",
	"language/fir",
	"language/formatter",
	"language/heap",
	"language/json",
	"language/linter",
	"language/linter/macros",
	"language/vm",
	"language/vm/abi",
	"language/mir",
	"language/parser",
	"language/resolver",
	"language/runtime",
	"language/source",
	"language/test",
	"language/unicode",
	"language/workspace",
	# library
	"library/napi",
	# platform
	"platform/cli",
	"platform/daemon",
	"platform/test",
	"platform/lsp",
	"platform/lsp/server",
	"platform/lsp/types",
	"platform/vscode",
	"platform/zed",
]

[workspace.package]
version = "0.53.0"
edition = "2024"
authors = ["Symbol Industries"]
license = "MIT"
rust-version = "1.88.0"

[workspace.dependencies]
# language
destack_base = { path = "language/base" }
destack_ast = { path = "language/ast" }
destack_test_mirbench = { path = "language/test/mirbench" }
destack_builtin = { path = "language/builtin" }
destack_codegen_native = { path = "language/codegen/native" }
destack_codegen_js = { path = "language/codegen/js" }
destack_codegen_lib = { path = "language/codegen/lib" }
destack_compiler = { path = "language/compiler" }
destack_compiler_macros = { path = "language/compiler/macros" }
destack_dir = { path = "language/dir" }
destack_fir = { path = "language/fir" }
destack_formatter = { path = "language/formatter" }
destack_heap = { path = "language/heap" }
destack_json = { path = "language/json" }
destack_linter = { path = "language/linter" }
destack_linter_macros = { path = "language/linter/macros" }
destack_vm = { path = "language/vm" }
destack_vm_abi = { path = "language/vm/abi" }
destack_mir = { path = "language/mir" }
destack_parser = { path = "language/parser" }
destack_resolver = { path = "language/resolver" }
destack_runtime = { path = "language/runtime" }
destack_source = { path = "language/source" }
destack_test = { path = "language/test" }
destack_unicode = { path = "language/unicode" }
destack_workspace = { path = "language/workspace" }

# library
destack_napi = { path = "library/napi" }

# platform
destack_cli = { path = "platform/cli" }
destack_daemon = { path = "platform/daemon" }
destack_lsp = { path = "platform/lsp" }
destack_lsp_server = { path = "platform/lsp/server" }
destack_lsp_types = { path = "platform/lsp/types" }
destack_vscode = { path = "platform/vscode" }
destack_zed = { path = "platform/zed" }

# codegen
cranelift-assembler-x64 = { path = "language/codegen/native/cranelift/assembler-x64" }
cranelift-bforest = { path = "language/codegen/native/cranelift/bforest" }
cranelift-bitset = { path = "language/codegen/native/cranelift/bitset" }
cranelift-codegen = { path = "language/codegen/native/cranelift/codegen" }
cranelift-control = { path = "language/codegen/native/cranelift/control" }
cranelift-entity = { path = "language/codegen/native/cranelift/entity" }
cranelift-frontend = { path = "language/codegen/native/cranelift/frontend" }
cranelift-isle = { path = "language/codegen/native/cranelift/isle" }
cranelift-module = { path = "language/codegen/native/cranelift/module" }
cranelift-native = { path = "language/codegen/native/cranelift/native" }
cranelift-object = { path = "language/codegen/native/cranelift/object" }
cranelift-reader = { path = "language/codegen/native/cranelift/reader" }
cranelift-serde = { path = "language/codegen/native/cranelift/serde" }
cranelift-srcgen = { path = "language/codegen/native/cranelift/srcgen" }
regalloc2 = { path = "language/codegen/native/regalloc2" }
wasmtime-math = { path = "language/codegen/native/wasmtime-math" }
target-lexicon = "0.13.4"

# cranelift external deps (from wasmtime workspace)
anyhow = "1.0.100"
bumpalo = "3"
capstone = "0.13.0"
env_logger = "0.11"
gimli = { version = "0.32.3", default-features = false }
hashbrown = { version = "0.15", default-features = false }
libc = "0.2"
libm = "0.2.15"
log = "0.4.28"
object = { version = "0.37", default-features = false, features = ["write"] }
proptest = "1.6.0"
serde_derive = "1.0.228"
similar = "2.1.0"
slice-group-by = "0.3.1"

# general
aho-corasick = "1.1"
base64 = "0.22"
cfg-if = "1.0.4"
regex = "1.12"
toml = "0.9.11"
regex-syntax = "0.8"
stacker = "0.1.22"
crossbeam-channel = "0.5.15"
crossbeam-deque = "0.8.6"
dashmap = "6.1.0"
filetime = "0.2.26"
fs2 = "0.4.3"
indexmap = "2.13.0"
interprocess = "2.2.1"
memchr = "2.7"
notify = "8.2.0"
papaya = "0.2.3"
parking_lot = "0.12.5"
rayon = "1.11.0"
rustc-hash = "2.1.1"
rustix = { version = "1.1.3", features = ["fs"] }
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
postcard = { version = "1.1.3", features = ["alloc"] }
simdutf8 = "0.1.5"
smallvec = "1.15.1"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
windows = { version = "0.60.0", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# dev
arbtest = "0.3.2"
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
libfuzzer-sys = "0.4.10"
pretty_assertions = "1.4.1"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
schemars = { version = "1.2", features = ["indexmap2"] }
static_assertions = "1.1.0"
criterion = { version = "0.8", features = ["html_reports"] }
pprof = { version = "0.15", features = ["flamegraph"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
ambiguous_glob_reexports = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
perf = "warn"
uninlined_format_args = "warn"
collapsible_match = { level = "allow", priority = 1 }
expect_used = { level = "allow", priority = 1 }
manual_range_contains = { level = "allow", priority = 1 }
module_inception = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[profile.dev]
opt-level = 0
debug = "full"
debug-assertions = true
overflow-checks = true
incremental = true
split-debuginfo = "unpacked"
panic = "abort"

[profile.bench]
opt-level = 2
codegen-units = 1
lto = "off"
debug-assertions = false
overflow-checks = false
split-debuginfo = "unpacked"
strip = "none"
debug = true

[profile.release]
opt-level = 2
codegen-units = 16
lto = "off"
debug-assertions = false
overflow-checks = false
strip = "symbols"
debug = false
panic = "abort"
