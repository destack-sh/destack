[workspace]
resolver = "2"
members = ["destack-rs/destack", "destack-rs-system/destack_system"]

[workspace.package]
version = "2025.8.8-1"
edition = "2024"
authors = ["Symbol Industries"]
license = "proprietary"
rust-version = "1.88.0"

[workspace.dependencies]
destack = { path = "destack-rs/destack" }
# dependencies
bytes = "1.10.1"
clap = "4.5.43"
tokio = "1.47.1"
thiserror = "2.0.12"
smallvec = "1.15.1"
regex = "1.11.1"
uuid = { version = "1.17.0", features = ["v4", "v5", "v7"] }
mio = "1.0.4"
# dev-dependencies
pretty_assertions = "1.4.1"
tempfile = "3.20.0"
wasm-bindgen-test = "0.3.50"
rstest = "0.26.1"
quickcheck = "1.0.3"
loom = "0.7.2"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = "warn"
perf="warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
expect_used = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"