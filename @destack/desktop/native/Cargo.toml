[package]
name = "destack_desktop"
version = "2026.11.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[lints.clippy]
# domain modules expose their primary noun through mod.rs
module_inception = "allow"

[[bin]]
name = "Destack"
path = "src/main.rs"

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-global-shortcut = "=2.4.0"
tauri-plugin-opener = "=2.6.0"
tauri-plugin-single-instance = "=2.5.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = "1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "=2.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSBundle",
    "NSError",
    "NSSet",
    "NSString",
] }
objc2-user-notifications = { version = "0.3", features = [
    "block2",
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }
