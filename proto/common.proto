syntax = "proto3";

package symbolx.bench;

import "proto/lang.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

enum ServiceKind {
  UNSPECIFIED = 0;
  INTERNAL = 1;
  PUBLIC = 2;
}

extend google.protobuf.ServiceOptions {
  ServiceKind kind = 50000;
}

extend google.protobuf.FieldOptions {
  // Field should never be printed in logs.
  optional bool sensitive = 50000;
}

message ClientOrigin {
  ClientType type = 2;
  string id = 3;
  string nonce = 4;
}

// Core metadata for all RPC requests.
// This is passed as specially encoded headers with robust dicts,
// but it's nice to have a common definition.
// NOTE: update :RpcMetadataEncoding when changing RpcMetadata
message RpcMetadata {
  // Client
  optional ClientType client_type = 2;
  optional string client_id = 3;
  optional string client_nonce = 4;
  optional string client_access_token = 5;

  // Badges
  message BadgeInfo {
    optional string id = 2;
    optional string key = 3;
    optional string password = 4;
  }
  repeated BadgeInfo badges = 6;
}

// Scope for an operation in the Bench graph.
message GraphScope {
  optional string bench_id = 1;
  optional string package_id = 3;
  optional string transaction_id = 4;
}

// Edit to a Node.
// For updates/moves, the old/new node values are just the edited properties.
// For archive, soft delete and delete, the old node is the full node.
//  (technically we don't *need* if for non-hard deletes, but it's very convenient)
// Similarly, for unarchive/restore, the new node is the full node.
message EditData {
  // Unique identifier for the edit within a transaction.
  string id = 2;
  // Type of edit.
  EditType type = 30;
  // Which node.
  NodeReferenceData node_ptr = 31;
  // Which non-tracking properties are edited in an update or move.
  repeated uint32 properties = 32;
  // The previous values for the edited properties (if any).
  optional google.protobuf.Struct old_node_packed = 33;
  // The new values for the edited properties (if any).
  optional google.protobuf.Struct new_node_packed = 34;
  
  // Enclosing scope of the node.
  GraphScope scope = 40;
  // Who made the edit (subject).
  optional NodeReferenceData subject_ptr = 41;
  // WHo made the edit (client).
  optional ClientOrigin origin = 42;
  // Additional context for server clients.
  optional EditContextData context = 43;
  // When the edit was made.
  google.protobuf.Timestamp edited_at = 44;
  // Revision for the node.
  optional int64 revision = 45;
  // Epoch at that edit.
  optional int64 epoch = 46;
}