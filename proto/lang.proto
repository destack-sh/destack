  optional NodeReferenceData parent_ptr = 4;
  optional NodeReferenceData bench_ptr = 6;
  optional NodeReferenceData package_ptr = 7;
  google.protobuf.Timestamp created_at = 10;
  optional NodeReferenceData created_by_ptr = 11;
  google.protobuf.Timestamp updated_at = 12;
  optional NodeReferenceData updated_by_ptr = 13;
  optional google.protobuf.Timestamp archived_at = 14;
  optional google.protobuf.Timestamp deleted_at = 15;
  optional NodeReferenceData template_ptr = 16;
  NodeMode mode = 20;
  optional string order_key = 22;
  string name = 31;
  ActionCardinality cardinality = 40;
  optional TextData text = 41;
  optional ModelDeveloper model_developer = 100;
  optional ModelProvider model_provider = 101;
  optional string model_id = 102;
  optional string model_name = 103;
  optional int64 max_attempts = 110;
  optional google.protobuf.Duration retry_interval = 111;
  optional double backoff = 112;
}

