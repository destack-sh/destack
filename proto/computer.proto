syntax = "proto3";

package symbolx.computer;

// Computer service :ComputerKit
service Computer {
  // Take a screenshot of the current screen
  rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);

  // Click an element
  rpc Click(ClickRequest) returns (Empty);

  // Double click an element
  rpc DoubleClick(ClickRequest) returns (Empty);

  // Press keys (list)
  rpc Press(PressRequest) returns (Empty);

  // Type text
  rpc Type(TypeRequest) returns (Empty);

  // Move mouse
  rpc Move(MoveRequest) returns (Empty);

  // Scroll mouse
  rpc Scroll(ScrollRequest) returns (Empty);

  // Execute a shell command and return output
  // NOTE :UX: Computer.Shell should probably be streaming?
  rpc Shell(ShellCommandRequest) returns (ShellCommandResponse);
}

message Empty {}

message ScreenshotRequest {}

message ScreenshotResponse {
  bytes image = 1; // Screenshot image bytes
}

message ClickRequest {
  int32 x = 1;
  int32 y = 2;
  string button = 3; // \"left\", \"right\", \"middle\"
}

message PressRequest {
  repeated string keys = 1;
}

message TypeRequest {
  string text = 1;
}

message MoveRequest {
  int32 x = 1;
  int32 y = 2;
}

message ScrollRequest {
  int32 x = 1;
  int32 y = 2;
  int32 scroll_x = 3;
  int32 scroll_y = 4;
}

message ShellCommandRequest {
  string command = 1;
}

message ShellCommandResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
}
