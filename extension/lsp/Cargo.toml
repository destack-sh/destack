[package]
name = "destack_extension_lsp"
description = "Destack Extension Language Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "rust/lib.rs"

[[bin]]
name = "destack_extension_lsp"
path = "rust/main.rs"

[dependencies]
dyst_language_ast = { workspace = true }
dyst_language_token = { workspace = true }
dyst_language_session = { workspace = true }
dyst_language_source = { workspace = true }

# NOTE: vendor LSP types & serde (once Dyst is more mature)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ls-types = { git = "https://github.com/tower-lsp-community/ls-types", branch = "main" }
